<style>
/* Layout: consola portátil — pantalla arriba y controles abajo (vertical), controles a los lados (horizontal), pantalla grande sola (escritorio) */
:root{
  --shell:#15112a;      /* carcasa */
  --shell-2:#211b3f;    /* paneles */
  --shell-3:#30285a;    /* bisel */
  --ink:#f4edff;        /* texto */
  --muted:#a196cf;      /* texto secundario */
  --pink:#ff4f9a;       /* acento A */
  --cyan:#4fe3ff;       /* acento B */
  --sun:#ffb347;        /* atardecer */
  --display:'Pixelify Sans','Trebuchet MS',monospace;
  --ui:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--shell)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--ui);
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(255,79,154,.10), transparent 60%),
    radial-gradient(90% 60% at 50% 100%, rgba(79,227,255,.08), transparent 60%),
    var(--shell);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 16px;position:relative}
#screen{position:relative;width:384px;height:216px;border-radius:8px;overflow:hidden;background:#05030c;
  --px:1px;
  box-shadow:0 0 0 3px #0a0716,0 0 0 7px var(--shell-3),0 0 0 9px #0a0716,0 0 48px -6px rgba(255,79,154,.45),0 0 90px -20px rgba(79,227,255,.35)}
#gl{display:block;width:100%;height:100%;image-rendering:pixelated}
.layer{position:absolute;inset:0}
/* ---------- HUD ---------- */
#hud{pointer-events:none;font-family:var(--ui);font-size:calc(var(--px)*7);line-height:1;letter-spacing:.04em;
  text-shadow:0 var(--px) 0 #000,var(--px) 0 0 #000,0 calc(var(--px)*-1) 0 #000,calc(var(--px)*-1) 0 0 #000}
.hrow{position:absolute;left:calc(var(--px)*6);right:calc(var(--px)*6);top:calc(var(--px)*5);display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--px)*6)}
.hcol{display:flex;flex-direction:column;gap:calc(var(--px)*3)}
.hlab{color:var(--muted);font-size:calc(var(--px)*5)}
.hval{font-variant-numeric:tabular-nums}
.hval.pink{color:var(--pink)}.hval.cyan{color:var(--cyan)}.hval.sun{color:var(--sun)}
.fuel{width:calc(var(--px)*54);height:calc(var(--px)*6);background:#0a0716;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #3a3260;position:relative}
.fuel i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4f6a,#ffb347 45%,#7dff7a);}
.fuel.low i{animation:blink .4s steps(2) infinite}
.lives{display:flex;gap:calc(var(--px)*2)}
.lives b{width:calc(var(--px)*6);height:calc(var(--px)*6);background:var(--cyan);box-shadow:0 0 0 var(--px) #000;clip-path:polygon(20% 0,80% 0,100% 30%,100% 100%,0 100%,0 30%)}
.lives.pinkl b{background:var(--pink);clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%)}
.wpn{display:inline-grid;place-items:center;width:calc(var(--px)*11);height:calc(var(--px)*11);background:#e23a43;color:#fff;box-shadow:0 0 0 var(--px) #000;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*8)}
#radar{position:absolute;right:calc(var(--px)*5);bottom:calc(var(--px)*5);width:calc(var(--px)*60);image-rendering:pixelated;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) rgba(79,227,255,.55);background:rgba(8,6,22,.7)}
.hbl{position:absolute;left:calc(var(--px)*6);bottom:calc(var(--px)*6);display:flex;gap:calc(var(--px)*4)}
.boss{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--px)*24);width:calc(var(--px)*120);display:flex;flex-direction:column;gap:calc(var(--px)*2);align-items:center}
.boss .bar{width:100%;height:calc(var(--px)*5);background:#0a0716;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #5a1f3c}
.boss .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2d6f,#ff9a3c)}
.banner{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);text-align:center;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*16);color:var(--ink);letter-spacing:.06em;
  text-shadow:0 calc(var(--px)*2) 0 #000,0 0 calc(var(--px)*8) rgba(255,79,154,.8)}
.banner small{display:block;text-transform:uppercase;font-family:var(--ui);font-weight:400;font-size:calc(var(--px)*6);color:var(--cyan);margin-top:calc(var(--px)*5);text-shadow:0 var(--px) 0 #000}
@keyframes blink{50%{opacity:.25}}
/* ---------- Menú ---------- */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--px)*9);padding:calc(var(--px)*8)}
.logo{text-align:center;line-height:.9}
.logo .l1,.logo .l2{display:inline-block;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*26);letter-spacing:.02em}
.logo .l1{color:var(--pink);text-shadow:0 calc(var(--px)*2) 0 #3a0c24,0 0 calc(var(--px)*10) rgba(255,79,154,.75)}
.logo .l2{color:var(--cyan);text-shadow:0 calc(var(--px)*2) 0 #0b2a3a,0 0 calc(var(--px)*10) rgba(79,227,255,.7);margin-left:calc(var(--px)*6)}
.logo .sub{display:block;margin-top:calc(var(--px)*5);font-size:calc(var(--px)*6);letter-spacing:.3em;color:var(--sun);text-shadow:0 var(--px) 0 #000}
.carts{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--px)*7);width:100%;max-width:calc(var(--px)*300)}
.cart{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:calc(var(--px)*3);padding:calc(var(--px)*5) calc(var(--px)*4) calc(var(--px)*5);border:0;cursor:pointer;
  background:linear-gradient(#2c2552,#1d1838);color:var(--ink);font-family:var(--ui);font-size:calc(var(--px)*6);text-align:center;
  clip-path:polygon(0 calc(var(--px)*6),calc(var(--px)*6) 0,calc(100% - var(--px)*6) 0,100% calc(var(--px)*6),100% 100%,0 100%);
  box-shadow:inset 0 0 0 var(--px) #463c7c;transition:transform .12s steps(3)}
.cart canvas{width:100%;aspect-ratio:3/2;height:auto;image-rendering:pixelated;background:#0b0818;box-shadow:inset 0 0 0 var(--px) #000}
.cart .cn{font-weight:700;line-height:1.15;min-height:2.3em;display:grid;place-items:center}
.cart .cr{color:var(--muted);font-size:calc(var(--px)*5);font-variant-numeric:tabular-nums}
.cart.sel{transform:translateY(calc(var(--px)*-3));background:linear-gradient(#45306e,#291f4f);box-shadow:inset 0 0 0 var(--px) var(--pink),0 0 0 var(--px) var(--pink)}
.cart.sel .cn{color:var(--pink)}
.cart.locked canvas{filter:saturate(.5) brightness(.8)}
.cart:focus-visible{outline:calc(var(--px)*1) solid var(--cyan);outline-offset:var(--px)}
.mhint{font-size:calc(var(--px)*5.5);color:var(--ink);letter-spacing:.12em;text-align:center;background:rgba(12,8,28,.82);padding:calc(var(--px)*3) calc(var(--px)*7);box-shadow:0 0 0 var(--px) #463c7c}
.mhint b{color:var(--ink);font-weight:400}
.opts{display:flex;gap:calc(var(--px)*6)}
.chip{border:0;cursor:pointer;background:#1d1838;color:var(--muted);font-family:var(--ui);font-size:calc(var(--px)*5.5);padding:calc(var(--px)*3) calc(var(--px)*5);box-shadow:inset 0 0 0 var(--px) #463c7c}
.chip.on{color:var(--cyan);box-shadow:inset 0 0 0 var(--px) var(--cyan)}
.chip:focus-visible{outline:var(--px) solid var(--cyan)}
/* ---------- Paneles ---------- */
#overlay{display:grid;place-items:center;background:rgba(6,4,16,.55)}
.panel{min-width:calc(var(--px)*150);max-width:calc(100% - var(--px)*20);padding:calc(var(--px)*10) calc(var(--px)*12);background:rgba(18,13,38,.95);text-align:center;
  box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) var(--pink),0 0 0 calc(var(--px)*3) #000,0 0 calc(var(--px)*20) rgba(255,79,154,.35);display:flex;flex-direction:column;gap:calc(var(--px)*6);align-items:center}
.panel h2{margin:0;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*15);color:var(--pink);letter-spacing:.04em;text-wrap:balance}
.panel p{margin:0;font-size:calc(var(--px)*6);color:var(--muted);line-height:1.5}
.panel .big{font-size:calc(var(--px)*10);color:var(--ink);font-variant-numeric:tabular-nums}
.mbtn{display:block;width:100%;border:0;cursor:pointer;background:#241d47;color:var(--ink);font-family:var(--ui);font-size:calc(var(--px)*7);padding:calc(var(--px)*4) calc(var(--px)*8);box-shadow:inset 0 0 0 var(--px) #463c7c}
.mbtn.sel{background:var(--pink);color:#1a0b1e;box-shadow:inset 0 0 0 var(--px) #fff}
.mbtn:focus-visible{outline:var(--px) solid var(--cyan)}
.tally{display:grid;grid-template-columns:auto auto;gap:calc(var(--px)*3) calc(var(--px)*10);font-size:calc(var(--px)*6);text-align:left;font-variant-numeric:tabular-nums}
.tally span:nth-child(odd){color:var(--muted)}
#toast{pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--px)*10)}
#screen:has(.hud-ui) #toast{align-items:flex-start;padding:calc(var(--px)*24) 0 0}
#toast span{background:rgba(18,13,38,.94);padding:calc(var(--px)*4) calc(var(--px)*7);font-size:calc(var(--px)*6);box-shadow:0 0 0 var(--px) var(--cyan)}
#rotate{position:absolute;left:0;right:0;bottom:calc(var(--px)*4);text-align:center;font-size:calc(var(--px)*5);color:var(--sun);pointer-events:none}
/* ---------- Controles táctiles ---------- */
#pad{display:none}
#keys{display:none;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;padding:0 16px 14px;line-height:1.8}
#keys kbd{font-family:var(--ui);color:var(--ink);background:var(--shell-2);padding:1px 6px;box-shadow:inset 0 0 0 1px #463c7c}
body:not(.touch) #keys{display:block}
body.touch #pad{display:grid}
.pl,.pr,.pm{display:flex;align-items:center;justify-content:center}
#dpad{position:relative;width:138px;height:138px;touch-action:none}
#dpad::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,#0e0b1e 55%,transparent 72%)}
#dpad .arm{position:absolute;background:linear-gradient(#3a3168,#272048);box-shadow:inset 0 0 0 2px #0b0818,0 4px 0 #0b0818}
#dpad .h{left:0;right:0;top:46px;height:46px;border-radius:8px}
#dpad .v{top:0;bottom:0;left:46px;width:46px;border-radius:8px}
#dpad .hub{position:absolute;left:46px;top:46px;width:46px;height:46px;background:#272048}
#dpad .hub::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#1a1533;box-shadow:inset 0 2px 0 #0b0818}
#dpad .tri{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.55}
#dpad .tu{left:62px;top:10px;border-bottom-color:var(--ink)}
#dpad .td{left:62px;bottom:10px;border-top-color:var(--ink)}
#dpad .tl{top:62px;left:10px;border-right-color:var(--ink)}
#dpad .tr{top:62px;right:10px;border-left-color:var(--ink)}
#dpad.u .tu,#dpad.d .td,#dpad.l .tl,#dpad.r .tr{opacity:1;filter:drop-shadow(0 0 4px var(--cyan))}
#dpad.u .tu{border-bottom-color:var(--cyan)}#dpad.d .td{border-top-color:var(--cyan)}#dpad.l .tl{border-right-color:var(--cyan)}#dpad.r .tr{border-left-color:var(--cyan)}
.abtns{position:relative;width:156px;height:132px}
.rb{position:absolute;width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;touch-action:none;font-family:var(--display);font-weight:700;font-size:24px;color:#1a0b1e;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 5px 0 #0b0818,0 0 0 3px #0b0818}
.rb small{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);font-family:var(--ui);font-weight:400;font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.08em}
#btnA{right:0;top:4px;background:radial-gradient(circle at 35% 30%,#ff9cc6,var(--pink) 60%)}
#btnB{left:0;top:52px;background:radial-gradient(circle at 35% 30%,#b6f4ff,var(--cyan) 60%)}
.rb.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 2px 0 #0b0818,0 0 0 3px #0b0818,0 0 18px currentColor}
#btnA.on{color:#fff}#btnB.on{color:#fff}
.pm{gap:14px}
.pill{border:0;cursor:pointer;touch-action:none;font-family:var(--ui);font-size:10px;letter-spacing:.1em;color:var(--muted);background:#272048;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 #0b0818,inset 0 0 0 2px #0b0818}
.pill.on{color:var(--ink);transform:translateY(2px);box-shadow:0 1px 0 #0b0818,inset 0 0 0 2px #0b0818}
#pad{--s:1}
.pl>*,.pr>*{transform:scale(var(--s))}
.pm{transform:scale(min(var(--s),1.1))}
/* vertical: pantalla de borde a borde con marco mínimo, controles debajo */
body.touch.portrait #stage{padding:0 0 4px;flex:0 0 auto}
body.touch.portrait #screen{border-radius:0;box-shadow:0 0 0 2px #000}
body.touch.portrait #pad{flex:1 1 auto;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;align-content:space-evenly;padding:0 16px 10px;align-items:center}
body.touch.portrait .pm{grid-column:1 / span 2;order:3}
/* horizontal: juego a pantalla completa con controles translúcidos encima */
body.touch.landscape{background:#000}
body.touch.landscape #stage{padding:0}
body.touch.landscape #screen{border-radius:0;box-shadow:none}
body.touch.landscape #pad{position:absolute;inset:0;pointer-events:none;z-index:5}
body.touch.landscape .pl,body.touch.landscape .pr,body.touch.landscape .pm{position:absolute;pointer-events:auto}
body.touch.landscape .pl{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));opacity:.6}
body.touch.landscape .pl>*{transform-origin:left bottom}
body.touch.landscape .pr{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.6}
body.touch.landscape .pr>*{transform-origin:right bottom}
body.touch.landscape .pm{left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.85);opacity:.5}
body.touch.landscape #dpad::before{background:radial-gradient(circle,rgba(14,11,30,.5) 55%,transparent 72%)}
body.touch.landscape .rb small{display:none}
body.ovl.inmenu #pad{display:none}
body.touch.landscape .pl:has(.u,.d,.l,.r),body.touch.landscape .pr:has(.on){opacity:.85}
/* el HUD inferior sube para no quedar bajo los controles */
body.ovl .hbl{bottom:auto;top:calc(var(--px)*26)}
body.ovl #radar{bottom:auto;top:calc(var(--px)*26)}
body.ovl #toast{align-items:flex-start;padding:calc(var(--px)*44) 0 0}

/* ---------- Garaje y mapa (Gas Rally) ---------- */
.hud-ui{pointer-events:auto}
.gtitle{position:absolute;left:calc(var(--px)*8);top:calc(var(--px)*6);font-family:var(--display);font-weight:700;font-size:calc(var(--px)*12);color:var(--cyan);letter-spacing:.06em;text-shadow:0 calc(var(--px)*2) 0 #000,0 0 calc(var(--px)*8) rgba(79,227,255,.7)}
.gpanel{position:absolute;display:flex;flex-direction:column;gap:calc(var(--px)*3);background:rgba(14,10,30,.88);padding:calc(var(--px)*5) calc(var(--px)*6);box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #463c7c;font-size:calc(var(--px)*5.5);text-shadow:none}
.gar.wide .gpanel{right:calc(var(--px)*8);top:calc(var(--px)*24);width:48%}
.gar.narrow .gpanel{left:calc(var(--px)*5);right:calc(var(--px)*5);bottom:calc(var(--px)*5)}
.gar.narrow .gtitle{font-size:calc(var(--px)*9)}
.grow{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--px)*4);padding:calc(var(--px)*2) calc(var(--px)*3);cursor:pointer}
.grow.sel{box-shadow:inset 0 0 0 var(--px) var(--pink);background:rgba(255,79,154,.08)}
.arr{flex:0 0 auto;border:0;cursor:pointer;background:#241d47;color:var(--ink);font-size:calc(var(--px)*6);width:calc(var(--px)*13);height:calc(var(--px)*13);box-shadow:inset 0 0 0 var(--px) #463c7c;font-family:var(--ui)}
.arr:focus-visible,.sw button:focus-visible,.gbtn:focus-visible{outline:var(--px) solid var(--cyan)}
.gname{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:var(--px)}
.gname b{font-family:var(--display);font-weight:700;font-size:calc(var(--px)*10);color:var(--pink);line-height:1;text-shadow:0 0 calc(var(--px)*6) rgba(255,79,154,.5)}
.gname small{font-size:calc(var(--px)*5);color:var(--muted);line-height:1.35;text-wrap:balance}
.gstats{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:calc(var(--px)*2) calc(var(--px)*4);align-items:center;font-size:calc(var(--px)*5);color:var(--muted);padding:0 calc(var(--px)*3)}
.bar5{display:flex;gap:var(--px)}
.bar5 i{width:calc(var(--px)*4);height:calc(var(--px)*3);background:#2e2654}
.bar5 i.on{background:var(--cyan);box-shadow:0 0 calc(var(--px)*2) rgba(79,227,255,.6)}
.glab{color:var(--muted);font-size:calc(var(--px)*5);display:flex;flex-direction:column;gap:var(--px)}
.glab em{font-style:normal;color:var(--ink);font-size:calc(var(--px)*5.5)}
.sw{display:flex;gap:calc(var(--px)*3)}
.sw button{width:calc(var(--px)*11);height:calc(var(--px)*11);border:0;cursor:pointer;box-shadow:inset 0 0 0 var(--px) #000}
.sw button.on{outline:var(--px) solid #fff;outline-offset:var(--px)}
.gbtn{border:0;cursor:pointer;background:var(--pink);color:#1a0b1e;font-family:var(--ui);font-weight:700;font-size:calc(var(--px)*6);padding:calc(var(--px)*4) calc(var(--px)*6)}
.gbtn.sel{box-shadow:0 0 0 var(--px) #fff,0 0 calc(var(--px)*8) rgba(255,79,154,.6)}
.gbtn:disabled{background:#3a3260;color:#8a84a8;cursor:not-allowed}
.wscore{position:absolute;right:calc(var(--px)*8);top:calc(var(--px)*8);display:flex;align-items:baseline;gap:calc(var(--px)*3);font-size:calc(var(--px)*6);text-shadow:0 var(--px) 0 #000}
.wpanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--px)*5);width:min(calc(var(--px)*210),calc(100% - var(--px)*10));display:flex;flex-direction:column;gap:calc(var(--px)*3);background:rgba(14,10,30,.88);padding:calc(var(--px)*4) calc(var(--px)*5);box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #463c7c;text-align:center}
.wnav{display:flex;align-items:center;gap:calc(var(--px)*4)}
.wname{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--px)}
.wname b{font-family:var(--display);font-weight:700;font-size:calc(var(--px)*11);line-height:1;color:var(--ink);text-shadow:0 0 calc(var(--px)*6) rgba(255,79,154,.6)}
.wname small{font-size:calc(var(--px)*5);color:var(--cyan);line-height:1.3}
.flagimg{display:inline-block;height:0.8em;width:auto;image-rendering:pixelated;vertical-align:baseline;box-shadow:0 0 0 var(--px) #000;margin-right:0.15em}
.wst{font-size:calc(var(--px)*5);color:var(--sun)}
.wst.lock{color:#8a84a8}
.wbtns{display:flex;gap:calc(var(--px)*4);justify-content:center}
.wbtns .chip{font-size:calc(var(--px)*5.5)}
.wmap.flying .wpanel{opacity:0;pointer-events:none;transform:translate(-50%,calc(var(--px)*10));transition:opacity .25s,transform .25s}
/* ---------- Rally: ítems, monedas, taller y modos ---------- */
.hline{display:flex;align-items:center;gap:calc(var(--px)*4)}
.islot{display:inline-grid;place-items:center;width:calc(var(--px)*14);height:calc(var(--px)*14);background:rgba(10,7,22,.8);box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #3a3260}
.islot img{width:calc(var(--px)*12);height:calc(var(--px)*12);image-rendering:pixelated}
.islot.on{box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) var(--sun),0 0 calc(var(--px)*7) rgba(255,179,71,.65)}
.coin{display:inline-block;flex:0 0 auto;width:calc(var(--px)*5);height:calc(var(--px)*5);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffd23f 50%,#c48a10);box-shadow:0 0 0 var(--px) #000;vertical-align:middle;margin-right:calc(var(--px)*2)}
.hcoin{display:inline-flex;align-items:center;color:#ffd23f;font-variant-numeric:tabular-nums}
