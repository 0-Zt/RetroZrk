name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK firmado
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Nombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk "PixelArcade-${{ github.run_number }}.apk"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PixelArcade-${{ github.run_number }}
          path: PixelArcade-*.apk

      - name: Publicar en Releases (descarga directa desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pixel Arcade · build ${{ github.run_number }}
          body: APK listo para instalar en Android. Descárgalo desde el teléfono y ábrelo.
          files: PixelArcade-*.apk
