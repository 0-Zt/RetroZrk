<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15112a">
<script>window.__NATIVE_APP = true;</script>
<style>body{margin:0}</style>
<title>Pixel Arcade 3 en 1</title>
<style>
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/pixelify-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/silkscreen-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/silkscreen-latin-700-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: consola portátil — pantalla arriba y controles abajo (vertical), controles a los lados (horizontal), pantalla grande sola (escritorio) */
:root{
  --shell:#15112a;      /* carcasa */
  --shell-2:#211b3f;    /* paneles */
  --shell-3:#30285a;    /* bisel */
  --ink:#f4edff;        /* texto */
  --muted:#a196cf;      /* texto secundario */
  --pink:#ff4f9a;       /* acento A */
  --cyan:#4fe3ff;       /* acento B */
  --sun:#ffb347;        /* atardecer */
  --display:'Pixelify Sans','Trebuchet MS',monospace;
  --ui:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--shell)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--ui);
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(255,79,154,.10), transparent 60%),
    radial-gradient(90% 60% at 50% 100%, rgba(79,227,255,.08), transparent 60%),
    var(--shell);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 16px;position:relative}
#screen{position:relative;width:384px;height:216px;border-radius:8px;overflow:hidden;background:#05030c;
  --px:1px;
  box-shadow:0 0 0 3px #0a0716,0 0 0 7px var(--shell-3),0 0 0 9px #0a0716,0 0 48px -6px rgba(255,79,154,.45),0 0 90px -20px rgba(79,227,255,.35)}
#gl{display:block;width:100%;height:100%;image-rendering:pixelated}
.layer{position:absolute;inset:0}
/* ---------- HUD ---------- */
#hud{pointer-events:none;font-family:var(--ui);font-size:calc(var(--px)*7);line-height:1;letter-spacing:.04em;
  text-shadow:0 var(--px) 0 #000,var(--px) 0 0 #000,0 calc(var(--px)*-1) 0 #000,calc(var(--px)*-1) 0 0 #000}
.hrow{position:absolute;left:calc(var(--px)*6);right:calc(var(--px)*6);top:calc(var(--px)*5);display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--px)*6)}
.hcol{display:flex;flex-direction:column;gap:calc(var(--px)*3)}
.hlab{color:var(--muted);font-size:calc(var(--px)*5)}
.hval{font-variant-numeric:tabular-nums}
.hval.pink{color:var(--pink)}.hval.cyan{color:var(--cyan)}.hval.sun{color:var(--sun)}
.fuel{width:calc(var(--px)*54);height:calc(var(--px)*6);background:#0a0716;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #3a3260;position:relative}
.fuel i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4f6a,#ffb347 45%,#7dff7a);}
.fuel.low i{animation:blink .4s steps(2) infinite}
.lives{display:flex;gap:calc(var(--px)*2)}
.lives b{width:calc(var(--px)*6);height:calc(var(--px)*6);background:var(--cyan);box-shadow:0 0 0 var(--px) #000;clip-path:polygon(20% 0,80% 0,100% 30%,100% 100%,0 100%,0 30%)}
.lives.pinkl b{background:var(--pink);clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%)}
.wpn{display:inline-grid;place-items:center;width:calc(var(--px)*11);height:calc(var(--px)*11);background:#e23a43;color:#fff;box-shadow:0 0 0 var(--px) #000;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*8)}
#radar{position:absolute;right:calc(var(--px)*5);bottom:calc(var(--px)*5);width:calc(var(--px)*60);image-rendering:pixelated;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) rgba(79,227,255,.55);background:rgba(8,6,22,.7)}
.hbl{position:absolute;left:calc(var(--px)*6);bottom:calc(var(--px)*6);display:flex;gap:calc(var(--px)*4)}
.boss{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--px)*24);width:calc(var(--px)*120);display:flex;flex-direction:column;gap:calc(var(--px)*2);align-items:center}
.boss .bar{width:100%;height:calc(var(--px)*5);background:#0a0716;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #5a1f3c}
.boss .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2d6f,#ff9a3c)}
.banner{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);text-align:center;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*16);color:var(--ink);letter-spacing:.06em;
  text-shadow:0 calc(var(--px)*2) 0 #000,0 0 calc(var(--px)*8) rgba(255,79,154,.8)}
.banner small{display:block;font-family:var(--ui);font-weight:400;font-size:calc(var(--px)*6);color:var(--cyan);margin-top:calc(var(--px)*5);text-shadow:0 var(--px) 0 #000}
@keyframes blink{50%{opacity:.25}}
/* ---------- Menú ---------- */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--px)*9);padding:calc(var(--px)*8)}
.logo{text-align:center;line-height:.9}
.logo .l1,.logo .l2{display:inline-block;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*26);letter-spacing:.02em}
.logo .l1{color:var(--pink);text-shadow:0 calc(var(--px)*2) 0 #3a0c24,0 0 calc(var(--px)*10) rgba(255,79,154,.75)}
.logo .l2{color:var(--cyan);text-shadow:0 calc(var(--px)*2) 0 #0b2a3a,0 0 calc(var(--px)*10) rgba(79,227,255,.7);margin-left:calc(var(--px)*6)}
.logo .sub{display:block;margin-top:calc(var(--px)*5);font-size:calc(var(--px)*6);letter-spacing:.3em;color:var(--sun);text-shadow:0 var(--px) 0 #000}
.carts{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--px)*7);width:100%;max-width:calc(var(--px)*300)}
.cart{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:calc(var(--px)*3);padding:calc(var(--px)*5) calc(var(--px)*4) calc(var(--px)*5);border:0;cursor:pointer;
  background:linear-gradient(#2c2552,#1d1838);color:var(--ink);font-family:var(--ui);font-size:calc(var(--px)*6);text-align:center;
  clip-path:polygon(0 calc(var(--px)*6),calc(var(--px)*6) 0,calc(100% - var(--px)*6) 0,100% calc(var(--px)*6),100% 100%,0 100%);
  box-shadow:inset 0 0 0 var(--px) #463c7c;transition:transform .12s steps(3)}
.cart canvas{width:100%;aspect-ratio:3/2;height:auto;image-rendering:pixelated;background:#0b0818;box-shadow:inset 0 0 0 var(--px) #000}
.cart .cn{font-weight:700;line-height:1.15;min-height:2.3em;display:grid;place-items:center}
.cart .cr{color:var(--muted);font-size:calc(var(--px)*5);font-variant-numeric:tabular-nums}
.cart.sel{transform:translateY(calc(var(--px)*-3));background:linear-gradient(#45306e,#291f4f);box-shadow:inset 0 0 0 var(--px) var(--pink),0 0 0 var(--px) var(--pink)}
.cart.sel .cn{color:var(--pink)}
.cart.locked canvas{filter:saturate(.5) brightness(.8)}
.cart:focus-visible{outline:calc(var(--px)*1) solid var(--cyan);outline-offset:var(--px)}
.mhint{font-size:calc(var(--px)*5.5);color:var(--ink);letter-spacing:.12em;text-align:center;background:rgba(12,8,28,.82);padding:calc(var(--px)*3) calc(var(--px)*7);box-shadow:0 0 0 var(--px) #463c7c}
.mhint b{color:var(--ink);font-weight:400}
.opts{display:flex;gap:calc(var(--px)*6)}
.chip{border:0;cursor:pointer;background:#1d1838;color:var(--muted);font-family:var(--ui);font-size:calc(var(--px)*5.5);padding:calc(var(--px)*3) calc(var(--px)*5);box-shadow:inset 0 0 0 var(--px) #463c7c}
.chip.on{color:var(--cyan);box-shadow:inset 0 0 0 var(--px) var(--cyan)}
.chip:focus-visible{outline:var(--px) solid var(--cyan)}
/* ---------- Paneles ---------- */
#overlay{display:grid;place-items:center;background:rgba(6,4,16,.55)}
.panel{min-width:calc(var(--px)*150);max-width:calc(100% - var(--px)*20);padding:calc(var(--px)*10) calc(var(--px)*12);background:rgba(18,13,38,.95);text-align:center;
  box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) var(--pink),0 0 0 calc(var(--px)*3) #000,0 0 calc(var(--px)*20) rgba(255,79,154,.35);display:flex;flex-direction:column;gap:calc(var(--px)*6);align-items:center}
.panel h2{margin:0;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*15);color:var(--pink);letter-spacing:.04em;text-wrap:balance}
.panel p{margin:0;font-size:calc(var(--px)*6);color:var(--muted);line-height:1.5}
.panel .big{font-size:calc(var(--px)*10);color:var(--ink);font-variant-numeric:tabular-nums}
.mbtn{display:block;width:100%;border:0;cursor:pointer;background:#241d47;color:var(--ink);font-family:var(--ui);font-size:calc(var(--px)*7);padding:calc(var(--px)*4) calc(var(--px)*8);box-shadow:inset 0 0 0 var(--px) #463c7c}
.mbtn.sel{background:var(--pink);color:#1a0b1e;box-shadow:inset 0 0 0 var(--px) #fff}
.mbtn:focus-visible{outline:var(--px) solid var(--cyan)}
.tally{display:grid;grid-template-columns:auto auto;gap:calc(var(--px)*3) calc(var(--px)*10);font-size:calc(var(--px)*6);text-align:left;font-variant-numeric:tabular-nums}
.tally span:nth-child(odd){color:var(--muted)}
#toast{pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--px)*10)}
#screen:has(.hud-ui) #toast{align-items:flex-start;padding:calc(var(--px)*24) 0 0}
#toast span{background:rgba(18,13,38,.94);padding:calc(var(--px)*4) calc(var(--px)*7);font-size:calc(var(--px)*6);box-shadow:0 0 0 var(--px) var(--cyan)}
#rotate{position:absolute;left:0;right:0;bottom:calc(var(--px)*4);text-align:center;font-size:calc(var(--px)*5);color:var(--sun);pointer-events:none}
/* ---------- Controles táctiles ---------- */
#pad{display:none}
#keys{display:none;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;padding:0 16px 14px;line-height:1.8}
#keys kbd{font-family:var(--ui);color:var(--ink);background:var(--shell-2);padding:1px 6px;box-shadow:inset 0 0 0 1px #463c7c}
body:not(.touch) #keys{display:block}
body.touch #pad{display:grid}
.pl,.pr,.pm{display:flex;align-items:center;justify-content:center}
#dpad{position:relative;width:138px;height:138px;touch-action:none}
#dpad::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,#0e0b1e 55%,transparent 72%)}
#dpad .arm{position:absolute;background:linear-gradient(#3a3168,#272048);box-shadow:inset 0 0 0 2px #0b0818,0 4px 0 #0b0818}
#dpad .h{left:0;right:0;top:46px;height:46px;border-radius:8px}
#dpad .v{top:0;bottom:0;left:46px;width:46px;border-radius:8px}
#dpad .hub{position:absolute;left:46px;top:46px;width:46px;height:46px;background:#272048}
#dpad .hub::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#1a1533;box-shadow:inset 0 2px 0 #0b0818}
#dpad .tri{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.55}
#dpad .tu{left:62px;top:10px;border-bottom-color:var(--ink)}
#dpad .td{left:62px;bottom:10px;border-top-color:var(--ink)}
#dpad .tl{top:62px;left:10px;border-right-color:var(--ink)}
#dpad .tr{top:62px;right:10px;border-left-color:var(--ink)}
#dpad.u .tu,#dpad.d .td,#dpad.l .tl,#dpad.r .tr{opacity:1;filter:drop-shadow(0 0 4px var(--cyan))}
#dpad.u .tu{border-bottom-color:var(--cyan)}#dpad.d .td{border-top-color:var(--cyan)}#dpad.l .tl{border-right-color:var(--cyan)}#dpad.r .tr{border-left-color:var(--cyan)}
.abtns{position:relative;width:156px;height:132px}
.rb{position:absolute;width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;touch-action:none;font-family:var(--display);font-weight:700;font-size:24px;color:#1a0b1e;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 5px 0 #0b0818,0 0 0 3px #0b0818}
.rb small{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);font-family:var(--ui);font-weight:400;font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.08em}
#btnA{right:0;top:4px;background:radial-gradient(circle at 35% 30%,#ff9cc6,var(--pink) 60%)}
#btnB{left:0;top:52px;background:radial-gradient(circle at 35% 30%,#b6f4ff,var(--cyan) 60%)}
.rb.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 2px 0 #0b0818,0 0 0 3px #0b0818,0 0 18px currentColor}
#btnA.on{color:#fff}#btnB.on{color:#fff}
.pm{gap:14px}
.pill{border:0;cursor:pointer;touch-action:none;font-family:var(--ui);font-size:10px;letter-spacing:.1em;color:var(--muted);background:#272048;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 #0b0818,inset 0 0 0 2px #0b0818}
.pill.on{color:var(--ink);transform:translateY(2px);box-shadow:0 1px 0 #0b0818,inset 0 0 0 2px #0b0818}
#pad{--s:1}
.pl>*,.pr>*{transform:scale(var(--s))}
.pm{transform:scale(min(var(--s),1.1))}
/* vertical: pantalla de borde a borde con marco mínimo, controles debajo */
body.touch.portrait #stage{padding:0 0 4px;flex:0 0 auto}
body.touch.portrait #screen{border-radius:0;box-shadow:0 0 0 2px #000}
body.touch.portrait #pad{flex:1 1 auto;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;align-content:space-evenly;padding:0 16px 10px;align-items:center}
body.touch.portrait .pm{grid-column:1 / span 2;order:3}
/* horizontal: juego a pantalla completa con controles translúcidos encima */
body.touch.landscape{background:#000}
body.touch.landscape #stage{padding:0}
body.touch.landscape #screen{border-radius:0;box-shadow:none}
body.touch.landscape #pad{position:absolute;inset:0;pointer-events:none;z-index:5}
body.touch.landscape .pl,body.touch.landscape .pr,body.touch.landscape .pm{position:absolute;pointer-events:auto}
body.touch.landscape .pl{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));opacity:.6}
body.touch.landscape .pl>*{transform-origin:left bottom}
body.touch.landscape .pr{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.6}
body.touch.landscape .pr>*{transform-origin:right bottom}
body.touch.landscape .pm{left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.85);opacity:.5}
body.touch.landscape #dpad::before{background:radial-gradient(circle,rgba(14,11,30,.5) 55%,transparent 72%)}
body.touch.landscape .rb small{display:none}
body.ovl.inmenu #pad{display:none}
body.touch.landscape .pl:has(.u,.d,.l,.r),body.touch.landscape .pr:has(.on){opacity:.85}
/* el HUD inferior sube para no quedar bajo los controles */
body.ovl .hbl{bottom:auto;top:calc(var(--px)*26)}
body.ovl #radar{bottom:auto;top:calc(var(--px)*26)}
body.ovl #toast{align-items:flex-start;padding:calc(var(--px)*44) 0 0}

/* ---------- Garaje y mapa (Gas Rally) ---------- */
.hud-ui{pointer-events:auto}
.gtitle{position:absolute;left:calc(var(--px)*8);top:calc(var(--px)*6);font-family:var(--display);font-weight:700;font-size:calc(var(--px)*12);color:var(--cyan);letter-spacing:.06em;text-shadow:0 calc(var(--px)*2) 0 #000,0 0 calc(var(--px)*8) rgba(79,227,255,.7)}
.gpanel{position:absolute;display:flex;flex-direction:column;gap:calc(var(--px)*3);background:rgba(14,10,30,.88);padding:calc(var(--px)*5) calc(var(--px)*6);box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #463c7c;font-size:calc(var(--px)*5.5);text-shadow:none}
.gar.wide .gpanel{right:calc(var(--px)*8);top:calc(var(--px)*24);width:48%}
.gar.narrow .gpanel{left:calc(var(--px)*5);right:calc(var(--px)*5);bottom:calc(var(--px)*5)}
.gar.narrow .gtitle{font-size:calc(var(--px)*9)}
.grow{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--px)*4);padding:calc(var(--px)*2) calc(var(--px)*3);cursor:pointer}
.grow.sel{box-shadow:inset 0 0 0 var(--px) var(--pink);background:rgba(255,79,154,.08)}
.arr{flex:0 0 auto;border:0;cursor:pointer;background:#241d47;color:var(--ink);font-size:calc(var(--px)*6);width:calc(var(--px)*13);height:calc(var(--px)*13);box-shadow:inset 0 0 0 var(--px) #463c7c;font-family:var(--ui)}
.arr:focus-visible,.sw button:focus-visible,.gbtn:focus-visible{outline:var(--px) solid var(--cyan)}
.gname{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:var(--px)}
.gname b{font-family:var(--display);font-weight:700;font-size:calc(var(--px)*10);color:var(--pink);line-height:1;text-shadow:0 0 calc(var(--px)*6) rgba(255,79,154,.5)}
.gname small{font-size:calc(var(--px)*5);color:var(--muted);line-height:1.35;text-wrap:balance}
.gstats{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:calc(var(--px)*2) calc(var(--px)*4);align-items:center;font-size:calc(var(--px)*5);color:var(--muted);padding:0 calc(var(--px)*3)}
.bar5{display:flex;gap:var(--px)}
.bar5 i{width:calc(var(--px)*4);height:calc(var(--px)*3);background:#2e2654}
.bar5 i.on{background:var(--cyan);box-shadow:0 0 calc(var(--px)*2) rgba(79,227,255,.6)}
.glab{color:var(--muted);font-size:calc(var(--px)*5);display:flex;flex-direction:column;gap:var(--px)}
.glab em{font-style:normal;color:var(--ink);font-size:calc(var(--px)*5.5)}
.sw{display:flex;gap:calc(var(--px)*3)}
.sw button{width:calc(var(--px)*11);height:calc(var(--px)*11);border:0;cursor:pointer;box-shadow:inset 0 0 0 var(--px) #000}
.sw button.on{outline:var(--px) solid #fff;outline-offset:var(--px)}
.gbtn{border:0;cursor:pointer;background:var(--pink);color:#1a0b1e;font-family:var(--ui);font-weight:700;font-size:calc(var(--px)*6);padding:calc(var(--px)*4) calc(var(--px)*6)}
.gbtn.sel{box-shadow:0 0 0 var(--px) #fff,0 0 calc(var(--px)*8) rgba(255,79,154,.6)}
.gbtn:disabled{background:#3a3260;color:#8a84a8;cursor:not-allowed}
.wscore{position:absolute;right:calc(var(--px)*8);top:calc(var(--px)*8);display:flex;align-items:baseline;gap:calc(var(--px)*3);font-size:calc(var(--px)*6);text-shadow:0 var(--px) 0 #000}
.wpanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--px)*5);width:min(calc(var(--px)*210),calc(100% - var(--px)*10));display:flex;flex-direction:column;gap:calc(var(--px)*3);background:rgba(14,10,30,.88);padding:calc(var(--px)*4) calc(var(--px)*5);box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #463c7c;text-align:center}
.wnav{display:flex;align-items:center;gap:calc(var(--px)*4)}
.wname{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--px)}
.wname b{font-family:var(--display);font-weight:700;font-size:calc(var(--px)*11);line-height:1;color:var(--ink);text-shadow:0 0 calc(var(--px)*6) rgba(255,79,154,.6)}
.wname small{font-size:calc(var(--px)*5);color:var(--cyan);line-height:1.3}
.flagimg{display:inline-block;height:0.8em;width:auto;image-rendering:pixelated;vertical-align:baseline;box-shadow:0 0 0 var(--px) #000;margin-right:0.15em}
.wst{font-size:calc(var(--px)*5);color:var(--sun)}
.wst.lock{color:#8a84a8}
.wbtns{display:flex;gap:calc(var(--px)*4);justify-content:center}
.wbtns .chip{font-size:calc(var(--px)*5.5)}
.wmap.flying .wpanel{opacity:0;pointer-events:none;transform:translate(-50%,calc(var(--px)*10));transition:opacity .25s,transform .25s}

<script type="module">
// =====================================================================
//  CORE · render pixel-perfect, post CRT, utilidades, input, audio
// =====================================================================
const THREE = window.THREE; // three.js r160 (UMD desde jsDelivr)
THREE.ColorManagement.enabled = false;

const H = 216;
const STEP = 1 / 60;
const Engine = { W: 384, H, time: 0, touch: false, crt: true, flash: 0, flashCol: [1, 1, 1], shakeT: 0, shakeA: 0 };

// ---------- utilidades
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (a) => a[(Math.random() * a.length) | 0];
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
function rng32(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const Store = {
  get(k, d) { try { const v = localStorage.getItem('pxa_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pxa_' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};
const pad6 = (n) => String(Math.max(0, Math.floor(n))).padStart(6, '0');

// ---------- color
const _rgbCache = {};
function rgb(hex) {
  if (_rgbCache[hex]) return _rgbCache[hex];
  const n = parseInt(hex.slice(1), 16);
  return (_rgbCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
}
function hexNum(hex) { return parseInt(hex.slice(1), 16); }

// ---------- lienzo pixel
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w + (w & 1); c.height = h + (h & 1);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  return { c, g, w: c.width, h: c.height };
}
function R(g, col, x, y, w = 1, h = 1) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), w, h); }
function disc(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let y = Math.floor(cy - r - 1); y <= Math.ceil(cy + r); y++) {
    const dy = y + 0.5 - cy;
    if (Math.abs(dy) > r) continue;
    const hw = Math.sqrt(r * r - dy * dy);
    const x0 = Math.ceil(cx - hw - 0.5), x1 = Math.floor(cx + hw - 0.5);
    if (x1 >= x0) g.fillRect(x0, y, x1 - x0 + 1, 1);
  }
}
function ellipse(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry); y++) {
    const dy = (y + 0.5 - cy) / ry;
    if (Math.abs(dy) > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy);
    const x0 = Math.ceil(cx - hw - 0.5), x1 = Math.floor(cx + hw - 0.5);
    if (x1 >= x0) g.fillRect(x0, y, x1 - x0 + 1, 1);
  }
}
function poly(g, pts, col) {
  g.fillStyle = col;
  let minY = 1e9, maxY = -1e9;
  for (const p of pts) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + ((yc - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
    }
    xs.sort((p, q) => p - q);
    for (let i = 0; i + 1 < xs.length; i += 2) {
      const x0 = Math.ceil(xs[i] - 0.5), x1 = Math.floor(xs[i + 1] - 0.5);
      if (x1 >= x0) g.fillRect(x0, y, x1 - x0 + 1, 1);
    }
  }
}
function line(g, x0, y0, x1, y1, col, w = 1) {
  g.fillStyle = col;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  const o = Math.floor(w / 2);
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    g.fillRect(Math.round(x0 + (x1 - x0) * t) - o, Math.round(y0 + (y1 - y0) * t) - o, w, w);
  }
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
// recorre los pixeles de un canvas
function mapPixels(c, fn) {
  const g = c.getContext('2d');
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) fn(d, (y * c.width + x) * 4, x, y);
  g.putImageData(im, 0, 0);
  return c;
}
// contorno de 1px alrededor de lo opaco (estética 8/16 bits)
function outline(c, col = '#120d20') {
  const g = c.getContext('2d');
  const w = c.width, h = c.height;
  const im = g.getImageData(0, 0, w, h), d = im.data;
  const a = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 127 ? 1 : 0;
  const [r, gg, b] = rgb(col);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (a[i]) { d[i * 4 + 3] = 255; continue; }
    if ((x > 0 && a[i - 1]) || (x < w - 1 && a[i + 1]) || (y > 0 && a[i - w]) || (y < h - 1 && a[i + w])) {
      d[i * 4] = r; d[i * 4 + 1] = gg; d[i * 4 + 2] = b; d[i * 4 + 3] = 255;
    } else d[i * 4 + 3] = 0;
  }
  g.putImageData(im, 0, 0);
  return c;
}
function ditherOut(c, amount, ox = 0, oy = 0) {
  return mapPixels(c, (d, i, x, y) => { if (bayer(x + ox, y + oy) < amount) d[i + 3] = 0; });
}
function whiten(src, col = '#ffffff') {
  const { c, g } = mk(src.width, src.height);
  g.drawImage(src, 0, 0);
  const [r, gg, b] = rgb(col);
  return mapPixels(c, (d, i) => { if (d[i + 3] > 0) { d[i] = r; d[i + 1] = gg; d[i + 2] = b; } });
}
function darken(src, k = 0.55) {
  const { c, g } = mk(src.width, src.height);
  g.drawImage(src, 0, 0);
  return mapPixels(c, (d, i) => { d[i] *= k; d[i + 1] *= k; d[i + 2] *= k * 1.1; });
}
function rot90(src, k) {
  k = ((k % 4) + 4) % 4;
  const sw = src.width, sh = src.height;
  const { c, g } = mk(k & 1 ? sh : sw, k & 1 ? sw : sh);
  g.translate(c.width / 2, c.height / 2);
  g.rotate((k * Math.PI) / 2);
  g.drawImage(src, -sw / 2, -sh / 2);
  return c;
}

// ---------- fuente pixel 3x5
const F3 = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001011001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', '+': '000010111010000', '-': '000000111000000', '!': '010010010000010', '.': '000000000000010',
  '?': '110001010000010', ' ': '000000000000000', ':': '000010000010000', '/': '001001010100100',
};
const F5 = {
  M: '1000111011101011000110001', S: '0111110000011100000111110', L: '1000010000100001000011111',
  F: '1111110000111101000010000', B: '1111010001111101000111110', R: '1111010001111101010010010',
  H: '1000110001111111000110001',
};
function glyph(g, ch, x, y, col, big = false) {
  const set = big ? F5 : F3, n = big ? 5 : 3, bits = set[ch] || set[' '] || F3[' '];
  g.fillStyle = col;
  for (let i = 0; i < bits.length; i++) if (bits[i] === '1') g.fillRect(x + (i % n), y + Math.floor(i / n), 1, 1);
}
function textCanvas(str, col = '#ffffff', oc = '#120d20') {
  str = str.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const { c, g } = mk(str.length * 4 + 2, 8);
  for (let i = 0; i < str.length; i++) glyph(g, str[i], 1 + i * 4, 1, col);
  return outline(c, oc);
}

// ---------- texturas
function T(c) {
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.w = c.width; t.h = c.height; t.src = c;
  return t;
}
const _txtCache = new Map();
function textTex(str, col = '#ffffff') {
  const k = str + col;
  if (!_txtCache.has(k)) _txtCache.set(k, T(textCanvas(str, col)));
  return _txtCache.get(k);
}

// ---------- renderer
const glCanvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setClearColor(0x07050f, 1);
const rt = new THREE.WebGLRenderTarget(Engine.W, H, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false, depthBuffer: true });
const cam = new THREE.OrthographicCamera(0, Engine.W, 0, -H, 0.1, 1000);
cam.position.set(0, 0, 500);
function setCam(x, y) {
  let sx = 0, sy = 0;
  if (Engine.shakeT > 0) { sx = (Math.random() * 2 - 1) * Engine.shakeA; sy = (Math.random() * 2 - 1) * Engine.shakeA; }
  cam.position.x = Math.round(x + sx);
  cam.position.y = -Math.round(y + sy);
}
function shake(a, t) { Engine.shakeA = Math.max(Engine.shakeA * (Engine.shakeT > 0 ? 1 : 0), a); Engine.shakeT = Math.max(Engine.shakeT, t); }
function flash(a = 0.6, col = [1, 1, 1]) { Engine.flash = Math.max(Engine.flash, a); Engine.flashCol = col; }

// post-proceso: escalado nítido (sharp-bilinear) + CRT moderno (curvatura, scanlines, glow, viñeta)
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: rt.texture }, res: { value: new THREE.Vector2(Engine.W, H) },
    crt: { value: 1 }, flash: { value: 0 }, flashCol: { value: new THREE.Vector3(1, 1, 1) },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 res; uniform float crt; uniform float flash; uniform vec3 flashCol;
    varying vec2 vUv;
    vec3 tex(vec2 uv){
      vec2 px = uv * res;
      vec2 seam = floor(px + 0.5);
      vec2 d = px - seam;
      vec2 fw = max(fwidth(px), vec2(1e-4));
      px = seam + clamp(d / fw, -0.5, 0.5);
      return texture2D(tDiffuse, px / res).rgb;
    }
    void main(){
      vec2 uv = vUv;
      vec2 cc = uv * 2.0 - 1.0;
      if (crt > 0.5) {
        cc += cc * (cc.yx * cc.yx) * 0.03;
        uv = cc * 0.5 + 0.5;
        if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
      }
      vec3 col = tex(uv);
      if (crt > 0.5) {
        float ca = 0.45 / res.x * dot(cc, cc);
        col.r = mix(col.r, tex(uv + vec2(ca, 0.0)).r, 0.7);
        col.b = mix(col.b, tex(uv - vec2(ca, 0.0)).b, 0.7);
        vec2 t = 1.0 / res;
        vec3 gl = texture2D(tDiffuse, uv + vec2(1.5, 0.0) * t).rgb + texture2D(tDiffuse, uv - vec2(1.5, 0.0) * t).rgb
                + texture2D(tDiffuse, uv + vec2(0.0, 1.5) * t).rgb + texture2D(tDiffuse, uv - vec2(0.0, 1.5) * t).rgb
                + texture2D(tDiffuse, uv + vec2(3.0, 2.0) * t).rgb + texture2D(tDiffuse, uv - vec2(3.0, 2.0) * t).rgb
                + texture2D(tDiffuse, uv + vec2(-2.0, 3.0) * t).rgb + texture2D(tDiffuse, uv - vec2(-2.0, 3.0) * t).rgb;
        gl *= 0.125;
        col += max(gl - 0.5, 0.0) * 0.85;
        float sy = fract(uv.y * res.y);
        col *= 1.0 - 0.22 * pow(abs(sy - 0.5) * 2.0, 2.0);
        col *= 1.0 - 0.18 * dot(cc, cc);
        col = mix(col, col * col * (3.0 - 2.0 * col), 0.25);
      }
      col = mix(col, flashCol, flash);
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

function renderScene(scene) {
  postMat.uniforms.crt.value = Engine.crt ? 1 : 0;
  postMat.uniforms.flash.value = Engine.flash;
  postMat.uniforms.flashCol.value.set(...Engine.flashCol);
  renderer.setRenderTarget(rt);
  renderer.render(scene, cam);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}
function setInternalWidth(W) {
  if (W === Engine.W) return false;
  Engine.W = W;
  rt.setSize(W, H);
  postMat.uniforms.res.value.set(W, H);
  cam.right = W; cam.updateProjectionMatrix();
  return true;
}

// ---------- sprites
const QUAD = new THREE.PlaneGeometry(1, 1);
class Spr {
  constructor(parent, t, z = 0, o = {}) {
    this.mat = new THREE.MeshBasicMaterial({
      map: t, transparent: !!o.transparent, alphaTest: o.transparent ? 0.02 : 0.5, depthWrite: !o.transparent,
      opacity: o.opacity ?? 1, blending: o.add ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    if (o.color) this.mat.color.setHex(o.color);
    this.m = new THREE.Mesh(QUAD, this.mat);
    this.m.position.z = z;
    this.m.frustumCulled = false;
    this.parent = parent;
    parent.add(this.m);
    this.flip = false; this.w = 1; this.h = 1; this.k = 1;
    this.set(t);
  }
  set(t) {
    if (this.mat.map !== t) this.mat.map = t;
    if (t.w !== this.w || t.h !== this.h) { this.w = t.w; this.h = t.h; this.rescale(); }
    return this;
  }
  rescale() { this.m.scale.set((this.flip ? -1 : 1) * this.w * this.k, this.h * this.k, 1); }
  // escala entera (2x, 3x, 4x) para mantener el pixel nítido
  scaleBy(k) { if (k !== this.k) { this.k = k; this.rescale(); } return this; }
  setFlip(f) { if (f !== this.flip) { this.flip = f; this.rescale(); } return this; }
  tint(hex) { this.mat.color.set(hex); return this; }
  // posiciona por centro, alineado a la grilla de pixeles
  at(x, y) {
    const w = this.w * this.k, h = this.h * this.k;
    this.m.position.x = Math.round(x - w / 2) + w / 2;
    this.m.position.y = -(Math.round(y - h / 2) + h / 2);
    return this;
  }
  // posiciona por un punto ancla (pixel del canvas), respetando espejo horizontal
  anchor(x, y, ax, ay) {
    const axx = this.flip ? this.w - ax : ax;
    this.m.position.x = Math.round(x - axx) + this.w / 2;
    this.m.position.y = -(Math.round(y - ay) + this.h / 2);
    return this;
  }
  show(v) { this.m.visible = v; return this; }
  get visible() { return this.m.visible; }
  rot(a) { this.m.rotation.z = a; return this; }
  z(v) { this.m.position.z = v; return this; }
  remove() { this.parent.remove(this.m); this.mat.dispose(); }
}

// ---------- partículas: un único draw call de puntos cuadrados (= pixeles)
class Particles {
  constructor(parent, max = 900, z = 40) {
    this.max = max; this.n = 0; this.z = z;
    this.pos = new Float32Array(max * 3); this.col = new Float32Array(max * 3); this.sz = new Float32Array(max);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('pcol', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('psize', new THREE.BufferAttribute(this.sz, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setDrawRange(0, 0);
    this.geo = geo;
    const mat = new THREE.ShaderMaterial({
      vertexShader: 'attribute float psize; attribute vec3 pcol; varying vec3 vC; void main(){ vC = pcol; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_PointSize = psize; }',
      fragmentShader: 'varying vec3 vC; void main(){ gl_FragColor = vec4(vC, 1.0); }',
    });
    this.pts = new THREE.Points(geo, mat);
    this.pts.frustumCulled = false;
    parent.add(this.pts);
    const F = () => new Float32Array(max);
    this.x = F(); this.y = F(); this.vx = F(); this.vy = F(); this.t = F(); this.ttl = F(); this.g = F(); this.dr = F();
    this.r0 = F(); this.g0 = F(); this.b0 = F(); this.r1 = F(); this.g1 = F(); this.b1 = F(); this.s0 = F(); this.s1 = F(); this.zz = F();
  }
  emit(x, y, vx, vy, ttl, c0, c1 = c0, s0 = 1, s1 = s0, grav = 0, drag = 0, z = 0) {
    if (this.n >= this.max) return;
    const i = this.n++;
    this.x[i] = x; this.y[i] = y; this.vx[i] = vx; this.vy[i] = vy; this.t[i] = 0; this.ttl[i] = ttl; this.g[i] = grav; this.dr[i] = drag;
    this.r0[i] = ((c0 >> 16) & 255) / 255; this.g0[i] = ((c0 >> 8) & 255) / 255; this.b0[i] = (c0 & 255) / 255;
    this.r1[i] = ((c1 >> 16) & 255) / 255; this.g1[i] = ((c1 >> 8) & 255) / 255; this.b1[i] = (c1 & 255) / 255;
    this.s0[i] = s0; this.s1[i] = s1; this.zz[i] = z;
  }
  burst(x, y, n, speed, ttl, c0, c1, s0 = 1, s1 = 1, grav = 0, drag = 2) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7);
      this.emit(x, y, Math.cos(a) * v, Math.sin(a) * v, ttl * (0.6 + Math.random() * 0.6), c0, c1, s0, s1, grav, drag);
    }
  }
  kill(i) {
    const j = --this.n;
    if (i === j) return;
    for (const k of ['x', 'y', 'vx', 'vy', 't', 'ttl', 'g', 'dr', 'r0', 'g0', 'b0', 'r1', 'g1', 'b1', 's0', 's1', 'zz']) this[k][i] = this[k][j];
  }
  clear() { this.n = 0; this.geo.setDrawRange(0, 0); }
  update(dt) {
    let i = 0;
    while (i < this.n) {
      this.t[i] += dt;
      if (this.t[i] >= this.ttl[i]) { this.kill(i); continue; }
      this.vy[i] += this.g[i] * dt;
      if (this.dr[i]) { const k = Math.max(0, 1 - this.dr[i] * dt); this.vx[i] *= k; this.vy[i] *= k; }
      this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt;
      i++;
    }
  }
  sync() {
    for (let i = 0; i < this.n; i++) {
      const u = this.t[i] / this.ttl[i];
      const s = Math.max(0, Math.round(this.s0[i] + (this.s1[i] - this.s0[i]) * u));
      const off = s & 1 ? 0.5 : 0;
      this.pos[i * 3] = Math.floor(this.x[i]) + off;
      this.pos[i * 3 + 1] = -(Math.floor(this.y[i]) + off);
      this.pos[i * 3 + 2] = this.z + this.zz[i];
      this.col[i * 3] = this.r0[i] + (this.r1[i] - this.r0[i]) * u;
      this.col[i * 3 + 1] = this.g0[i] + (this.g1[i] - this.g0[i]) * u;
      this.col[i * 3 + 2] = this.b0[i] + (this.b1[i] - this.b0[i]) * u;
      this.sz[i] = s;
    }
    this.geo.setDrawRange(0, this.n);
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.pcol.needsUpdate = true;
    this.geo.attributes.psize.needsUpdate = true;
  }
}

// ---------- entrada: teclado + táctil + gamepad, con "latch" para toques rápidos
const Input = (() => {
  const ACTS = ['left', 'right', 'up', 'down', 'a', 'b', 'start', 'select'];
  const KEYS = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyZ: 'a', Space: 'a', KeyJ: 'a', KeyX: 'b', KeyK: 'b', ShiftLeft: 'b', Enter: 'start', KeyP: 'start', Escape: 'start', Backspace: 'select', Tab: 'select',
  };
  const kb = {}, touch = {}, latch = {}, pad = {}, held = {}, prev = {}, pressed = {};
  const api = { held, pressed, touch, onKey: null, anyPressed: false };
  addEventListener('keydown', (e) => {
    if (e.code === 'KeyM' && !e.repeat) api.onKey && api.onKey('mute');
    if (e.code === 'KeyC' && !e.repeat) api.onKey && api.onKey('crt');
    const a = KEYS[e.code];
    if (!a) return;
    e.preventDefault();
    Snd.unlock();
    if (!e.repeat) { kb[a] = true; latch[a] = true; }
  });
  addEventListener('keyup', (e) => { const a = KEYS[e.code]; if (a) { kb[a] = false; e.preventDefault(); } });
  addEventListener('blur', () => { for (const k in kb) kb[k] = false; for (const k in touch) touch[k] = false; });
  function pollPad() {
    for (const a of ACTS) pad[a] = false;
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
      if (!gp) continue;
      const b = (i) => gp.buttons[i] && gp.buttons[i].pressed;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      pad.left = pad.left || b(14) || ax < -0.45; pad.right = pad.right || b(15) || ax > 0.45;
      pad.up = pad.up || b(12) || ay < -0.45; pad.down = pad.down || b(13) || ay > 0.45;
      pad.a = pad.a || b(0); pad.b = pad.b || b(2) || b(1); pad.start = pad.start || b(9); pad.select = pad.select || b(8);
    }
  }
  api.poll = () => {
    pollPad();
    let any = false;
    for (const a of ACTS) {
      const h = !!(kb[a] || touch[a] || latch[a] || pad[a]);
      pressed[a] = h && !prev[a];
      if (pressed[a]) any = true;
      held[a] = h;
    }
    api.anyPressed = any;
  };
  api.end = () => { for (const a of ACTS) { prev[a] = held[a]; latch[a] = false; } };
  api.reset = () => { for (const a of ACTS) { kb[a] = false; latch[a] = false; prev[a] = true; held[a] = false; pressed[a] = false; } };
  api.latch = (a) => { latch[a] = true; };
  return api;
})();

// ---------- audio chiptune (WebAudio puro: ondas de pulso, triángulo y ruido)
const Snd = (() => {
  let ctx = null, master, sfx, mus, noiseBuf, pulse = {};
  let muted = Store.get('muted', false), pending = null;
  const last = {};
  const api = {};
  api.isMuted = () => muted;
  api.unlock = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ctx = new AC(); } catch (e) { return; }
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ctx.destination);
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      sfx = ctx.createGain(); sfx.gain.value = 0.55; sfx.connect(comp);
      mus = ctx.createGain(); mus.gain.value = 0.3; mus.connect(comp);
      comp.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const mkPulse = (duty) => {
        const n = 48, re = new Float32Array(n), im = new Float32Array(n);
        for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
        return ctx.createPeriodicWave(re, im);
      };
      pulse.p25 = mkPulse(0.25); pulse.p12 = mkPulse(0.125);
      if (pending) { const s = pending; pending = null; api.play(s); }
    }
    if (ctx.state === 'suspended') ctx.resume();
  };
  api.toggleMute = () => {
    muted = !muted; Store.set('muted', muted);
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.6, ctx.currentTime, 0.02);
    return muted;
  };
  api.suspend = () => { if (ctx && ctx.state === 'running') ctx.suspend(); };
  api.resume = () => { if (ctx && ctx.state === 'suspended') ctx.resume(); };
  function osc(type) {
    const o = ctx.createOscillator();
    if (pulse[type]) o.setPeriodicWave(pulse[type]); else o.type = type;
    return o;
  }
  function tone(type, f0, f1, dur, vol = 0.3, delay = 0, dest = sfx) {
    const t = ctx.currentTime + delay;
    const o = osc(type), g = ctx.createGain();
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol = 0.3, f0 = 3000, f1 = 300, ft = 'lowpass', delay = 0, dest = sfx, q = 0.8) {
    const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = ft; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  }
  const N = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const SFX = {
    select: () => { tone('p25', 660, 990, 0.07, 0.22); },
    move: () => { tone('p12', 520, 520, 0.04, 0.15); },
    start: () => { [72, 76, 79, 84].forEach((m, i) => tone('p25', N(m), N(m), 0.1, 0.22, i * 0.07)); },
    back: () => { tone('p25', 600, 300, 0.1, 0.2); },
    pause: () => { tone('p25', 880, 880, 0.06, 0.2); tone('p25', 660, 660, 0.08, 0.2, 0.08); },
    smoke: () => { noise(0.45, 0.32, 1400, 200, 'lowpass'); tone('triangle', 180, 90, 0.25, 0.25); },
    fuel: () => { tone('p25', N(84), N(84), 0.07, 0.22); tone('p25', N(91), N(91), 0.14, 0.22, 0.07); },
    fuelS: () => { [79, 83, 86, 91, 95].forEach((m, i) => tone('p25', N(m), N(m), 0.08, 0.2, i * 0.05)); },
    lucky: () => { [72, 79, 84, 88, 91, 96].forEach((m, i) => tone('p12', N(m), N(m), 0.09, 0.2, i * 0.05)); },
    crash: () => { noise(0.8, 0.55, 2400, 80, 'lowpass'); tone('square', 320, 40, 0.6, 0.25); },
    stun: () => { tone('p12', 1200, 300, 0.25, 0.14); },
    tick: () => { tone('p12', 1760, 1760, 0.025, 0.12); },
    oneup: () => { [76, 79, 88, 84, 86, 91].forEach((m, i) => tone('p25', N(m), N(m), 0.08, 0.22, i * 0.07)); },
    count: () => { tone('p25', N(69), N(69), 0.16, 0.25); },
    go: () => { tone('p25', N(81), N(81), 0.35, 0.28); },
    shoot: () => { tone('p25', 1100, 380, 0.07, 0.16); },
    mgun: () => { tone('p25', 1300, 520, 0.05, 0.13); noise(0.03, 0.1, 6000, 3000, 'highpass'); },
    spread: () => { tone('square', 850, 260, 0.09, 0.13); noise(0.05, 0.12, 5000, 1500, 'bandpass'); },
    laser: () => { tone('sawtooth', 2200, 180, 0.22, 0.14); tone('p12', 1100, 90, 0.22, 0.1); },
    fireball: () => { tone('triangle', 260, 520, 0.12, 0.2); noise(0.1, 0.1, 900, 400, 'bandpass'); },
    jump: () => { tone('p12', 330, 620, 0.1, 0.12); },
    hit: () => { noise(0.05, 0.18, 7000, 2500, 'highpass'); },
    tink: () => { tone('square', 2400, 2000, 0.04, 0.08); },
    eshot: () => { tone('p25', 700, 320, 0.08, 0.1); },
    explode: () => { noise(0.45, 0.5, 2600, 90, 'lowpass'); tone('triangle', 140, 40, 0.35, 0.3); },
    boom: () => { noise(1.2, 0.7, 3000, 60, 'lowpass'); tone('triangle', 110, 30, 1.0, 0.45); tone('square', 80, 30, 0.6, 0.15); },
    powerup: () => { [72, 76, 79, 84, 88].forEach((m, i) => tone('p25', N(m), N(m), 0.07, 0.22, i * 0.045)); },
    die: () => { [76, 72, 67, 64, 60, 55].forEach((m, i) => tone('p25', N(m), N(m) * 0.97, 0.1, 0.22, i * 0.08)); },
    alarm: () => { for (let i = 0; i < 3; i++) { tone('square', 880, 880, 0.14, 0.14, i * 0.3); tone('square', 660, 660, 0.14, 0.14, i * 0.3 + 0.15); } },
    missile: () => { noise(0.35, 0.18, 800, 3000, 'bandpass'); },
    fly: () => { noise(1.4, 0.16, 300, 1600, 'bandpass'); tone('triangle', 160, 240, 1.2, 0.1); },
    clear: () => { [67, 72, 76, 79, 76, 79, 84].forEach((m, i) => tone('p25', N(m), N(m), i === 6 ? 0.5 : 0.12, 0.24, i * 0.12)); },
    gameover: () => { [67, 66, 65, 64, 60].forEach((m, i) => tone('triangle', N(m), N(m), i === 4 ? 0.7 : 0.22, 0.3, i * 0.24)); },
  };
  api.sfx = (name) => {
    if (!ctx || muted) return;
    const now = ctx.currentTime;
    if (last[name] && now - last[name] < 0.035) return;
    last[name] = now;
    try { SFX[name] && SFX[name](); } catch (e) { /* nodo de audio no disponible */ }
  };
  // --- secuenciador de música
  const midi = (s) => {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(s);
    const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
    return base + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  };
  api.seq = (str) => {
    const tk = str.trim().split(/\s+/), out = [];
    for (let i = 0; i < tk.length; i++) {
      const t = tk[i];
      if (t === '.' || t === '-') { out.push(null); continue; }
      let len = 1;
      while (tk[i + len] === '-') len++;
      out.push({ m: midi(t), len });
    }
    return out;
  };
  api.bars = (len, list) => {
    list.forEach((b, i) => { const n = b.trim().split(/\s+/).length; if (n !== len) console.warn(`compás ${i + 1} tiene ${n} pasos (esperados ${len}): ${b}`); });
    return api.seq(list.join(' '));
  };
  let song = null, step = 0, nextT = 0, timer = 0;
  function drum(ch, t) {
    if (ch === 't') {
      // taiko: tambor grave con cuerpo
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.32);
      g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
      o.connect(g); g.connect(mus); o.start(t); o.stop(t + 0.4);
      ch = 'x';
    }
    if (ch === 'c' || ch === 'g' || ch === 'x' || ch === 'b') {
      // palmas (c), güiro raspado (g), golpe de parche (x), cencerro (b)
      if (ch === 'b') {
        for (const f of [540, 800]) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); o.connect(g); g.connect(mus); o.start(t); o.stop(t + 0.14); }
        return;
      }

      const f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'bandpass';
      if (ch === 'c') {

        for (let k = 0; k < 3; k++) { g.gain.setValueAtTime(0.5, t + k * 0.012); g.gain.exponentialRampToValueAtTime(0.05, t + k * 0.012 + 0.01); }
        g.gain.setValueAtTime(0.45, t + 0.036); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        s.connect(f); f.connect(g); g.connect(mus); s.start(t, Math.random() * 0.5); s.stop(t + 0.17);
      } else if (ch === 'g') {
        f.frequency.setValueAtTime(2600, t); f.frequency.linearRampToValueAtTime(4200, t + 0.16); f.Q.value = 3;
        for (let k = 0; k < 8; k++) { g.gain.setValueAtTime(0.32, t + k * 0.02); g.gain.linearRampToValueAtTime(0.05, t + k * 0.02 + 0.015); }
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        s.connect(f); f.connect(g); g.connect(mus); s.start(t, Math.random() * 0.5); s.stop(t + 0.2);
      } else {
        f.frequency.value = 400; f.Q.value = 0.7;
        g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        s.connect(f); f.connect(g); g.connect(mus); s.start(t, Math.random() * 0.5); s.stop(t + 0.22);
      }
      return;
    }
    if (ch === 'k') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(0.75, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g); g.connect(mus); o.start(t); o.stop(t + 0.17);
    } else if (ch === 's' || ch === 'h' || ch === 'o') {
      const s = ctx.createBufferSource(); s.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = ch === 's' ? 'bandpass' : 'highpass'; f.frequency.value = ch === 's' ? 1800 : 7000;
      const g = ctx.createGain(); const d = ch === 's' ? 0.13 : ch === 'o' ? 0.12 : 0.035;
      g.gain.setValueAtTime(ch === 's' ? 0.5 : 0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      s.connect(f); f.connect(g); g.connect(mus); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
    }
  }
  function sched() {
    if (!song || !ctx || ctx.state !== 'running') return;
    const dt = 60 / song.bpm / 4;
    while (nextT < ctx.currentTime + 0.14) {
      for (const ch of song.ch) {
        const n = ch.notes[step % ch.notes.length];
        if (!n) continue;
        const o = osc(ch.type), g = ctx.createGain();
        o.frequency.setValueAtTime(N(n.m + (song.tr || 0)), nextT);
        const dur = ch.decay ? Math.min(ch.decay, n.len * dt * 1.5) : n.len * dt * (ch.gate || 0.9);
        g.gain.setValueAtTime(0, nextT);
        g.gain.linearRampToValueAtTime(ch.vol, nextT + 0.005);
        if (!ch.decay) g.gain.setValueAtTime(ch.vol, nextT + dur * 0.55);
        g.gain.exponentialRampToValueAtTime(0.001, nextT + dur);
        o.connect(g); g.connect(mus); o.start(nextT); o.stop(nextT + dur + 0.02);
      }
      if (song.drums) for (const lay of Array.isArray(song.drums) ? song.drums : [song.drums]) { const d = lay[step % lay.length]; if (d !== '.') drum(d, nextT); }
      nextT += dt; step++;
    }
  }
  api.play = (s) => {
    if (!ctx) { pending = s; return; }
    if (song === s) return;
    api.stop();
    song = s; step = 0; nextT = ctx.currentTime + 0.06;
    timer = setInterval(sched, 25);
  };
  api.stop = () => { clearInterval(timer); timer = 0; song = null; pending = null; };
  return api;
})();

  function refreshMap() {

    if (!UI.$('#wcn')) return;

  function travel() {
    if (S.state !== 'map') return;
    const ci = S.mapSel;
    if (ci >= unlocked()) { Snd.sfx('back'); UI.toast('CIUDAD BLOQUEADA'); return; }
    const p1 = cityPx(ci);
    let p0 = S.from != null ? cityPx(S.from) : { x: p1.x - 80, y: p1.y + 26 };
    if (S.from === ci) p0 = { x: p1.x - 46, y: p1.y - 24 };
    const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2 - dist * 0.22;
    S.trip = { p0, p1, c: { x: mx, y: my }, t: 0, dur: 1.1 + dist / 150, ci, dot: 0 };
    S.state = 'travel';
    M.parts.clear();
    Snd.sfx('fly');
  }
  function updateMap(dt) {
    if (S.state === 'map') {
      if (Input.pressed.left) moveMapSel(-1);
      if (Input.pressed.right) moveMapSel(1);
      if (Input.pressed.a || Input.pressed.start) travel();
      else if (Input.pressed.b || Input.pressed.select) openGarage();
    } else if (S.state === 'travel') {
      const tr = S.trip;
      tr.t = Math.min(tr.dur, tr.t + dt);
      const u = tr.t / tr.dur, e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const q = (a, b, c) => (1 - e) * (1 - e) * a + 2 * (1 - e) * e * b + e * e * c;
      const x = q(tr.p0.x, tr.c.x, tr.p1.x), y = q(tr.p0.y, tr.c.y, tr.p1.y);
      const dx = 2 * (1 - e) * (tr.c.x - tr.p0.x) + 2 * e * (tr.p1.x - tr.c.x), dy = 2 * (1 - e) * (tr.c.y - tr.p0.y) + 2 * e * (tr.p1.y - tr.c.y);
      if (Math.hypot(dx, dy) > 0.01) S.planeAng = Math.atan2(dy, dx);
      if (S.planeX != null && Math.hypot(x - S.planeX, y - S.planeY) > 0) {
        tr.dot += Math.hypot(x - S.planeX, y - S.planeY);
        while (tr.dot >= 4) { tr.dot -= 4; M.parts.emit(x, y, 0, 0, 999, 0xff4f9a, 0xff4f9a, 1, 1); }
      }
      S.planeX = x; S.planeY = y; S.planeAlt = Math.sin(Math.PI * u) * 9;
      if (tr.t >= tr.dur) { S.state = 'arrive'; S.t = 0; Snd.sfx('fuelS'); }
    } else if (S.state === 'arrive') {
      S.t += dt;
      if (S.t > 1.1) { S.from = S.trip.ci; startCity(S.trip.ci); }
    }
  }
  function renderMap() {
    const W = Engine.W, t = performance.now() / 1000;
    const flying = S.state === 'travel' || S.state === 'arrive';
    const focus = flying ? S.planeX : cityPx(S.mapSel).x;
    const target = W >= WORLD.w ? (WORLD.w - W) / 2 : clamp(focus - W / 2, 0, WORLD.w - W);
    M.cam += (target - M.cam) * 0.12;
    const fy = flying ? S.planeY : cityPx(S.mapSel).y;
    const ty = clamp(fy - 78, -6, 70);
    M.camY = M.camY == null ? ty : M.camY + (ty - M.camY) * 0.12;
    const wm = UI.$('#wmap');
    if (wm) wm.classList.toggle('flying', flying);
    const un = unlocked(), cm = clearedMask();
    M.marks.forEach((m, i) => {
      const st = (cm >> i) & 1 ? 'done' : i < un ? 'open' : 'locked';
      m.dot.set(M.mk[st]).at(m.p.x, m.p.y);
      const isSel = i === S.mapSel && !flying;
      m.ring.show((isSel && Math.floor(t * 3) % 2 === 0) || (S.state === 'arrive' && i === S.trip.ci && Math.floor(t * 8) % 2 === 0)).at(m.p.x, m.p.y);
      const col = i === S.mapSel ? '#ffffff' : st === 'locked' ? '#8a84a8' : st === 'done' ? '#ffd23f' : '#ff9ac8';
      const tex = textTex(CITIES[i].name, col);
      m.label.set(tex);
      const lx = CITIES[i].side < 0 ? m.p.x - 7 - tex.w / 2 : m.p.x + 7 + tex.w / 2;
      m.label.at(lx, m.p.y);
    });
    if (flying) {
      const a = S.planeAlt;
      M.plane.show(true).at(S.planeX, S.planeY - a).rot(-(S.planeAng + Math.PI / 2));
      M.shadow.show(true).at(S.planeX + a * 0.4, S.planeY + 2).rot(-(S.planeAng + Math.PI / 2));
    } else if (S.from != null) {
      const p = cityPx(S.from);
      M.plane.show(true).at(p.x + 1, p.y - 9).rot(0);
      M.shadow.show(false);
    } else { M.plane.show(false); M.shadow.show(false); }
    M.parts.sync();
    setCam(Math.round(M.cam), Math.round(M.camY));
    renderScene(mScene);
  }

  function crash() {

    shake(4, 0.5); flash(0.35, [1, 0.6, 0.4]);

    S.boom.spr.show(true).at(player.x, player.y);
    parts.burst(player.x, player.y, 40, 140, 0.8, 0xffd84a, 0x7a2a3a, 2, 1, 0, 3);

  }
  function dropSmoke() {

    S.smokeCd = 0.42;
    S.fuel = Math.max(0, S.fuel - S.smokeCost);
    Snd.sfx('smoke');

  }
  function spawnPuff() {
    const s = smokes.find((q) => q.life <= 0) || smokes[0];
    s.x = player.x - DX[player.dir] * 9 + rand(-1, 1); s.y = player.y - DY[player.dir] * 9 + rand(-1, 1);
    s.life = 3.2; s.max = 3.2; s.hit.clear();
    s.spr.show(true).set(A.smoke[0]).tint(GASES[sel.g].c).at(s.x, s.y);
    for (let k = 0; k < 4; k++) parts.emit(s.x, s.y, rand(-20, 20), rand(-20, 20), 0.5, 0xffffff, S.gasHex, 2, 1, 0, 3);
  }
  function cityComplete() {
    const c = CITIES[S.city];
    S.state = 'cityclear'; S.t = 0;
    const bonus = 5000 * (S.city + 1);
    addScore(bonus);
    Store.set('rally_cleared', clearedMask() | (1 << S.city));
    const next = S.city + 1;
    if (next < CITIES.length) Store.set('rally_unlocked', Math.max(unlocked(), next + 1));
    banner(`¡${c.name} COMPLETADA!`, `BONO DE CIUDAD +${bonus}`);
    Snd.sfx('clear');
    if (S.score > S.hi) { S.hi = S.score; Store.set('hi_rally', S.score); }
  }

  function update(dt) {
    if (S.state === 'garage') { updateGarage(dt); return; }
    if (S.state === 'map' || S.state === 'travel' || S.state === 'arrive') { updateMap(dt); return; }
    S.t += dt;
    if (S.state === 'intro') {
      const step = Math.floor(S.t / 0.7) - (S.round === 0 ? 1 : 0);
      if (step !== S.lastStep) {
        S.lastStep = step;
        if (step >= 1 && step <= 3) { banner(String(4 - step), S.bonus ? 'RONDA DE BONO' : `${CITIES[S.city].name} · RONDA ${S.round + 1}/${ROUNDS}`); Snd.sfx('count'); }
      }
      if (S.t >= (S.round === 0 ? 3.5 : 2.8)) { S.state = 'play'; S.t = 0; banner('¡YA!', ''); Snd.sfx('go'); S.goT = 0.8; }
    } else if (S.state === 'play') {
      if (S.goT > 0 && (S.goT -= dt) <= 0) banner(null);
      updatePlay(dt);
    } else if (S.state === 'dying') {

  // ---------------- física de plataformas
  function landOn(x, y0, y1, skip) {
    let best = null;
    for (const p of plats) {
      if (p === skip || x < p.x0 - 3 || x > p.x1 + 3) continue;
      if (y0 <= p.y + 0.5 && y1 >= p.y && (!best || p.y < best.y)) best = p;
    }
    return best;
  }
  function supportAt(x, y) {
    for (const p of plats) if (x >= p.x0 - 3 && x <= p.x1 + 3 && Math.abs(p.y - y) < 1) return p;
    return null;
  }

  function spawnPlayer(x, first) {
    const p = player;

  // ---------------- disparos
  function firePlayer() {
    const p = player, W = WEAP[p.weapon];
    const live = pbs.filter((b) => b.on).length;
    if (live + (W.spread ? W.spread.length : 1) > W.max + (W.spread ? 4 : 0)) return;
    const f = p.face;
    let dx, dy;
    switch (p.aim) {
      case 'up': dx = 0; dy = -1; break;
      case 'down': dx = 0; dy = 1; break;
      case 'dup': dx = f * 0.7071; dy = -0.7071; break;
      case 'ddown': dx = f * 0.7071; dy = 0.7071; break;
      default: dx = f; dy = 0;
    }
    let mx, my;
    if (p.jumping) { mx = p.x + dx * 10; my = p.y - 14 + dy * 10; }
    else if (!p.ground && p.aim === 'down') { mx = p.x; my = p.y - 4; }
    else { const m = MUZZLE[p.aim === 'down' ? 'ddown' : p.aim]; mx = p.x + m[0] * f; my = p.y + m[1]; }
    const angs = W.spread || [0];
    for (const da of angs) {
      const b = pbs.find((q) => !q.on);
      if (!b) break;
      const ca = Math.cos(da), sa = Math.sin(da);
      const vx = (dx * ca - dy * sa) * W.speed, vy = (dx * sa + dy * ca) * W.speed;
      Object.assign(b, { on: true, x: mx, y: my, bx: mx, by: my, vx, vy, t: 0, w: p.weapon, dmg: W.dmg, pierce: !!W.pierce, hits: W.pierce ? new Set() : null, dx, dy });
      let tex = A.shot.pb;
      if (p.weapon === 'S') tex = A.shot.sp1;
      if (p.weapon === 'F') tex = A.shot.fire[0];
      if (p.weapon === 'L') tex = A.shot.laser[dy === 0 ? 0 : dx === 0 ? 90 : dx * dy < 0 ? 45 : 135];
      b.spr.set(tex).show(true).at(mx, my);
    }
    parts.emit(mx, my, 0, 0, 0.06, 0xffffff, 0xffe066, 4, 1);
    Snd.sfx(W.sfx);
  }
  function enemyShot(x, y, vx, vy, kind = 'b') {
    const b = ebs.find((q) => !q.on);

      const bb = b.w === 'L' ? [b.x - 7, b.y - 7, 14, 14] : [b.x - 3, b.y - 3, 6, 6];
      let used = false;
      for (const e of ents) {

    for (const b of ebs) {

  const fb = $('#optFull');
  fb.hidden = !fsOK || !!window.__NATIVE_APP || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  fb.textContent = isFull() ? 'SALIR PANT. COMPLETA' : 'PANTALLA COMPLETA';
  fb.classList.toggle('on', isFull());
}
function menuStep() {
  if (Input.pressed.left) { sel = (sel + 2) % 3; Snd.sfx('move'); refreshMenu(); }
  if (Input.pressed.right) { sel = (sel + 1) % 3; Snd.sfx('move'); refreshMenu(); }
  if (Input.pressed.a || Input.pressed.start) launch(sel);
  if (Input.pressed.select) toggleSound();
}
function launch(i) {
  Snd.unlock();
  sel = i; Store.set('cart', i); refreshMenu();
  if (i === 2) { Snd.sfx('back'); UI.toast('CARTUCHO 3 EN DESARROLLO · PRÓXIMAMENTE'); return; }
  Snd.sfx('start');
  $('#menu').hidden = true;
  mode = 'game';
  document.body.classList.remove('inmenu');
  game = i === 0 ? Rally : Contra;
  Input.reset();
  game.start();
  keepAwake(true);
  if (game === Contra && Engine.touch && innerHeight > innerWidth) UI.toast('GIRA EL TELÉFONO PARA VER MÁS NIVEL');
}
function toMenu() {
  if (game) game.exit();
  keepAwake(false);
  game = null; mode = 'menu';
  document.body.classList.add('inmenu');
  UI.setHud(''); UI.setButtons('OK', 'VOLVER');
  $('#menu').hidden = false;
  Engine.flash = 0; Engine.shakeT = 0;
  refreshMenu();
  Snd.play(SONGS.menu);
  Input.reset();
}
// pantalla completa (navegador) y pantalla siempre encendida mientras se juega
const fsEl = document.documentElement;
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFull() {
  try {
    if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => UI.toast('ESTE NAVEGADOR NO PERMITE PANTALLA COMPLETA'));
    }
  } catch (e) { UI.toast('ESTE NAVEGADOR NO PERMITE PANTALLA COMPLETA'); }
}
let wake = null;
async function keepAwake(on) {
  try {
    if (on && !wake && navigator.wakeLock && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
function toggleSound() { Snd.unlock(); Snd.toggleMute(); refreshMenu(); Snd.sfx('select'); }
function toggleCrt() { Engine.crt = !Engine.crt; Store.set('crt', Engine.crt); refreshMenu(); }

// ---------------- controles táctiles
function bindPad() {
  const dp = $('#dpad');
  let dpId = null;
  const T0 = Input.touch;
  const setDir = (cx, cy) => {
    const r = dp.getBoundingClientRect();
    const dx = (cx - (r.left + r.width / 2)) / (r.width / 2), dy = (cy - (r.top + r.height / 2)) / (r.height / 2);
    const th = 0.3;
    let L = dx < -th, Rr = dx > th, U = dy < -th, D = dy > th;
    if (Math.abs(dx) > Math.abs(dy) * 2.2) U = D = false;
    if (Math.abs(dy) > Math.abs(dx) * 2.2) L = Rr = false;
    for (const [k, v] of [['left', L], ['right', Rr], ['up', U], ['down', D]]) {
      if (v && !T0[k]) { Input.latch(k); UI.vibrate(6); }
      T0[k] = v;
    }
    dp.className = (U ? 'u ' : '') + (D ? 'd ' : '') + (L ? 'l ' : '') + (Rr ? 'r' : '');
  };
  const clearDir = () => { T0.left = T0.right = T0.up = T0.down = false; dp.className = ''; };
  dp.addEventListener('pointerdown', (e) => { e.preventDefault(); Snd.unlock(); dpId = e.pointerId; try { dp.setPointerCapture(e.pointerId); } catch (er) { /* */ } setDir(e.clientX, e.clientY); });
  dp.addEventListener('pointermove', (e) => { if (e.pointerId === dpId) setDir(e.clientX, e.clientY); });
  const endDp = (e) => { if (e.pointerId !== dpId) return; dpId = null; clearDir(); };
  dp.addEventListener('pointerup', endDp); dp.addEventListener('pointercancel', endDp); dp.addEventListener('lostpointercapture', endDp);
  const btn = (el, act) => {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); Snd.unlock();
      try { el.setPointerCapture(e.pointerId); } catch (er) { /* */ }
      T0[act] = true; Input.latch(act); el.classList.add('on'); UI.vibrate(8);
    });
    const up = () => { T0[act] = false; el.classList.remove('on'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  };
  btn($('#btnA'), 'a'); btn($('#btnB'), 'b'); btn($('#btnStart'), 'start'); btn($('#btnSel'), 'select');
}

// ---------------- layout responsivo
function layout() {
  const touch = matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches);
  Engine.touch = touch;
  const portrait = innerHeight > innerWidth;
  const b = document.body.classList;
  b.toggle('touch', touch); b.toggle('portrait', portrait); b.toggle('landscape', !portrait); b.toggle('short', innerHeight < 430);
  const st = $('#stage'), app = $('#app'), pad = $('#pad');
  const ovl = touch && !portrait;
  b.toggle('ovl', ovl);
  let aw, ah, minA = 1.2, maxA = 2.0;
  if (touch && portrait) {
    // vertical: pantalla de borde a borde (marco de 2px); los controles llenan el resto
    st.style.flex = '0 0 auto';
    aw = app.clientWidth - 4;
    ah = Math.max(120, app.clientHeight * 0.6 - 8);
    minA = 1.12;
  } else if (ovl) {
    // horizontal: el juego ocupa toda la pantalla y los controles van encima
    st.style.flex = ''; st.style.height = '';
    aw = app.clientWidth; ah = app.clientHeight;
    maxA = 2.4;
  } else {
    st.style.flex = ''; st.style.height = '';
    const cs = getComputedStyle(st);
    aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 20;
    ah = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 20;
  }
  if (aw < 50 || ah < 50) return;
  const aspect = clamp(aw / ah, minA, maxA);
  const W = Math.round((H * aspect) / 2) * 2;
  let sw = aw, sh = (sw * H) / W;
  if (sh > ah) { sh = ah; sw = (sh * W) / H; }
  sw = Math.floor(sw); sh = Math.floor(sh);
  if (touch && portrait) {
    st.style.height = sh + 8 + 'px';
    const ph = app.clientHeight - (sh + 8);
    pad.style.setProperty('--s', clamp(Math.min(ph / 330, (app.clientWidth / 2 - 26) / 158), 0.7, 1.25).toFixed(3));
  } else if (ovl) pad.style.setProperty('--s', clamp(app.clientHeight / 360, 0.72, 1.15).toFixed(3));
  else pad.style.setProperty('--s', 1);
  scr.style.width = sw + 'px'; scr.style.height = sh + 'px';
  scr.style.setProperty('--px', sh / H + 'px');
  const pr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3.2e6 / (sw * sh)));
  renderer.setPixelRatio(pr);
  renderer.setSize(sw, sh, false);
  setInternalWidth(W);
  menuMat.uniforms.res.value.set(W, H);
}

// ---------------- bucle de juego (paso fijo 60 Hz, render por frame)
let last = performance.now(), acc = 0;
function step(dt) {
  if (Engine.shakeT > 0) Engine.shakeT -= dt;
  if (toastT > 0 && (toastT -= dt) <= 0) $('#toast').hidden = true;
  if (mode === 'menu') menuStep();
  else if (overlay) overlayStep();
  else if (Input.pressed.start && !(game.capturesStart && game.capturesStart())) openPause();
  else game.update(dt);
}
function draw() {
  if (mode === 'menu') {
    const W = Engine.W;
    menuQuad.scale.set(W, H, 1); menuQuad.position.set(W / 2, -H / 2, -50);
    menuMat.uniforms.time.value = Engine.time;
    skyline.m.scale.set(W, 60, 1); skyline.m.position.set(W / 2, -(H * 0.64 - 30 + 1), -40);
    skyline.t.repeat.x = W / 256; skyline.t.offset.x = (Math.floor(Engine.time * 6) % 256) / 256;
    setCam(0, 0);
    renderScene(menuScene);
  } else game.render();
}
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  if (dt < 0) dt = 0;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { Input.poll(); step(STEP); Input.end(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  Engine.time += dt;
  Engine.flash = Math.max(0, Engine.flash - dt * 2.4);
  draw();
}

function boot() {
  Engine.crt = Store.get('crt', true);
  layout();
  bindPad();
  drawMenuThumbs();
  refreshMenu();
  $('#menu').hidden = false;
  document.body.classList.add('inmenu');
  document.querySelectorAll('.cart').forEach((c, i) => c.addEventListener('click', () => launch(i)));
  $('#optSound').addEventListener('click', toggleSound);
  $('#optCrt').addEventListener('click', toggleCrt);
  $('#optFull').addEventListener('click', toggleFull);
  document.addEventListener('fullscreenchange', () => { refreshMenu(); setTimeout(layout, 60); });
  document.addEventListener('webkitfullscreenchange', () => { refreshMenu(); setTimeout(layout, 60); });
  Input.onKey = (k) => { if (k === 'mute') toggleSound(); if (k === 'crt') toggleCrt(); };
  addEventListener('pointerdown', () => Snd.unlock(), { passive: true });
  addEventListener('resize', layout);
  addEventListener('orientationchange', () => setTimeout(layout, 120));
  if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('#stage'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (mode === 'game' && !overlay) openPause(); Snd.suspend(); }
    else { if (!overlay) Snd.resume(); if (mode === 'game') keepAwake(true); }
  });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  Snd.play(SONGS.menu);
  requestAnimationFrame((t) => { last = t; loop(t); });
}
// botón "atrás" de la app Android: pausa / vuelve / sale desde el menú
window.__androidBack = () => {
  if (mode === 'menu') return 'exit';
  if (overlay === 'pause') overlayAct('resume');
  else if (overlay === 'over') overlayAct('menu');
  else openPause();
  return 'ok';
};
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(() => boot());
else boot();

</script>
