<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15112a">
<script>window.__NATIVE_APP = true;</script>
<style>body{margin:0}</style>
<title>Pixel Arcade 3 en 1</title>
<style>
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/pixelify-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/silkscreen-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/silkscreen-latin-700-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: consola portátil — pantalla arriba y controles abajo (vertical), controles a los lados (horizontal), pantalla grande sola (escritorio) */
:root{
  --shell:#15112a;      /* carcasa */
  --shell-2:#211b3f;    /* paneles */
  --shell-3:#30285a;    /* bisel */
  --ink:#f4edff;        /* texto */
  --muted:#a196cf;      /* texto secundario */
  --pink:#ff4f9a;       /* acento A */
  --cyan:#4fe3ff;       /* acento B */
  --sun:#ffb347;        /* atardecer */
  --display:'Pixelify Sans','Trebuchet MS',monospace;
  --ui:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--shell)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--ui);
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(255,79,154,.10), transparent 60%),
    radial-gradient(90% 60% at 50% 100%, rgba(79,227,255,.08), transparent 60%),
    var(--shell);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 16px;position:relative}
#screen{position:relative;width:384px;height:216px;border-radius:8px;overflow:hidden;background:#05030c;
  --px:1px;
  box-shadow:0 0 0 3px #0a0716,0 0 0 7px var(--shell-3),0 0 0 9px #0a0716,0 0 48px -6px rgba(255,79,154,.45),0 0 90px -20px rgba(79,227,255,.35)}
#gl{display:block;width:100%;height:100%;image-rendering:pixelated}
.layer{position:absolute;inset:0}
/* ---------- HUD ---------- */
#hud{pointer-events:none;font-family:var(--ui);font-size:calc(var(--px)*7);line-height:1;letter-spacing:.04em;
  text-shadow:0 var(--px) 0 #000,var(--px) 0 0 #000,0 calc(var(--px)*-1) 0 #000,calc(var(--px)*-1) 0 0 #000}
.hrow{position:absolute;left:calc(var(--px)*6);right:calc(var(--px)*6);top:calc(var(--px)*5);display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--px)*6)}
.hcol{display:flex;flex-direction:column;gap:calc(var(--px)*3)}
.hlab{color:var(--muted);font-size:calc(var(--px)*5)}
.hval{font-variant-numeric:tabular-nums}
.hval.pink{color:var(--pink)}.hval.cyan{color:var(--cyan)}.hval.sun{color:var(--sun)}
.fuel{width:calc(var(--px)*54);height:calc(var(--px)*6);background:#0a0716;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #3a3260;position:relative}
.fuel i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4f6a,#ffb347 45%,#7dff7a);}
.fuel.low i{animation:blink .4s steps(2) infinite}
.lives{display:flex;gap:calc(var(--px)*2)}
.lives b{width:calc(var(--px)*6);height:calc(var(--px)*6);background:var(--cyan);box-shadow:0 0 0 var(--px) #000;clip-path:polygon(20% 0,80% 0,100% 30%,100% 100%,0 100%,0 30%)}
.lives.pinkl b{background:var(--pink);clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%)}
.wpn{display:inline-grid;place-items:center;width:calc(var(--px)*11);height:calc(var(--px)*11);background:#e23a43;color:#fff;box-shadow:0 0 0 var(--px) #000;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*8)}
#radar{position:absolute;right:calc(var(--px)*5);bottom:calc(var(--px)*5);width:calc(var(--px)*60);image-rendering:pixelated;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) rgba(79,227,255,.55);background:rgba(8,6,22,.7)}
.hbl{position:absolute;left:calc(var(--px)*6);bottom:calc(var(--px)*6);display:flex;gap:calc(var(--px)*4)}
.boss{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--px)*24);width:calc(var(--px)*120);display:flex;flex-direction:column;gap:calc(var(--px)*2);align-items:center}
.boss .bar{width:100%;height:calc(var(--px)*5);background:#0a0716;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #5a1f3c}
.boss .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2d6f,#ff9a3c)}
.banner{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);text-align:center;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*16);color:var(--ink);letter-spacing:.06em;
  text-shadow:0 calc(var(--px)*2) 0 #000,0 0 calc(var(--px)*8) rgba(255,79,154,.8)}
.banner small{display:block;font-family:var(--ui);font-weight:400;font-size:calc(var(--px)*6);color:var(--cyan);margin-top:calc(var(--px)*5);text-shadow:0 var(--px) 0 #000}
@keyframes blink{50%{opacity:.25}}
/* ---------- Menú ---------- */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--px)*9);padding:calc(var(--px)*8)}
.logo{text-align:center;line-height:.9}
.logo .l1,.logo .l2{display:inline-block;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*26);letter-spacing:.02em}
.logo .l1{color:var(--pink);text-shadow:0 calc(var(--px)*2) 0 #3a0c24,0 0 calc(var(--px)*10) rgba(255,79,154,.75)}
.logo .l2{color:var(--cyan);text-shadow:0 calc(var(--px)*2) 0 #0b2a3a,0 0 calc(var(--px)*10) rgba(79,227,255,.7);margin-left:calc(var(--px)*6)}
.logo .sub{display:block;margin-top:calc(var(--px)*5);font-size:calc(var(--px)*6);letter-spacing:.3em;color:var(--sun);text-shadow:0 var(--px) 0 #000}
.carts{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--px)*7);width:100%;max-width:calc(var(--px)*300)}
.cart{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:calc(var(--px)*3);padding:calc(var(--px)*5) calc(var(--px)*4) calc(var(--px)*5);border:0;cursor:pointer;
  background:linear-gradient(#2c2552,#1d1838);color:var(--ink);font-family:var(--ui);font-size:calc(var(--px)*6);text-align:center;
  clip-path:polygon(0 calc(var(--px)*6),calc(var(--px)*6) 0,calc(100% - var(--px)*6) 0,100% calc(var(--px)*6),100% 100%,0 100%);
  box-shadow:inset 0 0 0 var(--px) #463c7c;transition:transform .12s steps(3)}
.cart canvas{width:100%;aspect-ratio:3/2;height:auto;image-rendering:pixelated;background:#0b0818;box-shadow:inset 0 0 0 var(--px) #000}
.cart .cn{font-weight:700;line-height:1.15;min-height:2.3em;display:grid;place-items:center}
.cart .cr{color:var(--muted);font-size:calc(var(--px)*5);font-variant-numeric:tabular-nums}
.cart.sel{transform:translateY(calc(var(--px)*-3));background:linear-gradient(#45306e,#291f4f);box-shadow:inset 0 0 0 var(--px) var(--pink),0 0 0 var(--px) var(--pink)}
.cart.sel .cn{color:var(--pink)}
.cart.locked canvas{filter:saturate(.5) brightness(.8)}
.cart:focus-visible{outline:calc(var(--px)*1) solid var(--cyan);outline-offset:var(--px)}
.mhint{font-size:calc(var(--px)*5.5);color:var(--ink);letter-spacing:.12em;text-align:center;background:rgba(12,8,28,.82);padding:calc(var(--px)*3) calc(var(--px)*7);box-shadow:0 0 0 var(--px) #463c7c}
.mhint b{color:var(--ink);font-weight:400}
.opts{display:flex;gap:calc(var(--px)*6)}
.chip{border:0;cursor:pointer;background:#1d1838;color:var(--muted);font-family:var(--ui);font-size:calc(var(--px)*5.5);padding:calc(var(--px)*3) calc(var(--px)*5);box-shadow:inset 0 0 0 var(--px) #463c7c}
.chip.on{color:var(--cyan);box-shadow:inset 0 0 0 var(--px) var(--cyan)}
.chip:focus-visible{outline:var(--px) solid var(--cyan)}
/* ---------- Paneles ---------- */
#overlay{display:grid;place-items:center;background:rgba(6,4,16,.55)}
.panel{min-width:calc(var(--px)*150);max-width:calc(100% - var(--px)*20);padding:calc(var(--px)*10) calc(var(--px)*12);background:rgba(18,13,38,.95);text-align:center;
  box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) var(--pink),0 0 0 calc(var(--px)*3) #000,0 0 calc(var(--px)*20) rgba(255,79,154,.35);display:flex;flex-direction:column;gap:calc(var(--px)*6);align-items:center}
.panel h2{margin:0;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*15);color:var(--pink);letter-spacing:.04em;text-wrap:balance}
.panel p{margin:0;font-size:calc(var(--px)*6);color:var(--muted);line-height:1.5}
.panel .big{font-size:calc(var(--px)*10);color:var(--ink);font-variant-numeric:tabular-nums}
.mbtn{display:block;width:100%;border:0;cursor:pointer;background:#241d47;color:var(--ink);font-family:var(--ui);font-size:calc(var(--px)*7);padding:calc(var(--px)*4) calc(var(--px)*8);box-shadow:inset 0 0 0 var(--px) #463c7c}
.mbtn.sel{background:var(--pink);color:#1a0b1e;box-shadow:inset 0 0 0 var(--px) #fff}
.mbtn:focus-visible{outline:var(--px) solid var(--cyan)}
.tally{display:grid;grid-template-columns:auto auto;gap:calc(var(--px)*3) calc(var(--px)*10);font-size:calc(var(--px)*6);text-align:left;font-variant-numeric:tabular-nums}
.tally span:nth-child(odd){color:var(--muted)}
#toast{pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--px)*10)}
#toast span{background:rgba(18,13,38,.94);padding:calc(var(--px)*4) calc(var(--px)*7);font-size:calc(var(--px)*6);box-shadow:0 0 0 var(--px) var(--cyan)}
#rotate{position:absolute;left:0;right:0;bottom:calc(var(--px)*4);text-align:center;font-size:calc(var(--px)*5);color:var(--sun);pointer-events:none}
/* ---------- Controles táctiles ---------- */
#pad{display:none}
#keys{display:none;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;padding:0 16px 14px;line-height:1.8}
#keys kbd{font-family:var(--ui);color:var(--ink);background:var(--shell-2);padding:1px 6px;box-shadow:inset 0 0 0 1px #463c7c}
body:not(.touch) #keys{display:block}
body.touch #pad{display:grid}
.pl,.pr,.pm{display:flex;align-items:center;justify-content:center}
#dpad{position:relative;width:138px;height:138px;touch-action:none}
#dpad::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,#0e0b1e 55%,transparent 72%)}
#dpad .arm{position:absolute;background:linear-gradient(#3a3168,#272048);box-shadow:inset 0 0 0 2px #0b0818,0 4px 0 #0b0818}
#dpad .h{left:0;right:0;top:46px;height:46px;border-radius:8px}
#dpad .v{top:0;bottom:0;left:46px;width:46px;border-radius:8px}
#dpad .hub{position:absolute;left:46px;top:46px;width:46px;height:46px;background:#272048}
#dpad .hub::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#1a1533;box-shadow:inset 0 2px 0 #0b0818}
#dpad .tri{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.55}
#dpad .tu{left:62px;top:10px;border-bottom-color:var(--ink)}
#dpad .td{left:62px;bottom:10px;border-top-color:var(--ink)}
#dpad .tl{top:62px;left:10px;border-right-color:var(--ink)}
#dpad .tr{top:62px;right:10px;border-left-color:var(--ink)}
#dpad.u .tu,#dpad.d .td,#dpad.l .tl,#dpad.r .tr{opacity:1;filter:drop-shadow(0 0 4px var(--cyan))}
#dpad.u .tu{border-bottom-color:var(--cyan)}#dpad.d .td{border-top-color:var(--cyan)}#dpad.l .tl{border-right-color:var(--cyan)}#dpad.r .tr{border-left-color:var(--cyan)}
.abtns{position:relative;width:156px;height:132px}
.rb{position:absolute;width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;touch-action:none;font-family:var(--display);font-weight:700;font-size:24px;color:#1a0b1e;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 5px 0 #0b0818,0 0 0 3px #0b0818}
.rb small{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);font-family:var(--ui);font-weight:400;font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.08em}
#btnA{right:0;top:4px;background:radial-gradient(circle at 35% 30%,#ff9cc6,var(--pink) 60%)}
#btnB{left:0;top:52px;background:radial-gradient(circle at 35% 30%,#b6f4ff,var(--cyan) 60%)}
.rb.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 2px 0 #0b0818,0 0 0 3px #0b0818,0 0 18px currentColor}
#btnA.on{color:#fff}#btnB.on{color:#fff}
.pm{gap:14px}
.pill{border:0;cursor:pointer;touch-action:none;font-family:var(--ui);font-size:10px;letter-spacing:.1em;color:var(--muted);background:#272048;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 #0b0818,inset 0 0 0 2px #0b0818}
.pill.on{color:var(--ink);transform:translateY(2px);box-shadow:0 1px 0 #0b0818,inset 0 0 0 2px #0b0818}
#pad{--s:1}
.pl>*,.pr>*{transform:scale(var(--s))}
.pm{transform:scale(min(var(--s),1.1))}
/* vertical: pantalla de borde a borde con marco mínimo, controles debajo */
body.touch.portrait #stage{padding:0 0 4px;flex:0 0 auto}
body.touch.portrait #screen{border-radius:0;box-shadow:0 0 0 2px #000}
body.touch.portrait #pad{flex:1 1 auto;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;align-content:space-evenly;padding:0 16px 10px;align-items:center}
body.touch.portrait .pm{grid-column:1 / span 2;order:3}
/* horizontal: juego a pantalla completa con controles translúcidos encima */
body.touch.landscape{background:#000}
body.touch.landscape #stage{padding:0}
body.touch.landscape #screen{border-radius:0;box-shadow:none}
body.touch.landscape #pad{position:absolute;inset:0;pointer-events:none;z-index:5}
body.touch.landscape .pl,body.touch.landscape .pr,body.touch.landscape .pm{position:absolute;pointer-events:auto}
body.touch.landscape .pl{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));opacity:.6}
body.touch.landscape .pl>*{transform-origin:left bottom}
body.touch.landscape .pr{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.6}
body.touch.landscape .pr>*{transform-origin:right bottom}
body.touch.landscape .pm{left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.85);opacity:.5}
body.touch.landscape #dpad::before{background:radial-gradient(circle,rgba(14,11,30,.5) 55%,transparent 72%)}
body.touch.landscape .rb small{display:none}
body.ovl.inmenu .pm{display:none}
body.touch.landscape .pl:has(.u,.d,.l,.r),body.touch.landscape .pr:has(.on){opacity:.85}
/* el HUD inferior sube para no quedar bajo los controles */
body.ovl .hbl{bottom:auto;top:calc(var(--px)*26)}
body.ovl #radar{bottom:auto;top:calc(var(--px)*26)}
body.ovl #toast{align-items:flex-start;padding:calc(var(--px)*44) 0 0}
@media (prefers-reduced-motion:reduce){.cart,.rb,.pill{transition:none}.fuel.low i{animation:none}}
</style>

<div id="app">
  <div id="stage">
    <div id="screen">
      <canvas id="gl" aria-label="Pantalla del juego"></canvas>
      <div id="hud" class="layer"></div>
      <div id="menu" class="layer" hidden>
        <div class="logo"><span class="l1">PIXEL</span><span class="l2">ARCADE</span><span class="sub">3 CARTUCHOS EN 1</span></div>
        <div class="carts" id="carts">
          <button class="cart" id="cart-rally" data-game="rally"><canvas width="96" height="64"></canvas><span class="cn">GAS RALLY</span><span class="cr" id="rec-rally">REC 000000</span></button>
          <button class="cart" id="cart-contra" data-game="contra"><canvas width="96" height="64"></canvas><span class="cn">NEÓN COMMANDO</span><span class="cr" id="rec-contra">REC 000000</span></button>
          <button class="cart locked" id="cart-soon" data-game="soon"><canvas width="96" height="64"></canvas><span class="cn">CARTUCHO 3</span><span class="cr">PRÓXIMAMENTE</span></button>

      <div id="overlay" class="layer" hidden></div>
      <div id="toast" class="layer" hidden><span></span></div>
    </div>
  </div>
  <div id="keys">
    <kbd>← ↑ → ↓</kbd> mover/apuntar &nbsp; <kbd>Z</kbd> gas/salto &nbsp; <kbd>X</kbd> fuego &nbsp; <kbd>ENTER</kbd> pausa &nbsp; <kbd>M</kbd> sonido &nbsp; <kbd>C</kbd> CRT

  <div id="pad">
    <div class="pl"><div id="dpad"><span class="arm h"></span><span class="arm v"></span><span class="hub"></span><span class="tri tu"></span><span class="tri td"></span><span class="tri tl"></span><span class="tri tr"></span></div></div>
    <div class="pr"><div class="abtns"><button class="rb" id="btnB" aria-label="Botón B">B<small id="lblB">VOLVER</small></button><button class="rb" id="btnA" aria-label="Botón A">A<small id="lblA">OK</small></button></div></div>
    <div class="pm"><button class="pill" id="btnSel">SELECT</button><button class="pill" id="btnStart">START</button></div>
  </div>
</div>

<script type="module">
// =====================================================================
//  CORE · render pixel-perfect, post CRT, utilidades, input, audio
// =====================================================================
const THREE = window.THREE; // three.js r160 (UMD desde jsDelivr)
THREE.ColorManagement.enabled = false;

const H = 216;
const STEP = 1 / 60;
const Engine = { W: 384, H, time: 0, touch: false, crt: true, flash: 0, flashCol: [1, 1, 1], shakeT: 0, shakeA: 0 };

// ---------- utilidades
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (a) => a[(Math.random() * a.length) | 0];
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
function rng32(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const Store = {
  get(k, d) { try { const v = localStorage.getItem('pxa_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pxa_' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};
const pad6 = (n) => String(Math.max(0, Math.floor(n))).padStart(6, '0');

// ---------- color
const _rgbCache = {};
function rgb(hex) {
  if (_rgbCache[hex]) return _rgbCache[hex];
  const n = parseInt(hex.slice(1), 16);
  return (_rgbCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
}
function hexNum(hex) { return parseInt(hex.slice(1), 16); }

// ---------- lienzo pixel
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w + (w & 1); c.height = h + (h & 1);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  return { c, g, w: c.width, h: c.height };
}
function R(g, col, x, y, w = 1, h = 1) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), w, h); }
function disc(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let y = Math.floor(cy - r - 1); y <= Math.ceil(cy + r); y++) {
    const dy = y + 0.5 - cy;
    if (Math.abs(dy) > r) continue;
    const hw = Math.sqrt(r * r - dy * dy);
    const x0 = Math.ceil(cx - hw - 0.5), x1 = Math.floor(cx + hw - 0.5);
    if (x1 >= x0) g.fillRect(x0, y, x1 - x0 + 1, 1);

      rockAt[y * MW + x] = 1;
      bfs(distA, startTile[0], startTile[1]);
      let reach = 0;
      for (const [a, b] of roadTiles) if (distA[b * MW + a] < 9999) reach++;
      if (reach !== total()) { rockAt[y * MW + x] = 0; continue; }
      placed.push({ x, y, h });
    }
    // bidones
    bfs(distA, startTile[0], startTile[1]);
    const cand = roadTiles.filter(([x, y]) => !rockAt[y * MW + x] && distA[y * MW + x] > 6 && distA[y * MW + x] < 9999);
    const chosen = [];
    tries = 0;
    while (chosen.length < 10 && tries++ < 2000) {
      const [x, y] = cand[(r() * cand.length) | 0];
      if (chosen.some(([a, b]) => Math.abs(a - x) + Math.abs(b - y) < (tries < 800 ? 7 : 4))) continue;
      chosen.push([x, y]);
    }
    const iS = (r() * chosen.length) | 0;
    let iL = (r() * chosen.length) | 0;
    if (iL === iS) iL = (iS + 3) % chosen.length;
    // texturas y sprites
    if (mapTex) mapTex.dispose();
    mapTex = T(drawMap(r));
    mapSpr.set(mapTex).at(MW * TS / 2, MH * TS / 2);
    for (const c of cans) { c.spr.remove(); c.glow.remove(); }
    cans = chosen.map(([x, y], i) => {
      const kind = i === iS ? 'S' : i === iL ? 'L' : 'N';
      const frames = kind === 'S' ? A.canS : kind === 'L' ? A.canL : A.canN;
      return {
        x: x * TS + 8, y: y * TS + 8, kind, frames, got: false, ph: r() * 6,
        spr: new Spr(world, frames[0], 5),
        glow: new Spr(world, kind === 'S' ? A.glowY : kind === 'L' ? A.glowG : A.glowR, 4, { transparent: true, add: true }),

  function resetActors(full) {

  // ---------------- movimiento sobre la grilla
  function advance(c, dist, decide, open) {
    for (let k = 0; k < 8 && dist > 1e-6; k++) {
      const tx = Math.floor(c.x / TS), ty = Math.floor(c.y / TS);
      const cx = tx * TS + 8, cy = ty * TS + 8;
      let toC = DX[c.dir] ? (cx - c.x) * DX[c.dir] : (cy - c.y) * DY[c.dir];
      if (Math.abs(toC) < 1e-4) {
        c.x = cx; c.y = cy;
        decide(c, tx, ty);
        if (!open(tx + DX[c.dir], ty + DY[c.dir])) return;
        toC = TS;
      } else if (toC < 0) toC += TS;
      const m = Math.min(dist, toC);
      c.x += DX[c.dir] * m; c.y += DY[c.dir] * m;
      dist -= m;
      if (m >= toC - 1e-4) {
        if (DX[c.dir]) c.x = Math.floor(c.x / TS) * TS + 8; else c.y = Math.floor(c.y / TS) * TS + 8;
      }
    }
  }
  function decidePlayer(c, tx, ty) {
    const w = S.want;
    if (w >= 0 && openP(tx + DX[w], ty + DY[w])) { c.dir = w; return; }
    if (openP(tx + DX[c.dir], ty + DY[c.dir])) return;
    for (const d of [(c.dir + 1) % 4, (c.dir + 3) % 4]) if (openP(tx + DX[d], ty + DY[d])) { c.dir = d; return; }
    c.dir = (c.dir + 2) % 4;
  }
  function decideEnemy(e, tx, ty) {
    const rev = (e.dir + 2) % 4, opts = [];
    for (let d = 0; d < 4; d++) if (d !== rev && openE(tx + DX[d], ty + DY[d])) opts.push(d);
    if (!opts.length) { e.dir = rev; return; }
    const field = e.persona === 1 && distA[ty * MW + tx] > 5 ? distB : distA;
    let best = opts[0], bv = 1e9;
    for (const d of opts) {
      let v = field[(ty + DY[d]) * MW + tx + DX[d]];
      if (Math.random() < e.noise) v += Math.random() * 7;
      if (v < bv) { bv = v; best = d; }
    }
    e.dir = best;
  }

  // ---------------- ciclo de vida
  function init() {

    for (let i = 0; i < 36; i++) smokes.push({ spr: new Spr(world, A.smoke[0], 20).show(false), life: 0, x: 0, y: 0, hit: new Set() });
    for (let i = 0; i < 2; i++) clouds.push({ spr: new Spr(world, A.cloud, 50, { transparent: true }), x: rand(0, MW * TS), y: rand(0, MH * TS) });

  }
  function buildHud() {

  function start() {

  }
  function beginRound() {

  }
  function banner(t, sub) {

  function addScore(n, x, y) {

  function popup(str, x, y, col) {

  function crash() {

  function dropSmoke() {

  function spawnPuff() {
    const s = smokes.find((q) => q.life <= 0) || smokes[0];

  function update(dt) {
    S.t += dt;
    if (S.state === 'intro') {
      const step = Math.floor(S.t / 0.7);
      if (step !== S.lastStep) { S.lastStep = step; if (step >= 1 && step <= 3) { banner(String(4 - step), S.bonus ? 'RONDA DE BONO' : `RONDA ${S.level}`); Snd.sfx('count'); } }
      if (S.t >= 2.8) { S.state = 'play'; S.t = 0; banner('¡YA!', ''); Snd.sfx('go'); S.goT = 0.8; }
    } else if (S.state === 'play') {
      if (S.goT > 0 && (S.goT -= dt) <= 0) banner(null);
      updatePlay(dt);
    } else if (S.state === 'dying') {
      const f = Math.floor(S.t / 0.09);
      if (f < A.boom.length) S.boom.spr.set(A.boom[f]).at(S.boom.x, S.boom.y); else S.boom.spr.show(false);
      updateEnemies(dt * 0.5);
      if (S.t > 2) {
        S.lives--;
        if (S.lives <= 0) { gameOver(); return; }
        resetActors(false);
        S.fuel = Math.max(S.fuel, 40);
        S.state = 'intro'; S.t = 0; S.lastStep = -1;
        banner('¡OTRA VEZ!', `QUEDAN ${S.lives} AUTOS`);
      }
    } else if (S.state === 'clear') {
      S.tallyT = (S.tallyT || 0) + dt;
      if (S.fuel > 0 && S.tallyT > 0.6) {
        const k = Math.min(S.fuel, dt * 90);
        S.fuel -= k; S.tallyAcc = (S.tallyAcc || 0) + k * 10;
        while (S.tallyAcc >= 10) { S.tallyAcc -= 10; addScore(10); }
        if ((S.tick = (S.tick || 0) + dt) > 0.05) { S.tick = 0; Snd.sfx('tick'); }
        banner('¡RONDA COMPLETA!', `BONO DE GAS +${Math.round(S.tallyTotal - S.fuel * 10)}`);
      } else if (S.fuel <= 0 && S.tallyT > 0.6) {
        S.fuel = 0;
        if ((S.doneT = (S.doneT || 0) + dt) > 1.4) { S.level++; S.doneT = 0; S.tallyT = 0; beginRound(); return; }
      }
    }
    updateFx(dt);
  }
  function updatePlay(dt) {
    // entrada con buffer
    const I = Input.held;
    let w = -1;
    if (I.up) w = 0; else if (I.down) w = 2;
    if (I.left) w = 3; else if (I.right) w = 1;
    if (Input.pressed.up) w = 0; if (Input.pressed.down) w = 2; if (Input.pressed.left) w = 3; if (Input.pressed.right) w = 1;
    if (w >= 0) { S.want = w; S.wantT = 0.35; } else if ((S.wantT -= dt) <= 0) S.want = -1;
    if (Input.pressed.a || Input.pressed.b) dropSmoke();
    S.smokeCd -= dt;
    if (S.puffQ && S.puffQ.length) { S.puffQ = S.puffQ.map((t) => t - dt); while (S.puffQ.length && S.puffQ[0] <= 0) { S.puffQ.shift(); spawnPuff(); } }
    // combustible
    const prevFuel = S.fuel;
    S.fuel = Math.max(0, S.fuel - dt * (S.bonus ? 100 / 42 : 100 / 82));
    if (prevFuel > 0 && S.fuel <= 0) { Snd.sfx('alarm'); UI.toast('¡SIN GAS!'); }
    if (S.fuel <= 0 && Math.random() < dt * 3) parts.emit(player.x - DX[player.dir] * 8, player.y - DY[player.dir] * 8, rand(-10, 10), rand(-10, 10), 0.5, 0x2a2638, 0x5a5468, 2, 3, 0, 1);
    // jugador
    const p = player;
    const want = S.want;
    if (want >= 0 && want === (p.dir + 2) % 4) p.dir = want;
    else if (want >= 0 && want !== p.dir) {
      // giro anticipado (el auto del jugador dobla más rápido que los rojos)
      const tx = Math.floor(p.x / TS), ty = Math.floor(p.y / TS), cx = tx * TS + 8, cy = ty * TS + 8;
      const off = DX[p.dir] ? Math.abs(p.x - cx) : Math.abs(p.y - cy);
      if (off <= 4 && openP(tx + DX[want], ty + DY[want])) { p.x = cx; p.y = cy; p.dir = want; parts.burst(p.x, p.y, 3, 30, 0.35, 0x9a95ad, 0x5a5468, 1, 1, 0, 3); }
    }

    advance(p, spd * dt, decidePlayer, openP);
    // escape
    if (Math.random() < dt * 14) parts.emit(p.x - DX[p.dir] * 8 + rand(-1, 1), p.y - DY[p.dir] * 8 + rand(-1, 1), -DX[p.dir] * 18 + rand(-6, 6), -DY[p.dir] * 18 + rand(-6, 6), 0.35, 0xc8c3d8, 0x5a5468, 2, 1, 0, 2);
    // campo de distancias para la IA

    if (pt !== lastPT) {

      bfs(distA, Math.floor(p.x / TS), Math.floor(p.y / TS));
      let ax = Math.floor(p.x / TS), ay = Math.floor(p.y / TS);
      for (let k = 0; k < 5 && openE(ax + DX[p.dir], ay + DY[p.dir]); k++) { ax += DX[p.dir]; ay += DY[p.dir]; }
      bfs(distB, ax, ay);
    }
    // rocas
    for (const rk of S.rockList) if (Math.abs(rk.cx - p.x) < 11 && Math.abs(rk.cy - p.y) < 11) { crash(); return; }
    // bidones
    for (const c of cans) {
      if (c.got || Math.abs(c.x - p.x) > 12 || Math.abs(c.y - p.y) > 12) continue;
      c.got = true; c.spr.show(false); c.glow.show(false);
      S.collected++;
      let pts = S.collected * 100;
      if (S.special) pts *= 2;
      S.fuel = Math.min(100, S.fuel + (c.kind === 'L' ? 25 : 12));
      if (c.kind === 'S') { S.special = true; Snd.sfx('fuelS'); UI.toast('¡BIDÓN S! PUNTOS ×2'); flash(0.25, [1, 0.9, 0.4]); }
      else if (c.kind === 'L') { const b = Math.round(S.fuel) * 10; Snd.sfx('lucky'); UI.toast(`¡BIDÓN L! BONO +${b}`); addScore(b); flash(0.25, [0.5, 1, 0.7]); }
      else Snd.sfx('fuel');
      addScore(pts, c.x, c.y - 10);
      parts.burst(c.x, c.y, 18, 90, 0.6, c.kind === 'S' ? 0xfff09a : c.kind === 'L' ? 0xa6ffcf : 0xffd84a, 0xff6a3a, 2, 1, 0, 3);
      if (S.collected >= 10) {
        S.state = 'clear'; S.t = 0; S.tallyT = 0; S.tallyAcc = 0; S.tallyTotal = S.fuel * 10;

      }
    }
    updateEnemies(dt);
    for (const e of enemies) {
      if (!e.active || e.stun > 0 || e.hold > 0) continue;
      if (Math.abs(e.x - p.x) < 11 && Math.abs(e.y - p.y) < 11) { crash(); return; }
    }
  }
  function updateEnemies(dt) {
    const base = PSPEED * Math.min(1.06, 0.93 + 0.025 * S.level);
    const idle = S.bonus && S.fuel > 0 && S.state === 'play';
    for (const e of enemies) {
      if (!e.active) continue;
      if (e.hold > 0) { if (S.state === 'play') e.hold -= dt; continue; }
      if (e.stun > 0) {
        e.stun -= dt; e.spin += dt * 14;
        e.stars.forEach((s, i) => { const a = S.t * 6 + i * Math.PI; s.show(true).at(e.x + Math.cos(a) * 7, e.y - 9 + Math.sin(a) * 2.5); });
        if (e.stun <= 0) { e.stars.forEach((s) => s.show(false)); e.spin = 0; }
        continue;
      }
      if (idle) continue;
      advance(e, base * dt, decideEnemy, openE);
      // humo
      for (const s of smokes) {
        if (s.life <= 0 || s.hit.has(e)) continue;
        if (Math.abs(s.x - e.x) < 11 && Math.abs(s.y - e.y) < 11) { s.hit.add(e); e.stun = 2.8; Snd.sfx('stun'); addScore(50, e.x, e.y - 12); }
      }
    }
    // choques entre autos rojos de frente → ambos aturdidos
    for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
      const a = enemies[i], b = enemies[j];
      if (!a.active || !b.active || a.stun > 0 || b.stun > 0 || a.hold > 0 || b.hold > 0) continue;
      if (a.dir === (b.dir + 2) % 4 && Math.abs(a.x - b.x) < 9 && Math.abs(a.y - b.y) < 9) { a.stun = b.stun = 1.6; Snd.sfx('stun'); }
    }
  }
  function updateFx(dt) {
    for (const s of smokes) {

      s.life -= dt;
      const u = 1 - s.life / s.max;
      const f = Math.min(4, Math.floor(u < 0.08 ? 0 : u < 0.18 ? 1 : u < 0.72 ? 2 : u < 0.88 ? 3 : 4));
      s.spr.set(A.smoke[f]).at(s.x, s.y);
      if (s.life <= 0) s.spr.show(false);
    }
    for (const c of clouds) {
      c.x += dt * 9; c.y += dt * 4.5;
      if (c.x > MW * TS + 90) c.x = -90;
      if (c.y > MH * TS + 60) c.y = -60;

    }
    for (const p of popups) {

      p.t -= dt; p.y -= dt * 18;

    }

  }

  function render() {
    const p = player, T0 = performance.now() / 1000;
    // giro suave del sprite hacia la dirección
    const target = ROT[p.dir];
    let da = target - p.ang;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    p.ang += da * Math.min(1, 0.45);
    if (Math.abs(da) < 0.05) p.ang = target;
    const wf = Math.floor(T0 * 14) & 1;
    p.spr.set(A.carP[wf]).show(p.vis).at(p.x, p.y).rot(p.ang);
    for (const e of enemies) {
      if (!e.active) continue;
      const tgt = ROT[e.dir];
      let d = tgt - e.ang;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      e.ang += d * 0.35;
      if (Math.abs(d) < 0.05) e.ang = tgt;
      e.spr.set(A.carE[Math.floor(T0 * 6) & 1]).at(e.x, e.y).rot(e.ang + e.spin);
    }
    for (const c of cans) {
      if (c.got) continue;
      const bob = Math.round(Math.sin(T0 * 4 + c.ph) * 1.5);
      c.spr.set(c.frames[Math.floor(T0 * 3 + c.ph) & 1]).at(c.x, c.y - 1 + bob);
      c.glow.at(c.x, c.y + 1).mat.opacity = 0.6 + Math.sin(T0 * 5 + c.ph) * 0.4;
    }
    for (const rk of S.rockList) rk.spr.set((rk.h ? A.barrierV : A.barrier)[Math.floor(T0 * 3) & 1]);
    parts.sync();
    const W = Engine.W;
    const camX = clamp(p.x - W / 2, 0, MW * TS - W), camY = clamp(p.y - H / 2, 0, MH * TS - H);
    setCam(camX, camY);
    renderScene(scene);
    drawRadar(T0, camX, camY);
    drawHud();
  }
  function drawRadar(t, camX, camY) {
    if (!rctx) return;
    const g = rctx;

    plats = GROUND.map(([x0, x1]) => ({ x0, x1, y: GY, ground: true })).concat(LEDGES.map(([x0, x1, y]) => ({ x0, x1, y, ground: false })));
    parts = new Particles(scene, 900, 30);
    player = { spr: new Spr(scene, A.hero.stand.fwd[0], 15), aura: new Spr(scene, A.aura, 14, { transparent: true, add: true }) };
    for (let i = 0; i < 26; i++) pbs.push({ spr: new Spr(scene, A.shot.pb, 20).show(false), on: false });
    for (let i = 0; i < 50; i++) ebs.push({ spr: new Spr(scene, A.shot.eb[0], 21).show(false), on: false });

  // ---------------- física de plataformas
  function landOn(x, y0, y1, skip) {
    let best = null;
    for (const p of plats) {
      if (p === skip || x < p.x0 - 3 || x > p.x1 + 3) continue;
      if (y0 <= p.y + 0.5 && y1 >= p.y && (!best || p.y < best.y)) best = p;
    }
    return best;
  }
  function supportAt(x, y) {
    for (const p of plats) if (x >= p.x0 - 3 && x <= p.x1 + 3 && Math.abs(p.y - y) < 1) return p;
    return null;
  }
  const hit = (a, b) => a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1];

  function spawnPlayer(x, first) {

    Object.assign(p, { x: sx, y: first ? GY : -20, vx: 0, vy: 0, face: 1, ground: first, fell: false, plat: first ? supportAt(sx, GY) : null, jumping: false, prone: false, aim: 'fwd',
      anim: 0, inv: first ? 0 : 2.4, barrier: 0, dead: false, deadT: 0, dropT: 0, dropPlat: null, fireT: 0, weapon: 'N' });

  // ---------------- disparos
  function firePlayer() {
    const p = player, W = WEAP[p.weapon];
    const live = pbs.filter((b) => b.on).length;
    if (live + (W.spread ? W.spread.length : 1) > W.max + (W.spread ? 4 : 0)) return;
    const f = p.face;
    let dx, dy;
    switch (p.aim) {
      case 'up': dx = 0; dy = -1; break;
      case 'down': dx = 0; dy = 1; break;
      case 'dup': dx = f * 0.7071; dy = -0.7071; break;
      case 'ddown': dx = f * 0.7071; dy = 0.7071; break;
      default: dx = f; dy = 0;
    }
    let mx, my;
    if (p.jumping) { mx = p.x + dx * 10; my = p.y - 14 + dy * 10; }
    else if (!p.ground && p.aim === 'down') { mx = p.x; my = p.y - 4; }
    else { const m = MUZZLE[p.aim === 'down' ? 'ddown' : p.aim]; mx = p.x + m[0] * f; my = p.y + m[1]; }
    const angs = W.spread || [0];
    for (const da of angs) {
      const b = pbs.find((q) => !q.on);
      if (!b) break;
      const ca = Math.cos(da), sa = Math.sin(da);
      const vx = (dx * ca - dy * sa) * W.speed, vy = (dx * sa + dy * ca) * W.speed;
      Object.assign(b, { on: true, x: mx, y: my, bx: mx, by: my, vx, vy, t: 0, w: p.weapon, dmg: W.dmg, pierce: !!W.pierce, hits: W.pierce ? new Set() : null, dx, dy });
      let tex = A.shot.pb;
      if (p.weapon === 'S') tex = A.shot.sp1;
      if (p.weapon === 'F') tex = A.shot.fire[0];
      if (p.weapon === 'L') tex = A.shot.laser[dy === 0 ? 0 : dx === 0 ? 90 : dx * dy < 0 ? 45 : 135];
      b.spr.set(tex).show(true).at(mx, my);
    }
    parts.emit(mx, my, 0, 0, 0.06, 0xffffff, 0xffe066, 4, 1);
    Snd.sfx(W.sfx);
  }
  function enemyShot(x, y, vx, vy, kind = 'b') {
    const b = ebs.find((q) => !q.on);
    if (!b) return null;
    Object.assign(b, { on: true, x, y, vx, vy, t: 0, kind, hp: 1 });
    b.spr.set(kind === 'bomb' ? A.shot.bomb : kind === 'missile' ? A.shot.missile : A.shot.eb[0]).show(true).rot(0).at(x, y);
    return b;
  }
  function boomAt(x, y, small) {
    const b = booms.find((q) => !q.on);

    parts.burst(x, y, small ? 8 : 16, small ? 90 : 140, 0.6, 0xffe066, 0xe8452c, 2, 1, 260, 1.5);
  }

  // ---------------- enemigos
  function spawnEnt(sp) {
    const W = Engine.W;
    if (sp.t === 'rifle') {
      ents.push({ type: 'rifle', x: sp.x, y: sp.y, hp: 2, face: -1, aim: 'fwd', fireT: rand(0.6, 1.4), burst: 0, burstT: 0, flashT: 0, spr: new Spr(scene, A.grunt.aim.fwd, 10) });
    } else if (sp.t === 'turret') {
      const e = { type: 'turret', x: sp.x, y: sp.y, hp: 10, dir: 8, turnT: 0, fireT: 1.2, flashT: 0, spr: new Spr(scene, A.mach.plate, 9).at(sp.x, sp.y) };
      e.barrel = new Spr(scene, A.mach.barrel[8], 9.5).at(sp.x, sp.y);
      e.cap = new Spr(scene, A.mach.cap, 9.8).at(sp.x, sp.y);
      e.extra = [e.barrel, e.cap];
      ents.push(e);
    } else if (sp.t === 'drones') {
      for (let i = 0; i < sp.n; i++) ents.push({ type: 'drone', x: S.camX + W + 20 + i * 34, y: 40 + i * 14, by: 40 + i * 14, hp: 2, t: -i * 0.4, st: 'cruise', diveT: rand(0.8, 1.8) + i * 0.3, flashT: 0, spr: new Spr(scene, A.mach.drone[0], 11) });
    } else if (sp.t === 'capsule') {
      ents.push({ type: 'capsule', x: S.camX - 20, y: 66, hp: 1, t: 0, w: sp.w, spr: new Spr(scene, A.mach.capsule[0], 11) });
    }
  }
  function spawnRunner() {
    const W = Engine.W, fromLeft = S.camX > 60 && Math.random() < 0.18;
    const x = fromLeft ? S.camX - 14 : S.camX + W + 14;
    // superficie: piso o plataforma más alta en esa x
    const cands = plats.filter((p) => x >= p.x0 && x <= p.x1);
    if (!cands.length) return;
    const p = cands[(Math.random() * cands.length) | 0];
    ents.push({ type: 'runner', x, y: p.y, vy: 0, face: fromLeft ? 1 : -1, ground: true, plat: p, hp: 1, t: Math.random(), spr: new Spr(scene, A.grunt.run[0], 10) });
  }
  function killEnt(e, cause) {
    e.dead = true;
    const pts = { runner: 100, rifle: 300, drone: 200, turret: 500, capsule: 100 }[e.type] || 100;
    addScore(pts);
    if (e.type === 'runner' || e.type === 'rifle') {
      Snd.sfx('hit');
      items.push({ corpse: true, x: e.x, y: e.y, vx: (e.face || -1) * -40, vy: -170, t: 0, spr: new Spr(scene, A.grunt.hurt, 10).setFlip(e.face < 0) });
      parts.burst(e.x, e.y - 14, 6, 60, 0.35, 0xffffff, 0xff4f9a, 1, 1);
    } else if (e.type === 'turret') {
      Snd.sfx('explode'); boomAt(e.x, e.y); boomAt(e.x + 6, e.y - 8, true); shake(3, 0.3);
      e.spr.set(A.mach.plateDead); e.barrel.show(false); e.cap.show(false);
      e.keepSpr = true;
    } else if (e.type === 'capsule') {
      Snd.sfx('explode'); boomAt(e.x, e.y, true);
      items.push({ medal: true, w: e.w, x: e.x, y: e.y, vx: 26, vy: -170, ground: false, t: 0, spr: new Spr(scene, A.mach.medal[e.w], 6) });
    } else { Snd.sfx('explode'); boomAt(e.x, e.y, true); }
    if (!e.keepSpr) { e.spr.remove(); e.extra && e.extra.forEach((s) => s.remove()); }
  }
  function entBox(e) {
    switch (e.type) {
      case 'runner': case 'rifle': return [e.x - 5, e.y - 27, 10, 27];
      case 'turret': return [e.x - 12, e.y - 12, 24, 24];
      case 'drone': return [e.x - 10, e.y - 6, 20, 12];
      case 'capsule': return [e.x - 11, e.y - 6, 22, 12];
    }
    return [0, 0, 0, 0];
  }
  function playerBox() {
    const p = player;
    if (p.prone) return [p.x - 4 + p.face * 4, p.y - 9, 16, 9];
    if (p.jumping) return [p.x - 7, p.y - 21, 14, 14];
    return [p.x - 4, p.y - 27, 8, 27];
  }
  const aimVec = (aim, f) => (aim === 'dup' ? [f * 0.7071, -0.7071] : aim === 'ddown' ? [f * 0.7071, 0.7071] : [f, 0]);
  function updateEnts(dt) {
    const p = player, W = Engine.W, diff = 1 + S.loop * 0.3;
    for (const e of ents) {
      if (e.dead) continue;
      e.t = (e.t || 0) + dt;
      if (e.flashT > 0) e.flashT -= dt;
      const onScreen = e.x > S.camX - 10 && e.x < S.camX + W + 10;
      if (e.type === 'runner') {
        e.x += e.face * 74 * dt;
        if (e.ground) {
          if (!(e.x >= e.plat.x0 - 2 && e.x <= e.plat.x1 + 2)) {
            const s = supportAt(e.x, e.y);
            if (s) e.plat = s; else { e.ground = false; e.vy = Math.random() < 0.45 ? -230 : 0; }
          }
        } else {
          const y0 = e.y;
          e.vy = Math.min(e.vy + G * dt, MAXF); e.y += e.vy * dt;
          if (e.vy >= 0) { const l = landOn(e.x, y0, e.y, null); if (l) { e.y = l.y; e.ground = true; e.plat = l; e.vy = 0; } }
        }
        e.spr.set(e.ground ? A.grunt.run[Math.floor(e.t * 12) % 6] : A.grunt.fall).setFlip(e.face < 0).anchor(e.x, e.y, ANCHOR[0], ANCHOR[1]);
        if (e.y > H + 40 || e.x < S.camX - 60 || e.x > S.camX + W + 80) { e.dead = true; e.spr.remove(); }
      } else if (e.type === 'rifle') {
        const dx = p.x - e.x, dy = (p.y - 14) - (e.y - 20);
        e.face = dx < 0 ? -1 : 1;
        e.aim = dy < -30 && Math.abs(dy) > Math.abs(dx) * 0.4 ? 'dup' : dy > 28 && Math.abs(dy) > Math.abs(dx) * 0.4 ? 'ddown' : 'fwd';
        if (onScreen && !p.dead) {
          e.fireT -= dt * diff;
          if (e.fireT <= 0 && e.burst <= 0) { e.burst = 1 + ((Math.random() * (2 + S.loop)) | 0); e.burstT = 0; e.fireT = rand(1.5, 2.4); }
          if (e.burst > 0 && (e.burstT -= dt) <= 0) {
            e.burst--; e.burstT = 0.2;
            const m = MUZZLE[e.aim], [vx, vy] = aimVec(e.aim, e.face);
            enemyShot(e.x + m[0] * e.face, e.y + m[1], vx * 115 * diff, vy * 115 * diff);
            Snd.sfx('eshot');
          }
        }
        e.spr.set(e.flashT > 0 ? A.grunt.aimW[e.aim] : A.grunt.aim[e.aim]).setFlip(e.face < 0).anchor(e.x, e.y, ANCHOR[0], ANCHOR[1]);
        if (e.x < S.camX - 60) { e.dead = true; e.spr.remove(); }
      } else if (e.type === 'turret') {
        const want = (Math.round((Math.atan2(p.y - 16 - e.y, p.x - e.x) / (Math.PI / 8))) + 16) % 16;
        if ((e.turnT -= dt) <= 0 && want !== e.dir) { const d = (want - e.dir + 16) % 16; e.dir = (e.dir + (d < 8 ? 1 : 15)) % 16; e.turnT = 0.11; }
        if (onScreen && !p.dead) {
          e.fireT -= dt * diff;
          if (e.fireT <= 0 && Math.abs(((want - e.dir + 24) % 16) - 8) >= 7) {
            e.fireT = 1.5;
            const a = (e.dir * Math.PI) / 8;
            enemyShot(e.x + Math.cos(a) * 15, e.y + Math.sin(a) * 15, Math.cos(a) * 110 * diff, Math.sin(a) * 110 * diff);
            Snd.sfx('eshot');
          }
        }
        e.barrel.set(A.mach.barrel[e.dir]).at(e.x, e.y);
        e.cap.set(e.flashT > 0 ? A.mach.capW : A.mach.cap);
        if (e.x < S.camX - 60) { e.dead = true; e.spr.remove(); e.extra.forEach((s) => s.remove()); }
      } else if (e.type === 'drone') {
        if (e.t < 0) { e.spr.show(false); continue; }
        e.spr.show(true);
        if (e.st === 'cruise') {
          e.x -= 52 * dt; e.y = e.by + Math.sin(e.t * 3.2) * 12;
          if (e.t > e.diveT && e.x < S.camX + W - 20) {
            e.st = 'dive'; const a = Math.atan2(p.y - 18 - e.y, p.x - e.x); e.vx = Math.cos(a) * 125 * diff; e.vy = Math.sin(a) * 125 * diff; e.diveT = e.t;
            enemyShot(e.x, e.y + 4, Math.cos(a) * 120, Math.sin(a) * 120); Snd.sfx('eshot');
          }
        } else if (e.st === 'dive') {
          e.x += e.vx * dt; e.y += e.vy * dt;
          if (e.t - e.diveT > 0.75 || e.y > GY - 26) { e.st = 'leave'; e.vy = -110; e.vx = -60; }
        } else { e.x += e.vx * dt; e.y += e.vy * dt; }
        e.spr.set(e.flashT > 0 ? A.mach.droneW : A.mach.drone[Math.floor(e.t * 20) & 1]).at(e.x, e.y);
        if (e.y < -30 || e.x < S.camX - 40) { e.dead = true; e.spr.remove(); }
      } else if (e.type === 'capsule') {
        e.x += (S.camX > 0 ? 70 : 64) * dt + (S.camDX || 0);
        e.y = 66 + Math.sin(e.t * 2.4) * 20;
        e.spr.set(A.mach.capsule[Math.floor(e.t * 8) & 1]).at(e.x, e.y);
        if (e.x > S.camX + W + 30) { e.dead = true; e.spr.remove(); }
      }
      // contacto con el jugador
      if (!e.dead && e.type !== 'capsule' && e.type !== 'turret' && !p.dead && hit(entBox(e), playerBox())) hurtPlayer();
    }
    ents = ents.filter((e) => !e.dead || e.keepSpr);
  }

  // ---------------- jefe
  function startBoss() {
    S.bossTrig = true;
    const W = Engine.W;
    Object.assign(boss, { on: true, st: 'enter', hp: 150 + S.loop * 60, max: 150 + S.loop * 60, x: S.camX + W + 90, y: 60, t: 0, pt: 1.2, pat: 0, flashT: 0, tx: S.camX + W * 0.66, phase: 1, dyT: 0, smokeT: 0 });
    boss.spr.show(true); boss.rotor.show(true);
    hud.b.hidden = false;
    Snd.play(SONGS.boss); Snd.sfx('alarm');
    banner('¡ALERTA!', 'HELICÓPTERO COLOSO-07');
    S.alertT = 2;
  }
  function updateBoss(dt) {
    const b = boss, p = player, W = Engine.W;
    if (!b.on) return;
    b.t += dt;
    if (b.flashT > 0) b.flashT -= dt;
    const L = S.camX + 60, Rr = S.camX + W - 60;
    if (b.st === 'enter') {
      b.x += (b.tx - b.x) * Math.min(1, dt * 1.6);
      if (Math.abs(b.x - b.tx) < 2) { b.st = 'fight'; b.pt = 0.8; }
    } else if (b.st === 'fight') {
      b.y = 58 + Math.sin(b.t * 1.7) * 7;
      b.x += (b.tx - b.x) * Math.min(1, dt * (b.pat === 1 ? 1.1 : 2));
      if (b.phase === 1 && b.hp < b.max * 0.5) { b.phase = 2; Snd.sfx('alarm'); UI.toast('¡EL COLOSO ESTÁ DAÑADO!'); }
      if (b.phase === 2 && (b.smokeT -= dt) <= 0) { b.smokeT = 0.05; parts.emit(b.x + 20 + rand(-6, 6), b.y - 14, rand(20, 40), rand(-30, -10), 1.1, 0x5a4a6a, 0x221a30, 2, 4, 0, 0.5); }
      b.pt -= dt;
      const sp = b.phase === 2 ? 1.35 : 1;
      if (b.pt <= 0) {
        const pats = b.phase === 2 ? [0, 1, 2, 3] : [0, 1, 2];
        b.pat = pats[(pats.indexOf(b.pat) + 1) % pats.length];
        b.k = 0; b.kt = 0;
        if (b.pat === 1) b.tx = b.x > (L + Rr) / 2 ? L + 30 : Rr - 10;
        b.pt = (b.pat === 1 ? 2.4 : 2.0) / sp;
      }
      b.kt -= dt;
      if (b.kt <= 0) {
        const gx = b.x + A.boss.gun[0], gy = b.y + A.boss.gun[1];
        if (b.pat === 0 && b.k < 3) {
          const a = Math.atan2(p.y - 14 - gy, p.x - gx);
          for (const da of [-0.17, 0, 0.17]) enemyShot(gx, gy, Math.cos(a + da) * 125 * sp, Math.sin(a + da) * 125 * sp);
          Snd.sfx('eshot'); b.k++; b.kt = 0.3 / sp;
        } else if (b.pat === 1 && b.k < 6) {
          const pod = A.boss.pods[b.k % 2];
          enemyShot(b.x + pod[0], b.y + pod[1], 0, 40, 'bomb'); b.k++; b.kt = 0.32 / sp;
        } else if (b.pat === 2 && b.k < (b.phase === 2 ? 3 : 2)) {
          const pod = A.boss.pods[b.k % 2];
          const m = enemyShot(b.x + pod[0], b.y + pod[1], 40, -130, 'missile');
          if (m) { m.hp = 1; m.ang = -Math.PI / 2; }
          Snd.sfx('missile'); b.k++; b.kt = 0.45;
        } else if (b.pat === 3 && b.k < 2) {
          for (let i = -3; i <= 3; i++) { const a = Math.PI / 2 + i * 0.28; enemyShot(gx + 10, gy, Math.cos(a) * 110, Math.sin(a) * 110); }
          Snd.sfx('spread'); b.k++; b.kt = 0.5;
        }
      }
    } else if (b.st === 'dying') {
      b.dyT += dt;
      b.x += Math.sin(b.t * 40) * 0.6;
      if ((b.boomT = (b.boomT || 0) - dt) <= 0) { b.boomT = 0.11; boomAt(b.x + rand(-46, 28), b.y + rand(-16, 12), Math.random() < 0.5); Snd.sfx('explode'); shake(3, 0.2); }
      if (b.dyT > 2.2) { b.y += (b.dyT - 2.2) * 160 * dt; b.spr.rot(-(b.dyT - 2.2) * 0.4); }
      if (b.dyT > 3.2) {
        b.on = false; b.spr.show(false); b.rotor.show(false); b.spr.rot(0);
        for (let i = 0; i < 6; i++) boomAt(b.x + rand(-40, 30), b.y + rand(-20, 10));
        Snd.sfx('boom'); flash(0.9, [1, 0.85, 0.6]); shake(6, 0.8);
        hud.b.hidden = true;
        S.state = 'clear'; S.clearT = 0;
      }
    }
    if (b.on) {
      const body = b.flashT > 0 ? A.boss.bodyW : (b.phase === 2 ? A.boss.bodyHurt : A.boss.body)[Math.floor(b.t * 16) & 1];
      b.spr.set(body).at(b.x, b.y);
      b.rotor.set(A.boss.rotor[[0, 1, 2, 1][Math.floor(b.t * 30) % 4]]).at(b.x - 2, b.y - 27);
      if (b.st === 'fight' && !p.dead && hit(bossBox(), playerBox())) hurtPlayer();
    }
  }
  const bossBox = () => [boss.x - 48, boss.y - 14, 74, 26];
  function damageBoss(n) {
    if (boss.st !== 'fight') return;
    boss.hp -= n; boss.flashT = 0.05;
    if (boss.hp <= 0) { boss.st = 'dying'; boss.dyT = 0; addScore(20000); Snd.sfx('boom'); flash(0.4); }
  }

  // ---------------- jugador
  function hurtPlayer() {
    const p = player;
    if (p.dead || p.inv > 0 || p.barrier > 0 || S.state !== 'play') return;
    p.dead = true; p.deadT = 0; p.vx = -p.face * 55; p.vy = -230; p.ground = false; p.jumping = false; p.prone = false;
    Snd.sfx('die'); shake(3, 0.25); flash(0.3, [1, 0.3, 0.4]); UI.vibrate(80);
    parts.burst(p.x, p.y - 16, 14, 100, 0.5, 0xffffff, 0xff4f9a, 2, 1, 200, 1);
  }
  function updatePlayer(dt) {
    const p = player, I = Input.held, W = Engine.W;
    if (p.dead) {
      p.deadT += dt;
      p.aura.show(false);
      if (p.fell) p.spr.show(false);
      else if (!p.ground) {
        const y0 = p.y;
        p.vy = Math.min(p.vy + G * dt, MAXF); p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.vy > 0) { const l = landOn(p.x, y0, p.y, null); if (l) { p.y = l.y; p.ground = true; } }
      }
      if (!p.fell) p.spr.set(p.ground ? A.hero.dead : A.hero.hurt).setFlip(p.face < 0).anchor(p.x, p.y, ANCHOR[0], ANCHOR[1]).show(p.deadT < 1.2 || Math.floor(p.deadT * 12) % 2 === 0);
      if (p.deadT > 1.7) {
        S.lives--;
        if (S.lives <= 0) { gameOver(); return; }
        spawnPlayer(S.camX + 40, false);
      }
      return;
    }
    let mx = (I.right ? 1 : 0) - (I.left ? 1 : 0);
    if (p.ground) { p.prone = I.down && mx === 0; if (p.prone) mx = 0; }
    if (mx) p.face = mx;
    if (Input.pressed.a && p.ground) {
      if (I.down && p.plat && !p.plat.ground) { p.dropPlat = p.plat; p.dropT = 0.3; p.ground = false; p.vy = 30; p.jumping = false; }
      else { p.vy = JV; p.ground = false; p.jumping = true; Snd.sfx('jump'); }
      p.prone = false;
    }
    if (p.ground) p.aim = p.prone ? 'prone' : I.up ? (mx ? 'dup' : 'up') : I.down && mx ? 'ddown' : 'fwd';
    else p.aim = I.up ? (mx ? 'dup' : 'up') : I.down ? (mx ? 'ddown' : 'down') : 'fwd';
    p.vx = mx * RUN;
    const y0 = p.y;
    if (!p.ground) p.vy = Math.min(p.vy + G * dt, MAXF);
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.x = clamp(p.x, S.camX + 8, Math.min(END - 8, S.camX + W - 8));
    if (p.dropT > 0) p.dropT -= dt;
    if (!p.ground && p.vy >= 0) {
      const l = landOn(p.x, y0, p.y, p.dropT > 0 ? p.dropPlat : null);
      if (l) { p.y = l.y; p.vy = 0; p.ground = true; p.jumping = false; p.plat = l; if (y0 < l.y - 6) parts.burst(p.x, p.y, 5, 30, 0.3, 0xd8d2e8, 0x6e6888, 1, 1, 0, 3); }
    }
    if (p.ground && p.plat && !(p.x >= p.plat.x0 - 3 && p.x <= p.plat.x1 + 3)) {
      const s = supportAt(p.x, p.y);
      if (s) p.plat = s; else { p.ground = false; p.vy = 0; p.jumping = false; }
    }
    if (p.y > H + 30) {
      p.dead = true; p.fell = true; p.deadT = 0.3; p.vx = 0; p.vy = 0; p.spr.show(false); p.aura.show(false);
      Snd.sfx('die'); shake(2, 0.2); UI.vibrate(80);
      return;
    }
    p.fireT -= dt;
    if (I.b && p.fireT <= 0) { firePlayer(); p.fireT = WEAP[p.weapon].rate; }
    if (p.inv > 0) p.inv -= dt;
    if (p.barrier > 0) p.barrier -= dt;
    // animación
    p.anim += dt;
    let tex;
    if (p.jumping) tex = A.hero.ball[Math.floor(p.anim * 16) % 4];
    else if (!p.ground) tex = A.hero.air[p.aim === 'down' ? 'ddown' : p.aim === 'prone' ? 'fwd' : p.aim];
    else if (p.prone) tex = A.hero.prone;
    else if (mx) tex = A.hero.run[p.aim === 'up' ? 'dup' : p.aim][Math.floor(p.anim * 11) % 6];
    else tex = A.hero.stand[p.aim === 'up' ? 'up' : 'fwd'][Math.floor(p.anim * 3) % 3];
    p.spr.set(tex).setFlip(p.face < 0);
    if (p.jumping) p.spr.at(p.x, p.y - 14); else p.spr.anchor(p.x, p.y, ANCHOR[0], ANCHOR[1]);
    p.spr.show(!(p.inv > 0 && Math.floor(p.inv * 14) % 2 === 0));
    p.aura.show(p.barrier > 0).at(p.x, p.y - 14);
    if (p.barrier > 0) p.aura.mat.opacity = 0.5 + Math.sin(p.anim * 20) * 0.4;
    // recoger medallas
    for (const it of items) {
      if (!it.medal || it.dead) continue;
      if (hit([it.x - 10, it.y - 17, 20, 18], playerBox())) {
        it.dead = true; it.spr.remove();
        Snd.sfx('powerup'); addScore(100);
        if (it.w === 'B') { p.barrier = 12; UI.toast('BARRERA · INVENCIBLE 12 s'); }
        else { p.weapon = it.w; UI.toast({ M: 'AMETRALLADORA', S: 'DISPERSIÓN ×5', L: 'LÁSER PERFORANTE', F: 'FUEGO EN ESPIRAL' }[it.w]); }
        parts.burst(p.x, p.y - 16, 16, 90, 0.5, 0xffe066, 0xff4f9a, 2, 1);
      }
    }
  }

  // ---------------- proyectiles
  function updateShots(dt) {
    const W = Engine.W, p = player;
    for (const b of pbs) {
      if (!b.on) continue;
      b.t += dt;
      if (b.w === 'F') {
        b.bx += b.vx * dt; b.by += b.vy * dt;
        const ph = b.t * 15, r = 7, px = -b.dy, py = b.dx;
        b.x = b.bx + (Math.cos(ph) - 1) * r * b.dx * 0.6 + Math.sin(ph) * r * px;
        b.y = b.by + (Math.cos(ph) - 1) * r * b.dy * 0.6 + Math.sin(ph) * r * py;
        b.spr.set(A.shot.fire[Math.floor(b.t * 18) & 1]);
      } else { b.x += b.vx * dt; b.y += b.vy * dt; }
      if (b.w === 'S' && b.t > 0.12) b.spr.set(A.shot.sp2);
      b.spr.at(b.x, b.y);
      if (b.x < S.camX - 16 || b.x > S.camX + W + 16 || b.y < -16 || b.y > H + 16) { b.on = false; b.spr.show(false); continue; }
      const bb = b.w === 'L' ? [b.x - 7, b.y - 7, 14, 14] : [b.x - 3, b.y - 3, 6, 6];
      let used = false;
      for (const e of ents) {
        if (e.dead || (b.hits && b.hits.has(e))) continue;
        if (e.type === 'drone' && e.t < 0) continue;
        if (!hit(bb, entBox(e))) continue;
        e.hp -= b.dmg; e.flashT = 0.06;
        parts.burst(b.x, b.y, 4, 70, 0.2, 0xffffff, 0xffe066, 1, 1);
        if (e.hp <= 0) killEnt(e); else Snd.sfx('tink');
        if (b.pierce) b.hits.add(e); else { used = true; break; }
      }
      if (!used) for (const m of ebs) {
        if (!m.on || m.kind !== 'missile') continue;
        if (hit(bb, [m.x - 6, m.y - 4, 12, 8])) { m.on = false; m.spr.show(false); boomAt(m.x, m.y, true); Snd.sfx('explode'); addScore(50); if (!b.pierce) { used = true; break; } }
      }
      if (!used && boss.on && boss.st === 'fight' && hit(bb, bossBox())) {
        if (!(b.hits && b.hits.has(boss))) {
          damageBoss(b.dmg);
          parts.burst(b.x, b.y, 4, 80, 0.2, 0xffffff, 0xff9a2e, 1, 1);
          Snd.sfx('tink');
          if (b.pierce) b.hits.add(boss); else used = true;
        }
      }
      if (used) { b.on = false; b.spr.show(false); }
    }
    for (const b of ebs) {
      if (!b.on) continue;
      b.t += dt;
      if (b.kind === 'bomb') {
        b.vy = Math.min(b.vy + 500 * dt, 300); b.x += b.vx * dt; b.y += b.vy * dt;
        const s = landOn(b.x, b.y - b.vy * dt, b.y, null);
        if (s) {
          b.on = false; b.spr.show(false); boomAt(b.x, s.y - 10); Snd.sfx('explode'); shake(2, 0.15);
          for (const dx of [-8, 8]) { const f = enemyShot(b.x + dx, s.y - 6, dx * 9, -60); if (f) f.kind = 'spark'; }
          if (!player.dead && Math.abs(player.x - b.x) < 18 && Math.abs(player.y - s.y) < 20) hurtPlayer();
          continue;
        }
        b.spr.at(b.x, b.y);
      } else if (b.kind === 'missile') {
        if (b.t > 0.45) {
          const want = Math.atan2(p.y - 16 - b.y, p.x - b.x);
          let d = want - b.ang;
          while (d > Math.PI) d -= Math.PI * 2;
          while (d < -Math.PI) d += Math.PI * 2;
          b.ang += clamp(d, -2.4 * dt, 2.4 * dt);
          const sp = Math.min(150, 60 + b.t * 90);
          b.vx = Math.cos(b.ang) * sp; b.vy = Math.sin(b.ang) * sp;
        } else { b.vy += 260 * dt; b.ang = Math.atan2(b.vy, b.vx); }
        b.x += b.vx * dt; b.y += b.vy * dt;
        b.spr.at(b.x, b.y).rot(-b.ang);
        if (Math.random() < 0.8) parts.emit(b.x - Math.cos(b.ang) * 7, b.y - Math.sin(b.ang) * 7, rand(-10, 10), rand(-10, 10), 0.35, 0xffe066, 0x5a4a6a, 2, 1);
        if (b.t > 4 || b.y > GY - 2) { b.on = false; b.spr.show(false); boomAt(b.x, b.y, true); Snd.sfx('explode'); continue; }
      } else {
        if (b.kind === 'spark') b.vy += 300 * dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
        b.spr.set(A.shot.eb[Math.floor(b.t * 12) & 1]).at(b.x, b.y);
      }
      if (b.x < S.camX - 20 || b.x > S.camX + W + 20 || b.y < -30 || b.y > H + 10) { b.on = false; b.spr.show(false); continue; }
      if (!player.dead && hit([b.x - 2, b.y - 2, 4, 4], playerBox())) {
        if (player.barrier > 0) { b.on = false; b.spr.show(false); parts.burst(b.x, b.y, 5, 60, 0.25, 0xffe066, 0xffffff, 1, 1); }
        else if (player.inv <= 0) { b.on = false; b.spr.show(false); hurtPlayer(); }
      }
    }
  }
  function updateItems(dt) {
    for (const it of items) {
      if (it.dead) continue;
      it.t += dt;
      if (it.corpse) {
        it.vy += G * dt; it.x += it.vx * dt; it.y += it.vy * dt;
        it.spr.anchor(it.x, it.y, ANCHOR[0], ANCHOR[1]).show(Math.floor(it.t * 16) % 2 === 0);
        if (it.t > 0.55) { it.dead = true; it.spr.remove(); parts.burst(it.x, it.y - 14, 8, 50, 0.4, 0xff4f9a, 0x3a1a3a, 2, 1); }
      } else if (it.medal) {
        if (!it.ground) {
          const y0 = it.y;
          it.vy = Math.min(it.vy + 520 * dt, 260); it.x += it.vx * dt; it.y += it.vy * dt;
          if (it.vy > 0) { const l = landOn(it.x, y0, it.y, null); if (l) { it.y = l.y - 1; if (it.vy > 120) it.vy = -it.vy * 0.35; else { it.ground = true; it.vx = 0; } } }
          if (it.y > H + 20) { it.dead = true; it.spr.remove(); continue; }
        }
        it.spr.at(it.x, it.y - 8 + (it.ground ? Math.round(Math.sin(it.t * 5)) : 0));
        if (it.x < S.camX - 30) { it.dead = true; it.spr.remove(); }
      }
    }
    items = items.filter((it) => !it.dead);
    for (const b of booms) {
      if (!b.on) continue;
      b.t += dt;
      const f = Math.floor(b.t * b.fps);
      if (f >= A.boom.length) { b.on = false; b.spr.show(false); } else b.spr.set(A.boom[f]).at(b.x, b.y - f * 0.6);
    }
  }

  // ---------------- ciclo principal
  function addScore(n) {
    S.score += n;
    if (S.score >= S.nextLife) { S.nextLife += 50000; S.lives = Math.min(S.lives + 1, 9); Snd.sfx('oneup'); UI.toast('¡VIDA EXTRA!'); }
  }
  function update(dt) {
    S.t += dt;
    const W = Engine.W, p = player;
    if (S.introT > 0 && (S.introT -= dt) <= 0) banner(null);
    if (S.alertT > 0 && (S.alertT -= dt) <= 0) banner(null);
    if (S.state === 'play') {
      updatePlayer(dt);
      if (S.state !== 'play') return;
      const prevCam = S.camX;
      if (!p.dead) S.camX = clamp(Math.max(S.camX, p.x - W * 0.42), 0, END - W);
      S.camDX = S.camX - prevCam;
      while (S.spawnI < S.spawnList.length && S.spawnList[S.spawnI].x <= S.camX + W + 16) spawnEnt(S.spawnList[S.spawnI++]);
      if (!S.bossTrig) {
        S.runT -= dt;
        if (S.runT <= 0) { spawnRunner(); S.runT = rand(1.3, 2.7) / (1 + S.loop * 0.35); }
        if (S.camX >= END - W - 0.5) startBoss();
      }
      updateEnts(dt);
      updateBoss(dt);
      updateShots(dt);
    } else if (S.state === 'clear') {
      S.clearT += dt;
      updateBoss(dt);
      if (S.clearT > 0.8 && !S.clearShown) {
        S.clearShown = true;
        Snd.stop(); Snd.sfx('clear');
        const bonus = 10000 + S.lives * 2000;
        addScore(bonus);
        banner('¡MISIÓN CUMPLIDA!', `BONO +${bonus}`);
      }
      if (S.clearT > 4.5) { S.clearShown = false; S.loop++; const w = p.weapon; beginStage(); p.weapon = w; }
    }
    updateItems(dt);
    for (const f of S.fireSprs) f.spr.set(A.fire[Math.floor(S.t * 10 + f.ph) % 3]);
    if (Math.random() < dt * 6) parts.emit(S.camX + rand(0, W), H + 2, rand(-8, 8), rand(-38, -16), rand(2, 4), 0xffb347, 0x6a2a4a, 1, 1, -4, 0.2);
    parts.update(dt);
  }
  function render() {
    const W = Engine.W, cx = S.camX;
    for (const L of layers) {
      L.m.scale.set(W, L.h, 1);
      L.m.position.set(cx + W / 2, -(L.top + L.h / 2), L.m.position.z);
      if (L.rep) { L.t.repeat.x = W / L.w; L.t.offset.x = (Math.round(cx * L.factor) % L.w) / L.w; }
    }
    S.sun.at(cx + W * 0.64 - cx * 0.02, 100);
    const t = performance.now() / 1000;
    beams.forEach((b) => { b.pivot.position.set(Math.round(cx + W * b.x - cx * 0.04), -176, -80); b.pivot.rotation.z = Math.sin(t * 0.5 + b.ph) * 0.45; });
    parts.sync();
    setCam(cx, 0);
    renderScene(scene);
    drawHud();
  }
  function drawHud() {
    const set = (k, v, fn) => { if (hc[k] !== v) { hc[k] = v; fn(v); } };
    set('s', S.score, (v) => (hud.s.textContent = pad6(v)));
    set('h', Math.max(S.hi, S.score), (v) => (hud.h.textContent = pad6(v)));
    set('v', S.lives, (v) => (hud.v.innerHTML = '<b></b>'.repeat(Math.max(0, v - 1))));
    set('w', player.weapon, (v) => { hud.w.textContent = v; hud.w.style.background = { N: '#6a6488', M: '#e23a43', S: '#ff7a1a', L: '#1fa6d6', F: '#d43a8a' }[v]; hud.wn.textContent = { N: 'NORMAL', M: 'AMETRALLA', S: 'DISPERSIÓN', L: 'LÁSER', F: 'FUEGO' }[v]; });
    if (boss.on) set('b', Math.max(0, Math.round((boss.hp / boss.max) * 100)), (v) => (hud.bb.style.width = v + '%'));
  }
  function gameOver() {
    S.state = 'over';
    const rec = S.score > S.hi;
    if (rec) Store.set('hi_contra', S.score);
    banner(null); hud.b.hidden = true;
    Snd.stop(); Snd.sfx('gameover');
    UI.gameOver('NEÓN COMMANDO', S.score, rec, [['Misión', S.loop + 1], ['Avance', Math.min(100, Math.round((S.camX / (END - Engine.W)) * 100)) + '%']]);
  }
  function exit() { if (S.state !== 'over' && S.score > (S.hi || 0)) Store.set('hi_contra', S.score); }
  function warp(x) { player.x = x; player.y = -10; player.ground = false; S.camX = clamp(x - 100, 0, END - Engine.W); S.spawnI = S.spawnList.findIndex((q) => q.x > S.camX + Engine.W); if (S.spawnI < 0) S.spawnI = S.spawnList.length; }
  return { start, update, render, exit, warp, peek: () => ({ S, player, ents, boss }), get art() { build(); return A; } };
})();

// =====================================================================
//  MAIN · consola: menú de cartuchos, pausa, fin de juego, layout, bucle
// =====================================================================
const $ = (s) => document.querySelector(s);
const scr = $('#screen');
let mode = 'menu', game = null, overlay = null, osel = 0, sel = Store.get('cart', 0) % 3;
let toastT = 0;

const UI = {
  $: (s) => $('#hud').querySelector(s),
  setHud(html) { $('#hud').innerHTML = html; },
  setButtons(a, b) { $('#lblA').textContent = a; $('#lblB').textContent = b; },
  toast(msg) {
    const t = $('#toast');
    t.querySelector('span').textContent = msg;
    t.hidden = false; toastT = 1.8;
  },
  vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* sin vibración */ } },
  gameOver(name, score, rec, rows) {
    openOverlay('over', `
      <div class="panel" role="dialog" aria-label="Fin del juego">
        <h2>FIN DEL JUEGO</h2>
        <p>${name}</p>
        <div class="big">${pad6(score)}</div>
        ${rec ? '<p style="color:var(--sun)">¡NUEVO RÉCORD!</p>' : ''}
        <div class="tally">${rows.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>
        <button class="mbtn" data-act="retry">REINTENTAR</button>
        <button class="mbtn" data-act="menu">MENÚ</button>
      </div>`);
  },
};

// ---------------- overlays (pausa / fin)
function openOverlay(kind, html) {
  overlay = kind; osel = 0;
  const o = $('#overlay');
  o.innerHTML = html; o.hidden = false;
  o.querySelectorAll('.mbtn').forEach((b, i) => {
    b.addEventListener('click', () => { osel = i; overlayAct(b.dataset.act); });
  });
  markOverlay();
}
function closeOverlay() { overlay = null; $('#overlay').hidden = true; $('#overlay').innerHTML = ''; Input.reset(); }
function markOverlay() { $('#overlay').querySelectorAll('.mbtn').forEach((b, i) => b.classList.toggle('sel', i === osel)); }
function openPause() {
  Snd.sfx('pause'); Snd.suspend();
  openOverlay('pause', `
    <div class="panel" role="dialog" aria-label="Pausa">
      <h2>PAUSA</h2>
      <button class="mbtn" data-act="resume">CONTINUAR</button>
      <button class="mbtn" data-act="restart">REINICIAR</button>
      <button class="mbtn" data-act="menu">SALIR AL MENÚ</button>
      <p>${Engine.touch ? 'START pausa · A elegir' : 'ENTER pausa · Z elegir · M sonido · C filtro CRT'}</p>
    </div>`);
}
function overlayAct(act) {
  Snd.unlock(); Snd.resume();
  if (act === 'resume') { closeOverlay(); Snd.sfx('select'); }
  else if (act === 'restart' || act === 'retry') { closeOverlay(); Snd.sfx('start'); game.exit(); game.start(); }
  else if (act === 'menu') { closeOverlay(); toMenu(); }
}
function overlayStep() {
  const btns = $('#overlay').querySelectorAll('.mbtn');
  if (Input.pressed.up) { osel = (osel + btns.length - 1) % btns.length; markOverlay(); Snd.sfx('move'); }
  if (Input.pressed.down) { osel = (osel + 1) % btns.length; markOverlay(); Snd.sfx('move'); }
  if (Input.pressed.a || (Input.pressed.start && overlay === 'over')) overlayAct(btns[osel].dataset.act);
  else if (overlay === 'pause' && (Input.pressed.start || Input.pressed.b || Input.pressed.select)) overlayAct('resume');
}

// ---------------- menú
const menuScene = new THREE.Scene();
const menuMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }, res: { value: new THREE.Vector2(384, 216) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform float time; uniform vec2 res; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 p = floor(vUv * res) + 0.5;
      float hz = res.y * 0.36;
      vec3 col;
      if (p.y > hz) {
        float t = (p.y - hz) / (res.y - hz);
        col = mix(vec3(1.0, 0.42, 0.38), vec3(0.42, 0.12, 0.5), smoothstep(0.0, 0.5, t));
        col = mix(col, vec3(0.06, 0.03, 0.16), smoothstep(0.45, 1.0, t));
        vec2 sc = vec2(res.x * 0.5, hz + 28.0);
        float d = length(p - sc);
        float band = fract((sc.y - p.y) / 7.0 + time * 0.25);
        bool gap = p.y < sc.y - 2.0 && band < (sc.y - p.y) / 60.0 + 0.12;
        if (d < 40.0 && !gap) col = mix(vec3(1.0, 0.9, 0.38), vec3(1.0, 0.3, 0.58), clamp((sc.y + 40.0 - p.y) / 80.0, 0.0, 1.0));
        float h = hash(floor(p / 2.0));
        if (h > 0.986 && t > 0.4) col += vec3(0.75) * (0.5 + 0.5 * sin(time * 3.0 + h * 50.0));
      } else {
        float z = hz - p.y;
        float persp = 60.0 / (z + 2.0);
        float gx = (p.x - res.x * 0.5) * persp * 0.11;
        float gz = persp * 2.6 + time * 2.0;
        float lx = step(abs(fract(gx + 0.5) - 0.5), fwidth(gx) * 0.7);
        float lz = step(abs(fract(gz + 0.5) - 0.5), fwidth(gz) * 0.7);
        col = mix(vec3(0.09, 0.03, 0.16), vec3(0.03, 0.01, 0.08), z / hz);
        col = mix(col, vec3(1.0, 0.31, 0.6), max(lx, lz) * clamp(1.15 - z / hz * 0.35, 0.0, 1.0) * smoothstep(3.0, 16.0, z));
        col += vec3(1.0, 0.35, 0.5) * exp(-z * 0.18) * 0.55;
      }
      col = floor(col * 14.0 + 0.5) / 14.0;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const menuQuad = new THREE.Mesh(QUAD, menuMat);
menuQuad.position.z = -50;
menuScene.add(menuQuad);
const skyline = (() => {
  const { c, g } = mk(256, 60);
  const r = rng32(8);
  let x = 0;
  while (x < 256) {
    const w = 10 + ((r() * 18) | 0), h = 12 + ((r() * 44) | 0);
    R(g, '#140a2c', x, 60 - h, w, h);
    for (let k = 0; k < 4; k++) if (r() < 0.6) R(g, r() < 0.5 ? '#ff4f9a' : '#ffd36b', x + 2 + ((r() * (w - 4)) | 0), 60 - h + 3 + ((r() * (h - 6)) | 0));
    if (r() < 0.3) R(g, '#140a2c', x + (w >> 1), 60 - h - 6, 1, 6);
    x += w + 1;
  }
  const t = T(c); t.wrapS = THREE.RepeatWrapping;
  const m = new THREE.Mesh(QUAD, new THREE.MeshBasicMaterial({ map: t, alphaTest: 0.5 }));
  m.position.z = -40;
  menuScene.add(m);
  return { m, t };
})();
function drawMenuThumbs() {
  const RA = Rally.art;
  const hero = heroPose(HERO, { aim: 'dup', legF: RUN_LEG[0], legB: RUN_LEG[3], tf: 1 });
  // rally
  {
    const c = $('#cart-rally canvas'), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    R(g, '#4ea94b', 0, 0, 96, 64);
    for (let i = 0; i < 12; i++) disc(g, 6 + i * 9, 6 + (i % 2) * 3, 4, '#2f7d3b');
    R(g, '#3b3d50', 0, 22, 96, 18); R(g, '#3b3d50', 54, 0, 18, 64);
    for (let x = 0; x < 96; x += 8) R(g, '#e8dfb8', x, 30, 4, 2);
    R(g, '#bdb8cc', 0, 20, 54, 2); R(g, '#bdb8cc', 0, 40, 54, 2); R(g, '#bdb8cc', 72, 20, 24, 2); R(g, '#bdb8cc', 72, 40, 24, 2);
    R(g, '#c9694f', 74, 44, 22, 20); R(g, '#e89a7c', 74, 44, 22, 2);
    R(g, '#6f7fb8', 0, 44, 50, 20); R(g, '#9fb0e2', 0, 44, 50, 2);
    g.drawImage(rot90(RA.carPc[0], 1), 18, 22);
    g.drawImage(rot90(RA.carEc[0], 1), 0, 22);
    g.drawImage(RA.canSc[0], 56, 4);
    g.drawImage(RA.canNc[0], 74, 23);
    g.drawImage(rallySmoke(2), 2, 4);
  }
  // commando
  {
    const c = $('#cart-contra canvas'), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    for (let y = 0; y < 64; y++) { const t = y / 64; R(g, `rgb(${Math.round(40 + t * 210)},${Math.round(20 + t * 110)},${Math.round(90 + t * 10)})`, 0, y, 96, 1); }
    disc(g, 66, 34, 14, '#ffd36b');
    for (let y = 36; y < 48; y += 4) R(g, `rgb(${Math.round(40 + (y / 64) * 210)},${Math.round(20 + (y / 64) * 110)},100)`, 50, y, 32, 1);
    const r = rng32(4);
    for (let x = 0; x < 96;) { const w = 6 + ((r() * 10) | 0), h = 10 + ((r() * 24) | 0); R(g, '#2b1d4f', x, 52 - h, w, h); if (r() < 0.6) R(g, '#ffd36b', x + 2, 54 - h, 1, 1); x += w + 1; }
    R(g, '#a8a2bc', 0, 52, 96, 3); R(g, '#cfc9de', 0, 52, 96, 1); R(g, '#3b2f4f', 0, 55, 96, 9);
    g.drawImage(hero, 4, 13);
    for (let k = 0; k < 3; k++) { disc(g, 38 + k * 10, 20 - k * 8, 1.8, '#ffd23f'); R(g, '#ffffff', 38 + k * 10, 20 - k * 8); }
  }
  // próximamente
  {
    const c = $('#cart-soon canvas'), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    R(g, '#120d26', 0, 0, 96, 64);
    for (let y = 0; y < 64; y += 4) R(g, '#1a1434', 0, y, 96, 1);
    g.save(); g.translate(36, 14); g.scale(8, 8); glyph(g, '?', 0, 0, '#4fe3ff'); g.restore();
    g.save(); g.translate(39, 15); g.scale(8, 8); glyph(g, '?', 0, 0, '#ff4f9a'); g.restore();
  }
}
function refreshMenu() {
  $('#rec-rally').textContent = 'REC ' + pad6(Store.get('hi_rally', 0));
  $('#rec-contra').textContent = 'REC ' + pad6(Store.get('hi_contra', 0));
  document.querySelectorAll('.cart').forEach((c, i) => c.classList.toggle('sel', i === sel));
  $('#optSound').textContent = Snd.isMuted() ? 'SONIDO OFF' : 'SONIDO ON';
  $('#optSound').classList.toggle('on', !Snd.isMuted());
  $('#optCrt').textContent = Engine.crt ? 'CRT ON' : 'CRT OFF';
  $('#optCrt').classList.toggle('on', Engine.crt);
  const fb = $('#optFull');
  fb.hidden = !fsOK || !!window.__NATIVE_APP || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  fb.textContent = isFull() ? 'SALIR PANT. COMPLETA' : 'PANTALLA COMPLETA';
  fb.classList.toggle('on', isFull());
}
function menuStep() {
  if (Input.pressed.left) { sel = (sel + 2) % 3; Snd.sfx('move'); refreshMenu(); }
  if (Input.pressed.right) { sel = (sel + 1) % 3; Snd.sfx('move'); refreshMenu(); }
  if (Input.pressed.a || Input.pressed.start) launch(sel);
  if (Input.pressed.select) toggleSound();
}
function launch(i) {
  Snd.unlock();
  sel = i; Store.set('cart', i); refreshMenu();
  if (i === 2) { Snd.sfx('back'); UI.toast('CARTUCHO 3 EN DESARROLLO · PRÓXIMAMENTE'); return; }
  Snd.sfx('start');
  $('#menu').hidden = true;
  mode = 'game';
  document.body.classList.remove('inmenu');
  game = i === 0 ? Rally : Contra;
  Input.reset();
  game.start();
  keepAwake(true);
  if (game === Contra && Engine.touch && innerHeight > innerWidth) UI.toast('GIRA EL TELÉFONO PARA VER MÁS NIVEL');
}
function toMenu() {
  if (game) game.exit();
  keepAwake(false);
  game = null; mode = 'menu';
  document.body.classList.add('inmenu');
  UI.setHud(''); UI.setButtons('OK', 'VOLVER');
  $('#menu').hidden = false;
  Engine.flash = 0; Engine.shakeT = 0;
  refreshMenu();
  Snd.play(SONGS.menu);
  Input.reset();
}
// pantalla completa (navegador) y pantalla siempre encendida mientras se juega
const fsEl = document.documentElement;
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFull() {
  try {
    if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => UI.toast('ESTE NAVEGADOR NO PERMITE PANTALLA COMPLETA'));
    }
  } catch (e) { UI.toast('ESTE NAVEGADOR NO PERMITE PANTALLA COMPLETA'); }
}
let wake = null;
async function keepAwake(on) {
  try {
    if (on && !wake && navigator.wakeLock && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
function toggleSound() { Snd.unlock(); Snd.toggleMute(); refreshMenu(); Snd.sfx('select'); }
function toggleCrt() { Engine.crt = !Engine.crt; Store.set('crt', Engine.crt); refreshMenu(); }

// ---------------- controles táctiles
function bindPad() {
  const dp = $('#dpad');
  let dpId = null;
  const T0 = Input.touch;
  const setDir = (cx, cy) => {
    const r = dp.getBoundingClientRect();
    const dx = (cx - (r.left + r.width / 2)) / (r.width / 2), dy = (cy - (r.top + r.height / 2)) / (r.height / 2);
    const th = 0.3;
    let L = dx < -th, Rr = dx > th, U = dy < -th, D = dy > th;
    if (Math.abs(dx) > Math.abs(dy) * 2.2) U = D = false;
    if (Math.abs(dy) > Math.abs(dx) * 2.2) L = Rr = false;
    for (const [k, v] of [['left', L], ['right', Rr], ['up', U], ['down', D]]) {
      if (v && !T0[k]) { Input.latch(k); UI.vibrate(6); }
      T0[k] = v;
    }
    dp.className = (U ? 'u ' : '') + (D ? 'd ' : '') + (L ? 'l ' : '') + (Rr ? 'r' : '');
  };
  const clearDir = () => { T0.left = T0.right = T0.up = T0.down = false; dp.className = ''; };
  dp.addEventListener('pointerdown', (e) => { e.preventDefault(); Snd.unlock(); dpId = e.pointerId; try { dp.setPointerCapture(e.pointerId); } catch (er) { /* */ } setDir(e.clientX, e.clientY); });
  dp.addEventListener('pointermove', (e) => { if (e.pointerId === dpId) setDir(e.clientX, e.clientY); });
  const endDp = (e) => { if (e.pointerId !== dpId) return; dpId = null; clearDir(); };
  dp.addEventListener('pointerup', endDp); dp.addEventListener('pointercancel', endDp); dp.addEventListener('lostpointercapture', endDp);
  const btn = (el, act) => {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); Snd.unlock();
      try { el.setPointerCapture(e.pointerId); } catch (er) { /* */ }
      T0[act] = true; Input.latch(act); el.classList.add('on'); UI.vibrate(8);
    });
    const up = () => { T0[act] = false; el.classList.remove('on'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  };
  btn($('#btnA'), 'a'); btn($('#btnB'), 'b'); btn($('#btnStart'), 'start'); btn($('#btnSel'), 'select');
}

// ---------------- layout responsivo
function layout() {
  const touch = matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches);
  Engine.touch = touch;
  const portrait = innerHeight > innerWidth;
  const b = document.body.classList;
  b.toggle('touch', touch); b.toggle('portrait', portrait); b.toggle('landscape', !portrait); b.toggle('short', innerHeight < 430);
  const st = $('#stage'), app = $('#app'), pad = $('#pad');
  const ovl = touch && !portrait;
  b.toggle('ovl', ovl);
  let aw, ah, minA = 1.2, maxA = 2.0;
  if (touch && portrait) {
    // vertical: pantalla de borde a borde (marco de 2px); los controles llenan el resto
    st.style.flex = '0 0 auto';
    aw = app.clientWidth - 4;
    ah = Math.max(120, app.clientHeight * 0.6 - 8);
    minA = 1.12;
  } else if (ovl) {
    // horizontal: el juego ocupa toda la pantalla y los controles van encima
    st.style.flex = ''; st.style.height = '';
    aw = app.clientWidth; ah = app.clientHeight;
    maxA = 2.4;
  } else {
    st.style.flex = ''; st.style.height = '';
    const cs = getComputedStyle(st);
    aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 20;
    ah = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 20;
  }
  if (aw < 50 || ah < 50) return;
  const aspect = clamp(aw / ah, minA, maxA);
  const W = Math.round((H * aspect) / 2) * 2;
  let sw = aw, sh = (sw * H) / W;
  if (sh > ah) { sh = ah; sw = (sh * W) / H; }
  sw = Math.floor(sw); sh = Math.floor(sh);
  if (touch && portrait) {
    st.style.height = sh + 8 + 'px';
    const ph = app.clientHeight - (sh + 8);
    pad.style.setProperty('--s', clamp(Math.min(ph / 330, (app.clientWidth / 2 - 26) / 158), 0.7, 1.25).toFixed(3));
  } else if (ovl) pad.style.setProperty('--s', clamp(app.clientHeight / 360, 0.72, 1.15).toFixed(3));
  else pad.style.setProperty('--s', 1);
  scr.style.width = sw + 'px'; scr.style.height = sh + 'px';
  scr.style.setProperty('--px', sh / H + 'px');
  const pr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3.2e6 / (sw * sh)));
  renderer.setPixelRatio(pr);
  renderer.setSize(sw, sh, false);
  setInternalWidth(W);
  menuMat.uniforms.res.value.set(W, H);
}

// ---------------- bucle de juego (paso fijo 60 Hz, render por frame)
let last = performance.now(), acc = 0;
function step(dt) {
  if (Engine.shakeT > 0) Engine.shakeT -= dt;
  if (toastT > 0 && (toastT -= dt) <= 0) $('#toast').hidden = true;
  if (mode === 'menu') menuStep();
  else if (overlay) overlayStep();
  else if (Input.pressed.start) openPause();
  else game.update(dt);
}
function draw() {
  if (mode === 'menu') {
    const W = Engine.W;
    menuQuad.scale.set(W, H, 1); menuQuad.position.set(W / 2, -H / 2, -50);
    menuMat.uniforms.time.value = Engine.time;
    skyline.m.scale.set(W, 60, 1); skyline.m.position.set(W / 2, -(H * 0.64 - 30 + 1), -40);
    skyline.t.repeat.x = W / 256; skyline.t.offset.x = (Math.floor(Engine.time * 6) % 256) / 256;
    setCam(0, 0);
    renderScene(menuScene);
  } else game.render();
}
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  if (dt < 0) dt = 0;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { Input.poll(); step(STEP); Input.end(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  Engine.time += dt;
  Engine.flash = Math.max(0, Engine.flash - dt * 2.4);
  draw();
}

function boot() {
  Engine.crt = Store.get('crt', true);
  layout();
  bindPad();
  drawMenuThumbs();
  refreshMenu();
  $('#menu').hidden = false;
  document.body.classList.add('inmenu');
  document.querySelectorAll('.cart').forEach((c, i) => c.addEventListener('click', () => launch(i)));
  $('#optSound').addEventListener('click', toggleSound);
  $('#optCrt').addEventListener('click', toggleCrt);
  $('#optFull').addEventListener('click', toggleFull);
  document.addEventListener('fullscreenchange', () => { refreshMenu(); setTimeout(layout, 60); });
  document.addEventListener('webkitfullscreenchange', () => { refreshMenu(); setTimeout(layout, 60); });
  Input.onKey = (k) => { if (k === 'mute') toggleSound(); if (k === 'crt') toggleCrt(); };
  addEventListener('pointerdown', () => Snd.unlock(), { passive: true });
  addEventListener('resize', layout);
  addEventListener('orientationchange', () => setTimeout(layout, 120));
  if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('#stage'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (mode === 'game' && !overlay) openPause(); Snd.suspend(); }
    else { if (!overlay) Snd.resume(); if (mode === 'game') keepAwake(true); }
  });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  Snd.play(SONGS.menu);
  requestAnimationFrame((t) => { last = t; loop(t); });
}
// botón "atrás" de la app Android: pausa / vuelve / sale desde el menú
window.__androidBack = () => {
  if (mode === 'menu') return 'exit';
  if (overlay === 'pause') overlayAct('resume');
  else if (overlay === 'over') overlayAct('menu');
  else openPause();
  return 'ok';
};
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(() => boot());
else boot();
