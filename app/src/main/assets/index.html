<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15112a">
<script>window.__NATIVE_APP = true;</script>
<style>body{margin:0}</style>
<title>Pixel Arcade 3 en 1</title>
<style>
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/pixelify-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/silkscreen-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/silkscreen-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Jersey 10';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jersey-10-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Jersey 15';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jersey-15-latin-400-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: consola portátil — pantalla arriba y controles abajo (vertical), controles a los lados (horizontal), pantalla grande sola (escritorio) */
:root{
  --shell:#15112a;      /* carcasa */
  --shell-2:#211b3f;    /* paneles */
  --shell-3:#30285a;    /* bisel */
  --ink:#f4edff;        /* texto */
  --muted:#a196cf;      /* texto secundario */
  --pink:#ff4f9a;       /* acento A */
  --cyan:#4fe3ff;       /* acento B */
  --sun:#ffb347;        /* atardecer */
  --display:'Pixelify Sans','Trebuchet MS',monospace;
  --ui:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--shell)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--ui);
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(255,79,154,.10), transparent 60%),
    radial-gradient(90% 60% at 50% 100%, rgba(79,227,255,.08), transparent 60%),
    var(--shell);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 16px;position:relative}
#screen{position:relative;width:384px;height:216px;border-radius:8px;overflow:hidden;background:#05030c;
  --px:1px;
  box-shadow:0 0 0 3px #0a0716,0 0 0 7px var(--shell-3),0 0 0 9px #0a0716,0 0 48px -6px rgba(255,79,154,.45),0 0 90px -20px rgba(79,227,255,.35)}
#gl{display:block;width:100%;height:100%;image-rendering:pixelated}
.layer{position:absolute;inset:0}
/* ---------- HUD ---------- */
#hud{pointer-events:none;font-family:var(--ui);font-size:calc(var(--px)*7);line-height:1;letter-spacing:.04em;
  text-shadow:0 var(--px) 0 #000,var(--px) 0 0 #000,0 calc(var(--px)*-1) 0 #000,calc(var(--px)*-1) 0 0 #000}
.hrow{position:absolute;left:calc(var(--px)*6);right:calc(var(--px)*6);top:calc(var(--px)*5);display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--px)*6)}
.hcol{display:flex;flex-direction:column;gap:calc(var(--px)*3)}
.hlab{color:var(--muted);font-size:calc(var(--px)*5)}
.hval{font-variant-numeric:tabular-nums}
.hval.pink{color:var(--pink)}.hval.cyan{color:var(--cyan)}.hval.sun{color:var(--sun)}
.fuel{width:calc(var(--px)*54);height:calc(var(--px)*6);background:#0a0716;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #3a3260;position:relative}
.fuel i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4f6a,#ffb347 45%,#7dff7a);}
.fuel.low i{animation:blink .4s steps(2) infinite}
.lives{display:flex;gap:calc(var(--px)*2)}
.lives b{width:calc(var(--px)*6);height:calc(var(--px)*6);background:var(--cyan);box-shadow:0 0 0 var(--px) #000;clip-path:polygon(20% 0,80% 0,100% 30%,100% 100%,0 100%,0 30%)}
.lives.pinkl b{background:var(--pink);clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%)}
.wpn{display:inline-grid;place-items:center;width:calc(var(--px)*11);height:calc(var(--px)*11);background:#e23a43;color:#fff;box-shadow:0 0 0 var(--px) #000;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*8)}
#radar{position:absolute;right:calc(var(--px)*5);bottom:calc(var(--px)*5);width:calc(var(--px)*60);image-rendering:pixelated;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) rgba(79,227,255,.55);background:rgba(8,6,22,.7)}
.hbl{position:absolute;left:calc(var(--px)*6);bottom:calc(var(--px)*6);display:flex;gap:calc(var(--px)*4)}
.boss{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--px)*24);width:calc(var(--px)*120);display:flex;flex-direction:column;gap:calc(var(--px)*2);align-items:center}
.boss .bar{width:100%;height:calc(var(--px)*5);background:#0a0716;box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #5a1f3c}
.boss .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2d6f,#ff9a3c)}
.banner{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);text-align:center;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*16);color:var(--ink);letter-spacing:.06em;
  text-shadow:0 calc(var(--px)*2) 0 #000,0 0 calc(var(--px)*8) rgba(255,79,154,.8)}
.banner small{display:block;text-transform:uppercase;font-family:var(--ui);font-weight:400;font-size:calc(var(--px)*6);color:var(--cyan);margin-top:calc(var(--px)*5);text-shadow:0 var(--px) 0 #000}
@keyframes blink{50%{opacity:.25}}
/* ---------- Menú ---------- */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--px)*9);padding:calc(var(--px)*8)}
.logo{text-align:center;line-height:.9}
.logo .l1,.logo .l2{display:inline-block;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*26);letter-spacing:.02em}
.logo .l1{color:var(--pink);text-shadow:0 calc(var(--px)*2) 0 #3a0c24,0 0 calc(var(--px)*10) rgba(255,79,154,.75)}
.logo .l2{color:var(--cyan);text-shadow:0 calc(var(--px)*2) 0 #0b2a3a,0 0 calc(var(--px)*10) rgba(79,227,255,.7);margin-left:calc(var(--px)*6)}
.logo .sub{display:block;margin-top:calc(var(--px)*5);font-size:calc(var(--px)*6);letter-spacing:.3em;color:var(--sun);text-shadow:0 var(--px) 0 #000}
.carts{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--px)*7);width:100%;max-width:calc(var(--px)*300)}
.cart{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:calc(var(--px)*3);padding:calc(var(--px)*5) calc(var(--px)*4) calc(var(--px)*5);border:0;cursor:pointer;
  background:linear-gradient(#2c2552,#1d1838);color:var(--ink);font-family:var(--ui);font-size:calc(var(--px)*6);text-align:center;
  clip-path:polygon(0 calc(var(--px)*6),calc(var(--px)*6) 0,calc(100% - var(--px)*6) 0,100% calc(var(--px)*6),100% 100%,0 100%);
  box-shadow:inset 0 0 0 var(--px) #463c7c;transition:transform .12s steps(3)}
.cart canvas{width:100%;aspect-ratio:3/2;height:auto;image-rendering:pixelated;background:#0b0818;box-shadow:inset 0 0 0 var(--px) #000}
.cart .cn{font-weight:700;line-height:1.15;min-height:2.3em;display:grid;place-items:center}
.cart .cr{color:var(--muted);font-size:calc(var(--px)*5);font-variant-numeric:tabular-nums}
.cart.sel{transform:translateY(calc(var(--px)*-3));background:linear-gradient(#45306e,#291f4f);box-shadow:inset 0 0 0 var(--px) var(--pink),0 0 0 var(--px) var(--pink)}
.cart.sel .cn{color:var(--pink)}
.cart.locked canvas{filter:saturate(.5) brightness(.8)}
.cart:focus-visible{outline:calc(var(--px)*1) solid var(--cyan);outline-offset:var(--px)}
.mhint{font-size:calc(var(--px)*5.5);color:var(--ink);letter-spacing:.12em;text-align:center;background:rgba(12,8,28,.82);padding:calc(var(--px)*3) calc(var(--px)*7);box-shadow:0 0 0 var(--px) #463c7c}
.mhint b{color:var(--ink);font-weight:400}
.opts{display:flex;gap:calc(var(--px)*6)}
.chip{border:0;cursor:pointer;background:#1d1838;color:var(--muted);font-family:var(--ui);font-size:calc(var(--px)*5.5);padding:calc(var(--px)*3) calc(var(--px)*5);box-shadow:inset 0 0 0 var(--px) #463c7c}
.chip.on{color:var(--cyan);box-shadow:inset 0 0 0 var(--px) var(--cyan)}
.chip:focus-visible{outline:var(--px) solid var(--cyan)}
/* ---------- Paneles ---------- */
#overlay{display:grid;place-items:center;background:rgba(6,4,16,.55)}
.panel{min-width:calc(var(--px)*150);max-width:calc(100% - var(--px)*20);padding:calc(var(--px)*10) calc(var(--px)*12);background:rgba(18,13,38,.95);text-align:center;
  box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) var(--pink),0 0 0 calc(var(--px)*3) #000,0 0 calc(var(--px)*20) rgba(255,79,154,.35);display:flex;flex-direction:column;gap:calc(var(--px)*6);align-items:center}
.panel h2{margin:0;font-family:var(--display);font-weight:700;font-size:calc(var(--px)*15);color:var(--pink);letter-spacing:.04em;text-wrap:balance}
.panel p{margin:0;font-size:calc(var(--px)*6);color:var(--muted);line-height:1.5}
.panel .big{font-size:calc(var(--px)*10);color:var(--ink);font-variant-numeric:tabular-nums}
.mbtn{display:block;width:100%;border:0;cursor:pointer;background:#241d47;color:var(--ink);font-family:var(--ui);font-size:calc(var(--px)*7);padding:calc(var(--px)*4) calc(var(--px)*8);box-shadow:inset 0 0 0 var(--px) #463c7c}
.mbtn.sel{background:var(--pink);color:#1a0b1e;box-shadow:inset 0 0 0 var(--px) #fff}
.mbtn:focus-visible{outline:var(--px) solid var(--cyan)}
.tally{display:grid;grid-template-columns:auto auto;gap:calc(var(--px)*3) calc(var(--px)*10);font-size:calc(var(--px)*6);text-align:left;font-variant-numeric:tabular-nums}
.tally span:nth-child(odd){color:var(--muted)}
#toast{pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--px)*10)}
#screen:has(.hud-ui) #toast{align-items:flex-start;padding:calc(var(--px)*24) 0 0}
#toast span{background:rgba(18,13,38,.94);padding:calc(var(--px)*4) calc(var(--px)*7);font-size:calc(var(--px)*6);box-shadow:0 0 0 var(--px) var(--cyan)}
#rotate{position:absolute;left:0;right:0;bottom:calc(var(--px)*4);text-align:center;font-size:calc(var(--px)*5);color:var(--sun);pointer-events:none}
/* ---------- Controles táctiles ---------- */
#pad{display:none}
#keys{display:none;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;padding:0 16px 14px;line-height:1.8}
#keys kbd{font-family:var(--ui);color:var(--ink);background:var(--shell-2);padding:1px 6px;box-shadow:inset 0 0 0 1px #463c7c}
body:not(.touch) #keys{display:block}
body.touch #pad{display:grid}
.pl,.pr,.pm{display:flex;align-items:center;justify-content:center}
#dpad{position:relative;width:138px;height:138px;touch-action:none}
#dpad::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,#0e0b1e 55%,transparent 72%)}
#dpad .arm{position:absolute;background:linear-gradient(#3a3168,#272048);box-shadow:inset 0 0 0 2px #0b0818,0 4px 0 #0b0818}
#dpad .h{left:0;right:0;top:46px;height:46px;border-radius:8px}
#dpad .v{top:0;bottom:0;left:46px;width:46px;border-radius:8px}
#dpad .hub{position:absolute;left:46px;top:46px;width:46px;height:46px;background:#272048}
#dpad .hub::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#1a1533;box-shadow:inset 0 2px 0 #0b0818}
#dpad .tri{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.55}
#dpad .tu{left:62px;top:10px;border-bottom-color:var(--ink)}
#dpad .td{left:62px;bottom:10px;border-top-color:var(--ink)}
#dpad .tl{top:62px;left:10px;border-right-color:var(--ink)}
#dpad .tr{top:62px;right:10px;border-left-color:var(--ink)}
#dpad.u .tu,#dpad.d .td,#dpad.l .tl,#dpad.r .tr{opacity:1;filter:drop-shadow(0 0 4px var(--cyan))}
#dpad.u .tu{border-bottom-color:var(--cyan)}#dpad.d .td{border-top-color:var(--cyan)}#dpad.l .tl{border-right-color:var(--cyan)}#dpad.r .tr{border-left-color:var(--cyan)}
.abtns{position:relative;width:156px;height:132px}
.rb{position:absolute;width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;touch-action:none;font-family:var(--display);font-weight:700;font-size:24px;color:#1a0b1e;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 5px 0 #0b0818,0 0 0 3px #0b0818}
.rb small{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);font-family:var(--ui);font-weight:400;font-size:10px;color:var(--muted);white-space:nowrap;letter-spacing:.08em}
#btnA{right:0;top:4px;background:radial-gradient(circle at 35% 30%,#ff9cc6,var(--pink) 60%)}
#btnB{left:0;top:52px;background:radial-gradient(circle at 35% 30%,#b6f4ff,var(--cyan) 60%)}
.rb.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 2px 0 #0b0818,0 0 0 3px #0b0818,0 0 18px currentColor}
#btnA.on{color:#fff}#btnB.on{color:#fff}
.pm{gap:14px}
.pill{border:0;cursor:pointer;touch-action:none;font-family:var(--ui);font-size:10px;letter-spacing:.1em;color:var(--muted);background:#272048;padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 #0b0818,inset 0 0 0 2px #0b0818}
.pill.on{color:var(--ink);transform:translateY(2px);box-shadow:0 1px 0 #0b0818,inset 0 0 0 2px #0b0818}
#pad{--s:1}
.pl>*,.pr>*{transform:scale(var(--s))}
.pm{transform:scale(min(var(--s),1.1))}
/* vertical: pantalla de borde a borde con marco mínimo, controles debajo */
body.touch.portrait #stage{padding:0 0 4px;flex:0 0 auto}
body.touch.portrait #screen{border-radius:0;box-shadow:0 0 0 2px #000}
body.touch.portrait #pad{flex:1 1 auto;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;align-content:space-evenly;padding:0 16px 10px;align-items:center}
body.touch.portrait .pm{grid-column:1 / span 2;order:3}
/* horizontal: juego a pantalla completa con controles translúcidos encima */
body.touch.landscape{background:#000}
body.touch.landscape #stage{padding:0}
body.touch.landscape #screen{border-radius:0;box-shadow:none}
body.touch.landscape #pad{position:absolute;inset:0;pointer-events:none;z-index:5}
body.touch.landscape .pl,body.touch.landscape .pr,body.touch.landscape .pm{position:absolute;pointer-events:auto}
body.touch.landscape .pl{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));opacity:.6}
body.touch.landscape .pl>*{transform-origin:left bottom}
body.touch.landscape .pr{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.6}
body.touch.landscape .pr>*{transform-origin:right bottom}
body.touch.landscape .pm{left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.85);opacity:.5}
body.touch.landscape #dpad::before{background:radial-gradient(circle,rgba(14,11,30,.5) 55%,transparent 72%)}
body.touch.landscape .rb small{display:none}
body.ovl.inmenu #pad{display:none}
body.touch.landscape .pl:has(.u,.d,.l,.r),body.touch.landscape .pr:has(.on){opacity:.85}
/* el HUD inferior sube para no quedar bajo los controles */
body.ovl .hbl{bottom:auto;top:calc(var(--px)*26)}
body.ovl #radar{bottom:auto;top:calc(var(--px)*26)}
body.ovl #toast{align-items:flex-start;padding:calc(var(--px)*44) 0 0}

/* ---------- Garaje y mapa (Gas Rally) ---------- */
.hud-ui{pointer-events:auto}
.gtitle{position:absolute;left:calc(var(--px)*8);top:calc(var(--px)*6);font-family:var(--display);font-weight:700;font-size:calc(var(--px)*12);color:var(--cyan);letter-spacing:.06em;text-shadow:0 calc(var(--px)*2) 0 #000,0 0 calc(var(--px)*8) rgba(79,227,255,.7)}
.gpanel{position:absolute;display:flex;flex-direction:column;gap:calc(var(--px)*3);background:rgba(14,10,30,.88);padding:calc(var(--px)*5) calc(var(--px)*6);box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #463c7c;font-size:calc(var(--px)*5.5);text-shadow:none}
.gar.wide .gpanel{right:calc(var(--px)*8);top:calc(var(--px)*24);width:48%}
.gar.narrow .gpanel{left:calc(var(--px)*5);right:calc(var(--px)*5);bottom:calc(var(--px)*5)}
.gar.narrow .gtitle{font-size:calc(var(--px)*9)}
.grow{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--px)*4);padding:calc(var(--px)*2) calc(var(--px)*3);cursor:pointer}
.grow.sel{box-shadow:inset 0 0 0 var(--px) var(--pink);background:rgba(255,79,154,.08)}
.arr{flex:0 0 auto;border:0;cursor:pointer;background:#241d47;color:var(--ink);font-size:calc(var(--px)*6);width:calc(var(--px)*13);height:calc(var(--px)*13);box-shadow:inset 0 0 0 var(--px) #463c7c;font-family:var(--ui)}
.arr:focus-visible,.sw button:focus-visible,.gbtn:focus-visible{outline:var(--px) solid var(--cyan)}
.gname{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:var(--px)}
.gname b{font-family:var(--display);font-weight:700;font-size:calc(var(--px)*10);color:var(--pink);line-height:1;text-shadow:0 0 calc(var(--px)*6) rgba(255,79,154,.5)}
.gname small{font-size:calc(var(--px)*5);color:var(--muted);line-height:1.35;text-wrap:balance}
.gstats{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:calc(var(--px)*2) calc(var(--px)*4);align-items:center;font-size:calc(var(--px)*5);color:var(--muted);padding:0 calc(var(--px)*3)}
.bar5{display:flex;gap:var(--px)}
.bar5 i{width:calc(var(--px)*4);height:calc(var(--px)*3);background:#2e2654}
.bar5 i.on{background:var(--cyan);box-shadow:0 0 calc(var(--px)*2) rgba(79,227,255,.6)}
.glab{color:var(--muted);font-size:calc(var(--px)*5);display:flex;flex-direction:column;gap:var(--px)}
.glab em{font-style:normal;color:var(--ink);font-size:calc(var(--px)*5.5)}
.sw{display:flex;gap:calc(var(--px)*3)}
.sw button{width:calc(var(--px)*11);height:calc(var(--px)*11);border:0;cursor:pointer;box-shadow:inset 0 0 0 var(--px) #000}
.sw button.on{outline:var(--px) solid #fff;outline-offset:var(--px)}
.gbtn{border:0;cursor:pointer;background:var(--pink);color:#1a0b1e;font-family:var(--ui);font-weight:700;font-size:calc(var(--px)*6);padding:calc(var(--px)*4) calc(var(--px)*6)}
.gbtn.sel{box-shadow:0 0 0 var(--px) #fff,0 0 calc(var(--px)*8) rgba(255,79,154,.6)}
.gbtn:disabled{background:#3a3260;color:#8a84a8;cursor:not-allowed}
.wscore{position:absolute;right:calc(var(--px)*8);top:calc(var(--px)*8);display:flex;align-items:baseline;gap:calc(var(--px)*3);font-size:calc(var(--px)*6);text-shadow:0 var(--px) 0 #000}
.wpanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--px)*5);width:min(calc(var(--px)*210),calc(100% - var(--px)*10));display:flex;flex-direction:column;gap:calc(var(--px)*3);background:rgba(14,10,30,.88);padding:calc(var(--px)*4) calc(var(--px)*5);box-shadow:0 0 0 var(--px) #000,0 0 0 calc(var(--px)*2) #463c7c;text-align:center}
.wnav{display:flex;align-items:center;gap:calc(var(--px)*4)}
.wname{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--px)}
.wname b{font-family:var(--display);font-weight:700;font-size:calc(var(--px)*11);line-height:1;color:var(--ink);text-shadow:0 0 calc(var(--px)*6) rgba(255,79,154,.6)}
.wname small{font-size:calc(var(--px)*5);color:var(--cyan);line-height:1.3}
.flagimg{display:inline-block;height:0.8em;width:auto;image-rendering:pixelated;vertical-align:baseline;box-shadow:0 0 0 var(--px) #000;margin-right:0.15em}
.wst{font-size:calc(var(--px)*5);color:var(--sun)}
.wst.lock{color:#8a84a8}

/* ---------- Gas Rally · identidad de ruta ----------

   verde de autopista para la acción principal, azul de señal de servicios para lo secundario,
   rojo de bidón para alertas, letreros de mensaje ámbar para avisos y papel para los documentos
   (tarjeta de embarque y parte policial). Letra Jersey 10/15: pixel condensada, legible en chico.
   Escala (en pixeles del juego): 8 denso · 10 texto · 15 títulos · 20 destino y cifras · 30 cartel. */

  --asf:#25262d;--asf2:#31333c;--lin:#4d505c;--tiza:#ecebe3;--gris:#a4a5b1;
  --vial:#f2c12e;--ruta:#1f7a4e;--ruta-d:#0f4a2e;--serv:#2a5aa8;--serv-d:#173468;--bidon:#d93a2e;--led:#ffb21f;
  --t10:'Jersey 10','Pixelify Sans',monospace;--t15:'Jersey 15','Pixelify Sans',monospace;
  --f0:calc(var(--px)*8);--f1:calc(var(--px)*10);--f2:calc(var(--px)*15);--f3:calc(var(--px)*20);--f4:calc(var(--px)*30);
  box-shadow:0 0 0 3px #0c0c0f,0 0 0 7px #3a3b43,0 0 0 9px #0c0c0f,0 18px 40px -12px rgba(0,0,0,.7);
}

        return sat(s, 1.6) * Math.min(1, t / 0.015) * Math.min(1, (d - t) / 0.08) * (0.8 + 0.2 * Math.sin(TAU * 31 * t + c.r()));
      }, gain);
    };

    c.horn = (t0, d, fa, fb, gain = 1) => {
      const f1 = svf(), f2 = svf(); let p = 0, q = 0;
      c.layer(t0, d + 0.06, (t) => {
        p += fa * (1 + 0.004 * Math.sin(TAU * 6 * t)) / sr; q += fb / sr;
        const s = (2 * (p % 1) - 1) + (2 * (q % 1) - 1);
        const e = t < d ? Math.min(1, t / 0.012) : Math.exp(-(t - d) / 0.02);
        return f2(f1(sat(s, 2.4), 950, 0.8, sr, BP), 3200, 0.7, sr, LP) * e;
      }, gain);
    };
    return c;
  }
  // normaliza al pico pedido y suaviza el final
  function finish(c, peak) {
    const o = c.out; let m = 0;
    for (let i = 0; i < o.length; i++) { const a = Math.abs(o[i]); if (a > m) m = a; }
    const k = m > 0 ? peak / m : 0, fade = Math.min(o.length, Math.floor(c.sr * 0.01));
    for (let i = 0; i < o.length; i++) o[i] *= k;
    for (let i = 0; i < fade; i++) o[o.length - 1 - i] *= i / fade;
    return o;
  }

    for (let k = 0; k < n; k++) {
      const a = r() * 6.283, d = rad * (0.55 + r() * 0.45);
      disc(g, cx + Math.cos(a) * d, cy + Math.sin(a) * d, br * (0.7 + r() * 0.5), col);
    }
  };
  let f = mk(S, S); disc(f.g, cx, cy, 5, '#ffe45c'); disc(f.g, cx, cy, 3.5, '#ffffff'); out.push(f.c);
  f = mk(S, S); disc(f.g, cx, cy, 9.5, '#ff9a2e'); blobs(f.g, 5, 8, 3.5, '#ff9a2e'); disc(f.g, cx, cy, 7, '#ffe45c'); disc(f.g, cx - 1, cy - 1, 4, '#ffffff'); out.push(f.c);
  f = mk(S, S); disc(f.g, cx, cy, 12, '#e8452c'); blobs(f.g, 7, 11, 4, '#e8452c'); disc(f.g, cx, cy - 1, 9.5, '#ff9a2e'); blobs(f.g, 4, 7, 3, '#ff9a2e'); disc(f.g, cx - 1, cy - 2, 5.5, '#ffe45c'); disc(f.g, cx - 2, cy - 3, 2.5, '#fff7d0'); out.push(f.c);
  f = mk(S, S); disc(f.g, cx, cy, 13.5, '#7a2a3a'); blobs(f.g, 7, 12, 4.5, '#7a2a3a'); disc(f.g, cx, cy - 1, 11, '#d23a2a'); disc(f.g, cx, cy - 2, 7, '#ff8a2a'); disc(f.g, cx - 1, cy - 3, 3, '#ffd84a'); out.push(f.c);
  f = mk(S, S); disc(f.g, cx, cy - 1, 13.5, '#4e3a5a'); blobs(f.g, 7, 12, 4.5, '#4e3a5a'); disc(f.g, cx, cy - 2, 9, '#6a4a62'); disc(f.g, cx, cy - 3, 5, '#a8402e'); ditherOut(f.c, 0.2); out.push(f.c);
  f = mk(S, S); disc(f.g, cx, cy - 2, 13, '#3e3250'); blobs(f.g, 6, 12, 4, '#3e3250'); disc(f.g, cx, cy - 3, 8, '#54436a'); ditherOut(f.c, 0.5, 1, 0); out.push(f.c);

  return out;
}

    if (!d[i + 3]) return;

    if (k < 0) return;

    } else if (P.fx === 'galaxy') {

      col = q < 0.1 ? '#ffffff' : q < 0.18 ? '#ff9ae0' : ((x * 3 + y * 5) % 11) < 2 ? '#3a2a8a' : null;

  const { c, g } = mk(14, 14);
  g.translate(1, 1);
  if (kind === 'nitro') {
    R(g, '#8d93a3', 5, 0, 2, 2); R(g, '#d6dae4', 5, 0, 1, 1);
    R(g, '#2f6ff2', 3, 2, 6, 7); R(g, '#7fb0ff', 3, 2, 1, 7); R(g, '#1c44a6', 8, 2, 1, 7);
    R(g, '#ffffff', 5, 4, 2, 1); R(g, '#ffffff', 5, 6, 2, 1);
    R(g, '#ffe14a', 4, 9, 4, 1); R(g, '#ff8a1e', 4, 10, 4, 1); R(g, '#ff8a1e', 5, 11, 2, 1);
  } else if (kind === 'iman') {
    R(g, '#e8383d', 1, 1, 3, 7); R(g, '#e8383d', 8, 1, 3, 7); R(g, '#e8383d', 2, 8, 8, 3); R(g, '#9e1d2b', 4, 7, 4, 2);
    R(g, '#ff8a7a', 1, 1, 1, 7); R(g, '#d6dae4', 1, 0, 3, 2); R(g, '#d6dae4', 8, 0, 3, 2);
  } else if (kind === 'escudo') {
    poly(g, [[1, 1], [11, 1], [11, 6], [6, 11], [1, 6]], '#2fa8d8');
    poly(g, [[3, 2], [9, 2], [9, 6], [6, 9], [3, 6]], '#5ff2ff');
    R(g, '#ffffff', 4, 3, 2, 3); R(g, '#1c6a8a', 6, 2, 1, 7);
  } else if (kind === 'aceite') {
    disc(g, 6, 7, 4, '#1b1a26'); poly(g, [[6, 0], [9, 6], [3, 6]], '#1b1a26');
    R(g, '#7a5ac8', 4, 6, 1, 2); R(g, '#4fe3ff', 5, 9, 2, 1); R(g, '#ffffff', 4, 5);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  return outline(c);
}
// anillo del escudo (blanco, se tiñe)
function shieldCanvas() {
  const { c, g } = mk(28, 28);
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
    const d = Math.hypot(x + 0.5 - 14, y + 0.5 - 14);
    if (d > 12.4 && d < 13.6) R(g, '#ffffff', x, y);
    else if (d > 10 && d <= 12.4 && bayer(x, y) < 0.3) R(g, 'rgba(255,255,255,0.6)', x, y);
  }
  return c;
}
// helicóptero policial visto desde arriba (sin aspas; las aspas van aparte y giran)
function heliCanvas() {
  const { c, g } = mk(22, 34);
  g.translate(1, 1);
  R(g, '#1b1a26', 9, 18, 2, 12); R(g, '#3a3a4c', 9, 18, 1, 12);
  R(g, '#1b1a26', 5, 28, 10, 2); R(g, '#e8383d', 5, 28, 2, 2); R(g, '#e8383d', 13, 28, 2, 2);
  ellipse(g, 10, 11, 6, 9, '#2a2a3c'); ellipse(g, 9.5, 10.5, 5, 8, '#e8e6f0'); R(g, '#2a2a3c', 4, 12, 13, 2);
  ellipse(g, 10, 5, 3.6, 3, '#4fa8e8'); R(g, '#b8e8ff', 8, 3, 2, 1);
  R(g, '#5a596f', 2, 6, 1, 12); R(g, '#5a596f', 17, 6, 1, 12);
  R(g, '#ff3b5c', 7, 15, 2, 1); R(g, '#3b8cff', 11, 15, 2, 1);
  g.setTransform(1, 0, 0, 1, 0, 0);
  return outline(c);
}
function rotorCanvas() {
  const { c, g } = mk(40, 40);
  g.globalAlpha = 0.85;
  line(g, 3, 20, 37, 20, '#c8c4d8', 2); line(g, 20, 3, 20, 37, '#c8c4d8', 2);
  g.globalAlpha = 1;
  disc(g, 20, 20, 2.2, '#3a3a4c');
  return c;
}
// foco del helicóptero sobre el suelo (blanco, se dibuja con mezcla aditiva)
function spotCanvas(r) {
  const { c, g } = mk(r * 2 + 2, r * 2 + 2);
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const d = Math.hypot(x + 0.5 - r - 1, y + 0.5 - r - 1) / r;
    if (d > 1) continue;
    const a = d > 0.9 ? 0.5 : d > 0.7 ? (bayer(x, y) < 0.6 ? 0.32 : 0.2) : 0.26;
    g.fillStyle = `rgba(255,250,215,${a})`; g.fillRect(x, y, 1, 1);
  }
  return c;
}
// meta de la persecución: bandera a cuadros sobre la calle
function goalCanvas(f) {
  const { c, g } = mk(16, 26);
  ellipse(g, 6, 24, 5, 1.6, 'rgba(0,0,0,0.35)');
  R(g, '#d6d6e4', 2, 2, 1, 22);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 11; x++) {
    const w = Math.round(Math.sin(x * 0.7 + f * 1.6) * 0.8);
    R(g, ((x >> 1) + (y >> 1)) & 1 ? '#1b1a26' : '#ffffff', 3 + x, 2 + y + w);
  }
  disc(g, 2.5, 1.5, 1.4, '#ffd23f');
  return outline(c);
}
// flecha de borde de pantalla (blanca, se tiñe); apunta hacia arriba

  return outline(c, '#000000');
}

// =====================================================================
//  GAS RALLY · dibujo de lugares especiales de cada ciudad y del entorno
//  (estadios, puerto, mercado, autocine, templo, puente, cerros alrededor)
//  Todo se pinta sobre la textura del mapa en coordenadas de pixel.
// =====================================================================
const RM = (() => {
  // mayor rectángulo de casillas dentro de una región (para ubicar un lugar grande)
  function largestRect(tiles) {
    const set = new Set(tiles.map(([x, y]) => x + ',' + y));
    let best = null;
    const xs = tiles.map((t) => t[0]), ys = tiles.map((t) => t[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (!set.has(x + ',' + y)) continue;
      for (let h = 1; y + h - 1 <= y1; h++) {
        let w = 0;
        while (x + w <= x1) {
          let ok = true;
          for (let j = 0; j < h && ok; j++) ok = set.has(x + w + ',' + (y + j));
          if (!ok) break;
          w++;
        }
        if (!w) break;
        const a = w * h + Math.min(w, h) * 0.5;
        if (!best || a > best.a) best = { x, y, w, h, a };
      }
    }
    return best;
  }

  // ---- estadio visto desde arriba: tribunas con público, cancha y torres de luz
  function stadium(g, X, Y, W, H, r, dome) {
    const cx = X + W / 2, cy = Y + H / 2, rx = W / 2, ry = H / 2;
    ellipse(g, cx + 2, cy + 3, rx, ry, 'rgba(10,8,24,0.35)');
    if (dome) {
      // domo blanco con nervaduras
      ellipse(g, cx, cy, rx, ry, '#b8bccb');
      ellipse(g, cx - 1, cy - 1, rx - 2, ry - 2, '#e6e8f0');
      for (let k = -3; k <= 3; k++) {
        const t = k / 4;
        for (let a = -1; a <= 1; a += 0.02) {
          const px = cx + t * rx * Math.sqrt(Math.max(0, 1 - a * a)) * 0.98, py = cy + a * (ry - 2);
          R(g, '#c4c8d6', px, py);
        }
      }
      ellipse(g, cx - rx * 0.3, cy - ry * 0.35, rx * 0.25, ry * 0.18, '#ffffff');
      return [[X + 3, Y + 3], [X + W - 3, Y + 3], [X + 3, Y + H - 3], [X + W - 3, Y + H - 3]];
    }
    ellipse(g, cx, cy, rx, ry, '#5a5468');
    // público: puntitos de colores por anillos
    const crowd = ['#ff4f9a', '#ffd23f', '#4fe3ff', '#f2f2f2', '#7dff7a', '#ff8a1e', '#b48cff'];
    for (let y = Math.floor(Y); y < Y + H; y++) for (let x = Math.floor(X); x < X + W; x++) {
      const d = ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2;
      if (d > 1) continue;
      if (d > 0.42) { if ((x + y) % 2 === 0 && r() < 0.75) R(g, crowd[(r() * crowd.length) | 0], x, y); else R(g, d > 0.8 ? '#4a4458' : '#6a6480', x, y); }
    }
    // cancha
    const fx = rx * 0.62, fy = ry * 0.6;
    R(g, '#3f9a4a', cx - fx, cy - fy, fx * 2, fy * 2);
    for (let i = 0; i < fx * 2; i += 6) R(g, '#4aae56', cx - fx + i, cy - fy, 3, fy * 2);
    g.strokeStyle = '#e8f8e8'; g.lineWidth = 1;
    g.strokeRect(Math.round(cx - fx) + 1.5, Math.round(cy - fy) + 1.5, Math.round(fx * 2) - 3, Math.round(fy * 2) - 3);
    R(g, '#e8f8e8', cx, cy - fy + 1, 1, fy * 2 - 2);

  // ---- entorno fuera del mapa (se ve en los bordes): cerros, cordillera, agua, volcanes

      else if (b === 'hills') { if (r() < 0.45) list.push([px, py, 7 + r() * 6, false, dry]); }
      else if (r() < 0.6) list.push([px, py, 5, false, null]);

    list.sort((a, b2) => a[1] - b2[1] || a[0] - b2[0]);

  // ---------------- dibujo de los mapas

      let border = false;

      while (st.length) {
        const [a, b] = st.pop();
        tiles.push([a, b]);
        if (a === 0 || b === 0 || a === MW - 1 || b === MH - 1) border = true;
        for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {

  // ===== ARENA DE ACROBACIAS: tierra, tribunas llenas y montículos

      if (n.U && n.D && !n.L && !n.R) for (let i = 0; i < 16; i += 2) { R(g, '#9a6a3c', px + 4, py + i, 1, 1); R(g, '#9a6a3c', px + 11, py + i + 1, 1, 1); }

  // ===== PUEBLO NEVADO
  function snowMap(g, ctx) {
    const { isRoad, MW, MH, TS, SK, r } = ctx, MWp = MW * TS, MHp = MH * TS, spots = [];

    R(g, '#e6ecf6', -SK, -SK, MWp + SK * 2, MHp + SK * 2);

    const pine = (x, y, s) => {
      ellipse(g, x + 2, y + 2, s, s * 0.8, 'rgba(40,50,90,0.3)');
      disc(g, x, y, s, '#1f5a3b'); disc(g, x - 0.5, y - 0.5, s * 0.72, '#2c7a4a'); disc(g, x - 1, y - 1, s * 0.4, '#3f9a5a');

      if (py < 0 && depth > 0.3) list.push(['m', px, py, 14 + depth * 14 + r() * 4, Math.min(1, 0.4 + depth)]);
      else if (r() < 0.75) list.push(['p', px, py, 4 + r() * 3]);

  function worldCanvas() {
    const { w, h, latTop, latBot } = WORLD;
    const raw = atob(WORLD.bits);
    const land = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) land[i] = (raw.charCodeAt(i >> 3) >> (i & 7)) & 1;
    const L = (x, y) => x >= 0 && y >= 0 && x < w && y < h && land[y * w + x] === 1;
    const { c, g } = mk(w, h);
    const im = g.createImageData(c.width, c.height), d = im.data;
    // zonas áridas como manchas elípticas (lon, lat, radio lon, radio lat)
    const DESERT = [[10, 23, 24, 7], [47, 23, 10, 6], [133, -25, 13, 6], [102, 43, 13, 4], [20, -24, 6, 4], [-70, -23, 1.6, 7], [-112, 33, 7, 4], [62, 30, 9, 5], [-66, -40, 3, 6]];
    const arid = (lon, lat) => DESERT.reduce((m, [a, b, ra, rb]) => Math.max(m, Math.exp(-(((lon - a) / ra) ** 2 + ((lat - b) / rb) ** 2))), 0);
    const PAL = {
      snow: ['#dfe8f2', '#ffffff', '#a8b8cc'], desert: ['#d6b26a', '#f0d090', '#a8843e'],
      jungle: ['#2f9a54', '#5ac078', '#1c6a38'], temp: ['#4fae64', '#7fd88a', '#2f7a46'],
    };
    const latLines = [60, 30, 0, -30].map((lt) => Math.round(((latTop - lt) / (latTop - latBot)) * h));
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const lat = latTop - ((y + 0.5) / h) * (latTop - latBot), lon = ((x + 0.5) / w) * 360 - 180;
      let col;
      if (L(x, y)) {
        const dz = (bayer(x, y) - 0.5);
        const p = Math.abs(lat) + dz * 6 > 63 || (lat + dz * 4 > 60 && lon > -75 && lon < -12) ? PAL.snow
          : arid(lon, lat) > 0.45 + dz * 0.35 ? PAL.desert
          : Math.abs(lat) + dz * 5 < 16 ? PAL.jungle : PAL.temp;
        col = !L(x, y - 1) || !L(x - 1, y) ? p[1] : !L(x, y + 1) || !L(x + 1, y) ? p[2] : bayer(x, y) < 0.1 ? p[2] : p[0];
      } else if (L(x + 1, y) || L(x - 1, y) || L(x, y + 1) || L(x, y - 1)) col = '#2c4a8c';
      else if (x % 40 === 0 || latLines.includes(y)) col = (x + y) % 2 ? '#22306a' : '#1a2452';
      else col = bayer(x, y) < 0.07 ? '#1a2452' : '#141c44';
      const [rr, gg, bb] = rgb(col), i = (y * c.width + x) * 4;

    return c;
  }

  // cruce peatonal "scramble" de Tokio: 7 s pasan autos, 4,6 s cruzan peatones en todas direcciones

    if (!X) return;
    const x0 = X.ix * TS, y0 = X.iy * TS;

    X.walk = false; X.t = 3.5;
    const lp = [[x0 - 3, y0 - 9], [x0 + 35, y0 - 9], [x0 + 35, y0 + 31], [x0 - 3, y0 + 31]];

      p.home = i % 4; p.walking = false; p.ox = 0; p.oy = 0; p.delay = 0;

  function updateCross(dt) {
    const X = S.cross;
    if (!X) return;
    if ((X.t -= dt) <= 0) {
      X.walk = !X.walk; X.t = X.walk ? 4.6 : 7;
      lights.forEach((l) => l.set(A.light[X.walk ? 0 : 1]));
      if (X.walk) {
        if (Math.hypot(player.x - (X.ix * TS + 16), player.y - (X.iy * TS + 16)) < 220) Snd.sfx('whistle');
        for (const p of peds) {
          const to = (p.home + 1 + ((Math.random() * 3) | 0)) % 4;
          const [tx, ty] = X.corners[to];
          p.tx = tx + rand(-4, 4); p.ty = ty + rand(-4, 4);
          p.delay = rand(0, 0.7);
          p.spd = Math.hypot(p.tx - p.x, p.ty - p.y) / rand(2.8, 3.7);
          p.walking = true; p.home = to;
        }
      }
    }
    const movers = [player, ...enemies.filter((e) => e.active), ...civs.filter((c) => c.active)];
    if (rival && rival.active) movers.push(rival);
    for (const p of peds) {
      if (p.walking && (p.delay -= dt) <= 0) {
        const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), st = p.spd * dt;
        if (d <= st) { p.x = p.tx; p.y = p.ty; p.walking = false; } else { p.x += (dx / d) * st; p.y += (dy / d) * st; }
      }

      p.oy = clamp(p.oy * (1 - dt * 2.5) + fy * dt * 80, -10, 10);
    }

  function updateEscape(dt) {

      const lead = h === heli ? 24 : 70, k = h === heli ? 1 : 0.9;
      const dx = p.vx + fx * lead - h.x, dy = p.vy + fy * lead - h.y, d = Math.hypot(dx, dy);
      const sp = (66 + lvl() * 1.5) * [0.9, 1, 1.08, 1.12][diff()] * k * dt;
      if (d > 1) {
        h.x += (dx / d) * Math.min(d, sp); h.y += (dy / d) * Math.min(d, sp);
        h.ang += wrapA(-(Math.atan2(dy, dx) + Math.PI / 2) - h.ang) * 0.06;
      }
      if (Math.hypot(p.vx - h.x, p.vy - h.y) < 26) S.spotted = true;

    if (S.spotted && !was) { UI.vibrate(30); Snd.sfx('spot'); S.everSpotted = true; }

  function snowPuff(x, y) { parts.burst(x, y, 14, 60, 0.6, 0xffffff, 0xc8d4ea, 2, 1, 0, 3); }
  // montículos, quitanieves y avalanchas
  function updateSnow(dt) {
    const p = player;
    for (const d of S.driftList) {
      if (!d.on) {
        if ((d.back -= dt) <= 0) {
          for (let k = 0; k < 40; k++) {
            const [x, y] = S.roadTiles[(Math.random() * S.roadTiles.length) | 0], i = y * MW + x;
            if (rockAt[i] || S.ice[i] || distA[i] < 6 || distA[i] >= 9999) continue;

  function retargetRival() {

    for (const c of cans) {
      if (c.got) continue;
      const d = dOf(c);
      if (d < bd) { bd = d; best = c; }
    }
    // histéresis: solo cambia de bidón si el nuevo está claramente más cerca
    if (rv.target && !rv.target.got && best !== rv.target && dOf(rv.target) <= bd + 3) best = rv.target;
    if (best && (best !== rv.target || rv.dirty)) {
      bfs(distC, Math.floor(best.x / TS), Math.floor(best.y / TS));
      // nuevo objetivo a sus espaldas: vuelta en U inmediata
      const tx = Math.floor(rv.x / TS), ty = Math.floor(rv.y / TS), d = rv.dir;
      const at = (x, y) => (openE(x, y) ? distC[y * MW + x] : 9999);
      if (at(tx - DX[d], ty - DY[d]) + 1 < at(tx + DX[d], ty + DY[d])) { rv.dir = (d + 2) % 4; rv.plan = null; rv.tile = -1; }

  // flechas en el borde: bidón más cercano (o la meta), patrullas que vienen, rival

    arrows.forEach((a, i) => {
      const it = list[i];
      if (!it || (it[3] && Math.floor(T0 * 8) % 2)) { a.show(false); return; }
      // el rectángulo útil deja libre el marcador de arriba
      const dx = it[0] - mx, dy = it[1] - my, top = 30, bot = 14, side = 10;
      const cy0 = my + (top - bot) / 2, hh = H / 2 - (top + bot) / 2;
      const dy2 = it[1] - cy0;
      const k = Math.min((W / 2 - side) / Math.max(1e-3, Math.abs(dx)), hh / Math.max(1e-3, Math.abs(dy2)));
      a.show(true).tint(it[2]).at(mx + dx * k, cy0 + dy2 * k).rot(-(Math.atan2(dy2, dx) + Math.PI / 2));
    });
  }
  function drawRadar(t, cx, cy) {
    if (!rctx) return;
    const g = rctx, RW = MW * 2, RH = MH * 2;
    g.clearRect(0, 0, RW, RH);
    if (S.radarBg) g.drawImage(S.radarBg, 0, 0);
    g.fillStyle = 'rgba(79,227,255,0.05)';
    for (let x = 0; x < RW; x += 8) g.fillRect(x, 0, 1, RH);
    for (let y = 0; y < RH; y += 8) g.fillRect(0, y, RW, 1);
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 1;
    g.strokeRect(Math.round(cx / 8) + 0.5, Math.round(cy / 8) + 0.5, Math.round(Engine.W / 8), Math.round(H / 8));
    const blink = Math.floor(t * 4) & 1, dot = (x, y, s = 2) => g.fillRect(Math.floor(x / 8) - (s >> 1), Math.floor(y / 8) - (s >> 1), s, s);
    for (const c of cans) {
      if (c.got || (c.kind === 'S' && blink)) continue;
      g.fillStyle = c.kind === 'S' ? '#fff09a' : c.kind === 'L' ? '#7dff7a' : '#ffd23f';
      dot(c.x, c.y);
    }
    g.fillStyle = '#b48cff';
    for (const b of boxes) if (b.on) dot(b.x, b.y);
    for (const e of enemies) {
      if (!e.active) continue;
      if (e.icp) { if (blink) continue; g.fillStyle = '#e07bff'; dot(e.x, e.y, 3); continue; }
      g.fillStyle = '#ff4a5a'; dot(e.x, e.y);
    }
    if (rival.active && rival.dead <= 0) { g.fillStyle = '#ffb347'; dot(rival.x, rival.y, 3); }
    g.fillStyle = blink ? '#ffffff' : '#4fe3ff';
    dot(player.x, player.y, 3);
  }

  const achGot = () => Store.get('rally_ach', {});
  function ach(id) {
    const got = achGot();

    got[id] = Date.now(); Store.set('rally_ach', got);

    else { UI.toast(`★ LOGRO: ${a[1]}`); S.achT = 1.9; }

  function trackAchievements(mask) {

    if (c.id === 'cuarto') ach('toy');
    if (S.city === 0) ach('city1');
    if (S.city < NC && mask === 7) ach('stars');
    if (S.city < NC && CITIES.every((q) => starsOf(q.id) === 7)) ach('allstars');
    if (S.cityDeaths === 0 && S.trk !== 'arena') ach('clean');

  function checkMisc() {

  // ---------- titán: silueta gigante a media distancia, mira a la izquierda
  // f = cuadro de caminata 0..3; atk = brazo-cañón levantado
  function titan(f, atk) {

    // pelvis y cintura
    R(g, D, ox - 20, 84 + bob, 40, 12); R(g, M, ox - 20, 84 + bob, 40, 2);
    // torso trapezoidal con placas

    poly(g, [[ox - 30, 38 + bob], [ox - 22, 38 + bob], [ox - 16, 88 + bob], [ox - 22, 88 + bob]], L);

    R(g, K, ox - 15, 27 + bob, 22, 5); R(g, EYE, ox - 14, 28 + bob, 18, 2); R(g, '#ffd0da', ox - 13, 28 + bob, 4, 1);

  // rayo del cañón (aditivo)
  function beam() {

  // ---------------- física de plataformas
  function landOn(x, y0, y1, skip) {
    let best = null;
    for (const p of plats) {
      if (p === skip || x < p.x0 - 3 || x > p.x1 + 3) continue;
      if (y0 <= p.y + 0.5 && y1 >= p.y && (!best || p.y < best.y)) best = p;
    }
    return best;
  }
  function supportAt(x, y) {
    for (const p of plats) if (x >= p.x0 - 3 && x <= p.x1 + 3 && Math.abs(p.y - y) < 1) return p;
    return null;
  }
  const hit = (a, b) => a[0] < b[0] + b[2] && a[0] + a[2] > b[0] && a[1] < b[1] + b[3] && a[1] + a[3] > b[1];

  // ---- tanque enemigo Magnus Mk II: entra rompiendo un muro; la cámara se queda fija hasta destruirlo

  // ---------------- habilidades: granada, barrera e impulso (se abren al cumplir la misión 1)
  function useAbility(dt) {
    const ab = S.ab, p = player;
    if (!ab) return;

    if (!Input.pressed.c || ab.cd > 0 || p.dead) return;
    const L = ABIL[ab.k], lv = clamp(ab.lvl, 1, 3);
    ab.cd = L.cd[lv - 1];
    if (ab.k === 'gren') {
      const up = Input.held.up;
      throwGrenade(p.face * (up ? 70 : 140), up ? -300 : -210);
      if (lv >= 3) throwGrenade(p.face * (up ? 120 : 200), up ? -260 : -170);
      Snd.sfx('throw');
    } else if (ab.k === 'wall') {
      p.barrier = Math.max(p.barrier, L.dur[lv - 1]);
      Snd.sfx('barrier'); parts.burst(p.x, p.y - 16, 14, 80, 0.4, 0xffe27a, 0xffffff, 2, 1);
    } else if (ab.k === 'dash') {

  function dashTrail() {

    }
  }
  function throwGrenade(vx, vy) {
    const q = grens.find((o) => !o.on), p = player;
    if (!q) return;
    Object.assign(q, { on: true, kind: 'gren', x: p.x + p.face * 6, y: p.y - 26, vx, vy, t: 0, g: 620 });

  function grenBoom(x, y, dmg = 6, rad = 0) {
    const lv = S.ab ? S.ab.lvl : 1, R2 = rad || (lv >= 2 ? 36 : 30);
    boomAt(x, y); boomAt(x - 10, y + 2, true); boomAt(x + 10, y + 2, true);
    Snd.sfx('gboom'); shake(3, 0.25); UI.vibrate(40);
    for (const e of ents) {
      if (e.dead || e.type === 'capsule') continue;
      const bx = entBox(e), cx = bx[0] + bx[2] / 2, cy = bx[1] + bx[3] / 2;
      if (Math.hypot(cx - x, cy - y) < R2 + bx[2] / 2) { e.hp -= dmg; e.flashT = 0.08; if (e.hp <= 0) killEnt(e); }
    }
    for (const m of ebs) if (m.on && (m.kind === 'missile' || m.kind === 'bomb') && Math.hypot(m.x - x, m.y - y) < R2 + 6) { m.on = false; m.spr.show(false); }
    if (boss.on && boss.st === 'fight') { const b = bossBox(); if (x > b[0] - R2 && x < b[0] + b[2] + R2 && y > b[1] - R2 && y < b[1] + b[3] + R2) damageBoss(dmg); }
    if (S.tb && S.tb.st === 'fight') hitTitan([x - R2, y - R2, R2 * 2, R2 * 2], dmg, true);
  }
  function updateGrens(dt) {
    for (const q of grens) {
      if (!q.on) continue;
      q.t += dt;
      const y0 = q.y;
      q.vy = Math.min(q.vy + (q.g || 620) * dt, 380); q.x += q.vx * dt; q.y += q.vy * dt;
      q.spr.at(q.x, q.y).rot(q.kind === 'shell' ? -Math.atan2(q.vy, q.vx) : q.t * 14 * Math.sign(q.vx || 1));
      if (q.kind === 'shell' && Math.random() < 0.7) parts.emit(q.x - Math.sign(q.vx) * 4, q.y, 0, rand(-8, 8), 0.25, 0xffe066, 0x5a4a6a, 2, 1);
      if (q.kind === 'shell' && (q.x > S.camX + Engine.W + 20 || q.x < S.camX - 20)) { q.on = false; q.spr.show(false); continue; }
      let pop = q.t > 2.2 || q.y > H + 10;
      if (!pop && q.vy > 0 && landOn(q.x, y0, q.y, null)) pop = true;
      if (!pop) for (const e of ents) if (!e.dead && e.type !== 'capsule' && hit([q.x - 3, q.y - 3, 6, 6], entBox(e))) { pop = true; break; }
      if (!pop && boss.on && boss.st === 'fight' && hit([q.x - 3, q.y - 3, 6, 6], bossBox())) pop = true;
      if (!pop && S.tb && S.tb.st === 'fight' && hit([q.x - 3, q.y - 3, 6, 6], titanBody(S.tb))) pop = true;
      if (pop) { q.on = false; q.spr.show(false); if (q.y < H + 5) grenBoom(q.x, q.y - 4, q.kind === 'shell' ? 5 : 6, q.kind === 'shell' ? 24 : 0); }
    }
  }

  // ---------------- cuartel: elegir personaje, mejorar arma y habilidad, cambiar traje

  function pickChar(i) { S.ci = (i + CFX.CHARS.length) % CFX.CHARS.length; if (!suitOwned(S.si)) S.si = 0; Snd.sfx('move'); renderBarracks(); }

  // ---------------- fondo vivo: el titán derriba un edificio y se pierde en la niebla; bombardeos a lo lejos
  function updateBg(dt) {
    const B = BG;

  // ---------------- ciclo principal

    if (Math.random() < dt * 6) parts.emit(S.camX + rand(0, W), H + 2, rand(-8, 8), rand(-38, -16), rand(2, 4), 0xffb347, 0x6a2a4a, 1, 1, -4, 0.2);

function settingsChange(act, d, level) {

  else if (act === 's_pad') { Settings.pad = (Settings.pad + d + 3) % 3; Store.set('padsize', Settings.pad); layout(); }
  else if (act === 's_crt') { Engine.crt = !Engine.crt; Store.set('crt', Engine.crt); }
  else if (act === 's_diff') { const n = Store.get('rally_done', 0) ? 4 : 3; Store.set('rally_diff', (Math.min(Store.get('rally_diff', 1), n - 1) + d + n) % n); }
  else if (act === 's_free') {
    const on = !Store.get('rally_free', false);
    Store.set('rally_free', on);
    UI.toast(on ? 'GAS RALLY: TODAS LAS CIUDADES Y RONDAS ABIERTAS' : 'MODO PRUEBA APAGADO');
  }
  else if (act !== '') return;
  Snd.setVol(Settings.musV, Settings.sfxV);
  Snd.sfx('select');
  const keep = osel;
  openOverlay('settings', settingsHtml());
  bindVolume();
  osel = keep; markOverlay();
}
function closeSettings() {
  if (settingsFrom === 'pause') openPause();
  else { closeOverlay(); refreshMenu(); }
}
function overlayAct(act) {
  Snd.unlock(); Snd.resume();
  if (act.startsWith('s_')) { if (act === 's_back') closeSettings(); else settingsChange(act, 1); return; }
  if (act === 'settings') { openSettings(mode === 'menu' ? 'menu' : 'pause'); return; }
  if (act === 'resume') { closeOverlay(); Snd.sfx('select'); }
  else if (act === 'restart' || act === 'retry') { closeOverlay(); Snd.sfx('start'); if (game.retry) game.retry(); else { game.exit(); game.start(); } }
  else if (act === 'menu') { closeOverlay(); toMenu(); }
  else { closeOverlay(); Snd.sfx('select'); if (game.action) game.action(act); }
}
function overlayStep() {
  const btns = $('#overlay').querySelectorAll('.mbtn');
  if (overlay === 'settings') {
    const act = btns[osel] && btns[osel].dataset.act;
    if (Input.pressed.left && act !== 's_back') settingsChange(act, -1);
    if (Input.pressed.right && act !== 's_back') settingsChange(act, 1);
    if (Input.pressed.b || Input.pressed.select || Input.pressed.start) { closeSettings(); return; }
  }
  if (Input.pressed.up) { osel = (osel + btns.length - 1) % btns.length; markOverlay(); Snd.sfx('move'); }
  if (Input.pressed.down) { osel = (osel + 1) % btns.length; markOverlay(); Snd.sfx('move'); }
  if (Input.pressed.a || (Input.pressed.start && overlay === 'over')) overlayAct(btns[osel].dataset.act);
  else if (overlay === 'pause' && (Input.pressed.start || Input.pressed.b || Input.pressed.select)) overlayAct('resume');
}

// ---------------- menú
const menuScene = new THREE.Scene();
const menuMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }, res: { value: new THREE.Vector2(384, 216) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform float time; uniform vec2 res; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 p = floor(vUv * res) + 0.5;
      float hz = res.y * 0.36;
      vec3 col;
      if (p.y > hz) {
        float t = (p.y - hz) / (res.y - hz);
        col = mix(vec3(1.0, 0.42, 0.38), vec3(0.42, 0.12, 0.5), smoothstep(0.0, 0.5, t));
        col = mix(col, vec3(0.06, 0.03, 0.16), smoothstep(0.45, 1.0, t));
        vec2 sc = vec2(res.x * 0.5, hz + 28.0);
        float d = length(p - sc);
        float band = fract((sc.y - p.y) / 7.0 + time * 0.25);
        bool gap = p.y < sc.y - 2.0 && band < (sc.y - p.y) / 60.0 + 0.12;
        if (d < 40.0 && !gap) col = mix(vec3(1.0, 0.9, 0.38), vec3(1.0, 0.3, 0.58), clamp((sc.y + 40.0 - p.y) / 80.0, 0.0, 1.0));
        float h = hash(floor(p / 2.0));
        if (h > 0.986 && t > 0.4) col += vec3(0.75) * (0.5 + 0.5 * sin(time * 3.0 + h * 50.0));
      } else {
        float z = hz - p.y;
        float persp = 60.0 / (z + 2.0);
        float gx = (p.x - res.x * 0.5) * persp * 0.11;
        float gz = persp * 2.6 + time * 2.0;
        float lx = step(abs(fract(gx + 0.5) - 0.5), fwidth(gx) * 0.7);
        float lz = step(abs(fract(gz + 0.5) - 0.5), fwidth(gz) * 0.7);
        col = mix(vec3(0.09, 0.03, 0.16), vec3(0.03, 0.01, 0.08), z / hz);
        col = mix(col, vec3(1.0, 0.31, 0.6), max(lx, lz) * clamp(1.15 - z / hz * 0.35, 0.0, 1.0) * smoothstep(3.0, 16.0, z));
        col += vec3(1.0, 0.35, 0.5) * exp(-z * 0.18) * 0.55;
      }
      col = floor(col * 14.0 + 0.5) / 14.0;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const menuQuad = new THREE.Mesh(QUAD, menuMat);
menuQuad.position.z = -50;
menuScene.add(menuQuad);
const skyline = (() => {
  const { c, g } = mk(256, 60);
  const r = rng32(8);
  let x = 0;
  while (x < 256) {
    const w = 10 + ((r() * 18) | 0), h = 12 + ((r() * 44) | 0);
    R(g, '#140a2c', x, 60 - h, w, h);
    for (let k = 0; k < 4; k++) if (r() < 0.6) R(g, r() < 0.5 ? '#ff4f9a' : '#ffd36b', x + 2 + ((r() * (w - 4)) | 0), 60 - h + 3 + ((r() * (h - 6)) | 0));
    if (r() < 0.3) R(g, '#140a2c', x + (w >> 1), 60 - h - 6, 1, 6);
    x += w + 1;
  }
  const t = T(c); t.wrapS = THREE.RepeatWrapping;
  const m = new THREE.Mesh(QUAD, new THREE.MeshBasicMaterial({ map: t, alphaTest: 0.5 }));
  m.position.z = -40;
  menuScene.add(m);
  return { m, t };
})();
function drawMenuThumbs() {
  const RA = Rally.art;
  const hero = heroPose(HERO, { aim: 'dup', legF: RUN_LEG[0], legB: RUN_LEG[3], tf: 1 });
  // rally
  {
    const c = $('#cart-rally canvas'), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    R(g, '#4ea94b', 0, 0, 96, 64);
    for (let i = 0; i < 12; i++) disc(g, 6 + i * 9, 6 + (i % 2) * 3, 4, '#2f7d3b');
    R(g, '#3b3d50', 0, 22, 96, 18); R(g, '#3b3d50', 54, 0, 18, 64);
    for (let x = 0; x < 96; x += 8) R(g, '#e8dfb8', x, 30, 4, 2);
    R(g, '#bdb8cc', 0, 20, 54, 2); R(g, '#bdb8cc', 0, 40, 54, 2); R(g, '#bdb8cc', 72, 20, 24, 2); R(g, '#bdb8cc', 72, 40, 24, 2);
    R(g, '#c9694f', 74, 44, 22, 20); R(g, '#e89a7c', 74, 44, 22, 2);
    R(g, '#6f7fb8', 0, 44, 50, 20); R(g, '#9fb0e2', 0, 44, 50, 2);
    g.drawImage(rot90(RA.carPc[0], 1), 18, 22);
    g.drawImage(rot90(RA.carEc[0], 1), 0, 22);
    g.drawImage(RA.canSc[0], 56, 4);
    g.drawImage(RA.canNc[0], 74, 23);
    g.drawImage(rallySmoke(2), 2, 4);
  }
  // commando
  {
    const c = $('#cart-contra canvas'), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    for (let y = 0; y < 64; y++) { const t = y / 64; R(g, `rgb(${Math.round(40 + t * 210)},${Math.round(20 + t * 110)},${Math.round(90 + t * 10)})`, 0, y, 96, 1); }
    disc(g, 66, 34, 14, '#ffd36b');
    for (let y = 36; y < 48; y += 4) R(g, `rgb(${Math.round(40 + (y / 64) * 210)},${Math.round(20 + (y / 64) * 110)},100)`, 50, y, 32, 1);
    const r = rng32(4);
    for (let x = 0; x < 96;) { const w = 6 + ((r() * 10) | 0), h = 10 + ((r() * 24) | 0); R(g, '#2b1d4f', x, 52 - h, w, h); if (r() < 0.6) R(g, '#ffd36b', x + 2, 54 - h, 1, 1); x += w + 1; }
    R(g, '#a8a2bc', 0, 52, 96, 3); R(g, '#cfc9de', 0, 52, 96, 1); R(g, '#3b2f4f', 0, 55, 96, 9);
    g.drawImage(hero, 4, 13);
    for (let k = 0; k < 3; k++) { disc(g, 38 + k * 10, 20 - k * 8, 1.8, '#ffd23f'); R(g, '#ffffff', 38 + k * 10, 20 - k * 8); }
  }
  // próximamente
  {
    const c = $('#cart-soon canvas'), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    R(g, '#120d26', 0, 0, 96, 64);
    for (let y = 0; y < 64; y += 4) R(g, '#1a1434', 0, y, 96, 1);
    g.save(); g.translate(36, 14); g.scale(8, 8); glyph(g, '?', 0, 0, '#4fe3ff'); g.restore();
    g.save(); g.translate(39, 15); g.scale(8, 8); glyph(g, '?', 0, 0, '#ff4f9a'); g.restore();
  }
}
function refreshMenu() {
  $('#rec-rally').textContent = 'REC ' + pad6(Store.get('hi_rally', 0));
  $('#rec-contra').textContent = 'REC ' + pad6(Store.get('hi_contra', 0));
  document.querySelectorAll('.cart').forEach((c, i) => c.classList.toggle('sel', i === sel));
  const silent = Snd.isMuted() || Settings.musV + Settings.sfxV === 0;
  $('#optSound').textContent = Snd.isMuted() ? 'SONIDO OFF' : Settings.musV + Settings.sfxV === 0 ? 'VOLUMEN EN 0' : 'SONIDO ON';
  $('#optSound').classList.toggle('on', !silent);

  const fb = $('#optFull');
  fb.hidden = !fsOK || !!window.__NATIVE_APP || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  fb.textContent = isFull() ? 'SALIR PANT. COMPLETA' : 'PANTALLA COMPLETA';
  fb.classList.toggle('on', isFull());
}
function menuStep() {
  if (Input.pressed.left) { sel = (sel + 2) % 3; Snd.sfx('move'); refreshMenu(); }
  if (Input.pressed.right) { sel = (sel + 1) % 3; Snd.sfx('move'); refreshMenu(); }
  if (Input.pressed.a || Input.pressed.start) launch(sel);
  if (Input.pressed.select) openSettings('menu');
}
function launch(i) {
  Snd.unlock();
  sel = i; Store.set('cart', i); refreshMenu();
  if (i === 2) { Snd.sfx('back'); UI.toast('CARTUCHO 3 EN DESARROLLO · PRÓXIMAMENTE'); return; }
  Snd.sfx('start');
  $('#menu').hidden = true;
  mode = 'game';
  document.body.classList.remove('inmenu');
  game = i === 0 ? Rally : Contra;
  document.body.classList.toggle('g-rally', game === Rally);
  document.body.classList.toggle('g-contra', game === Contra);
  Input.reset();
  game.start();
  keepAwake(true);
}
function toMenu() {
  if (game) game.exit();
  Snd.loopsOff();
  keepAwake(false);
  game = null; mode = 'menu';
  document.body.classList.remove('g-rally', 'g-contra');
  document.body.classList.add('inmenu');
  UI.setHud(''); UI.setButtons('OK', 'VOLVER');
  $('#menu').hidden = false;
  Engine.flash = 0; Engine.shakeT = 0;
  refreshMenu();
  Snd.play(SONGS.menu);
  Input.reset();
}
// pantalla completa (navegador) y pantalla siempre encendida mientras se juega
const fsEl = document.documentElement;
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFull() {
  try {
    if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => UI.toast('ESTE NAVEGADOR NO PERMITE PANTALLA COMPLETA'));
    }
  } catch (e) { UI.toast('ESTE NAVEGADOR NO PERMITE PANTALLA COMPLETA'); }
}
let wake = null;
async function keepAwake(on) {
  try {
    if (on && !wake && navigator.wakeLock && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
}
function toggleSound() { Snd.unlock(); Snd.toggleMute(); refreshMenu(); Snd.sfx('select'); }
function toggleCrt() { Engine.crt = !Engine.crt; Store.set('crt', Engine.crt); refreshMenu(); if (overlay === 'settings') settingsChange('', 0); }

// ---------------- controles táctiles
function bindPad() {
  const dp = $('#dpad');
  let dpId = null;
  const T0 = Input.touch;
  const setDir = (cx, cy) => {
    const r = dp.getBoundingClientRect();
    const dx = (cx - (r.left + r.width / 2)) / (r.width / 2), dy = (cy - (r.top + r.height / 2)) / (r.height / 2);
    const th = 0.3;
    let L = dx < -th, Rr = dx > th, U = dy < -th, D = dy > th;
    if (Math.abs(dx) > Math.abs(dy) * 2.2) U = D = false;
    if (Math.abs(dy) > Math.abs(dx) * 2.2) L = Rr = false;
    for (const [k, v] of [['left', L], ['right', Rr], ['up', U], ['down', D]]) {
      if (v && !T0[k]) { Input.latch(k); UI.vibrate(6); }
      T0[k] = v;
    }
    dp.className = (U ? 'u ' : '') + (D ? 'd ' : '') + (L ? 'l ' : '') + (Rr ? 'r' : '');
  };
  const clearDir = () => { T0.left = T0.right = T0.up = T0.down = false; dp.className = ''; };
  dp.addEventListener('pointerdown', (e) => { e.preventDefault(); Snd.unlock(); dpId = e.pointerId; try { dp.setPointerCapture(e.pointerId); } catch (er) { /* */ } setDir(e.clientX, e.clientY); });
  dp.addEventListener('pointermove', (e) => { if (e.pointerId === dpId) setDir(e.clientX, e.clientY); });
  const endDp = (e) => { if (e.pointerId !== dpId) return; dpId = null; clearDir(); };
  dp.addEventListener('pointerup', endDp); dp.addEventListener('pointercancel', endDp); dp.addEventListener('lostpointercapture', endDp);
  const btn = (el, act) => {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); Snd.unlock();
      try { el.setPointerCapture(e.pointerId); } catch (er) { /* */ }
      T0[act] = true; Input.latch(act); el.classList.add('on'); UI.vibrate(8);
    });
    const up = () => { T0[act] = false; el.classList.remove('on'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  };
  btn($('#btnA'), 'a'); btn($('#btnB'), 'b'); btn($('#btnC'), 'c'); btn($('#btnD'), 'd'); btn($('#btnFix'), 'f'); btn($('#btnStart'), 'start'); btn($('#btnSel'), 'select');
}

// ---------------- layout responsivo
function layout() {
  const touch = matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches);
  Engine.touch = touch;
  const portrait = innerHeight > innerWidth;
  const b = document.body.classList;
  b.toggle('touch', touch); b.toggle('portrait', portrait); b.toggle('landscape', !portrait); b.toggle('short', innerHeight < 430);
  const st = $('#stage'), app = $('#app'), pad = $('#pad');
  const ovl = touch && !portrait;
  b.toggle('ovl', ovl);
  let aw, ah, minA = 1.2, maxA = 2.0;
  if (touch && portrait) {
    // vertical: pantalla de borde a borde (marco de 2px); los controles llenan el resto
    st.style.flex = '0 0 auto';
    aw = app.clientWidth - 4;
    ah = Math.max(120, app.clientHeight * 0.6 - 8);
    minA = 1.12;
  } else if (ovl) {
    // horizontal: el juego ocupa toda la pantalla y los controles van encima
    st.style.flex = ''; st.style.height = '';
    aw = app.clientWidth; ah = app.clientHeight;
    maxA = 2.4;
  } else {
    st.style.flex = ''; st.style.height = '';
    const cs = getComputedStyle(st);
    aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 20;
    ah = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 20;
  }
  if (aw < 50 || ah < 50) return;
  const aspect = clamp(aw / ah, minA, maxA);
  const W = Math.round((H * aspect) / 2) * 2;
  let sw = aw, sh = (sw * H) / W;
  if (sh > ah) { sh = ah; sw = (sh * W) / H; }
  sw = Math.floor(sw); sh = Math.floor(sh);
  if (touch && portrait) {
    st.style.height = sh + 8 + 'px';
    const ph = app.clientHeight - (sh + 8);
    pad.style.setProperty('--s', (clamp(Math.min(ph / 330, (app.clientWidth / 2 - 26) / 158), 0.7, 1.25) * PAD_K[Settings.pad]).toFixed(3));
  } else if (ovl) pad.style.setProperty('--s', (clamp(app.clientHeight / 360, 0.72, 1.15) * PAD_K[Settings.pad]).toFixed(3));
  else pad.style.setProperty('--s', 1);
  scr.style.width = sw + 'px'; scr.style.height = sh + 'px';
  scr.style.setProperty('--px', sh / H + 'px');
  const pr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3.2e6 / (sw * sh)));
  renderer.setPixelRatio(pr);
  renderer.setSize(sw, sh, false);
  setInternalWidth(W);
  menuMat.uniforms.res.value.set(W, H);
}

// ---------------- bucle de juego (paso fijo 60 Hz, render por frame)
let last = performance.now(), acc = 0;
function step(dt) {
  if (Engine.shakeT > 0) Engine.shakeT -= dt;
  if (toastT > 0 && (toastT -= dt) <= 0) $('#toast').hidden = true;
  if (overlay) overlayStep();
  else if (mode === 'menu') menuStep();
  else if (Input.pressed.start && !(game.capturesStart && game.capturesStart())) openPause();
  else game.update(dt);
}
function draw() {
  if (mode === 'menu') {
    const W = Engine.W;
    menuQuad.scale.set(W, H, 1); menuQuad.position.set(W / 2, -H / 2, -50);
    menuMat.uniforms.time.value = Engine.time;
    skyline.m.scale.set(W, 60, 1); skyline.m.position.set(W / 2, -(H * 0.64 - 30 + 1), -40);
    skyline.t.repeat.x = W / 256; skyline.t.offset.x = (Math.floor(Engine.time * 6) % 256) / 256;
    setCam(0, 0);
    renderScene(menuScene);
  } else game.render();
}
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  if (dt < 0) dt = 0;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { Input.poll(); step(STEP); Input.end(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  Engine.time += dt;
  Engine.flash = Math.max(0, Engine.flash - dt * 2.4);
  draw();
}

function boot() {
  Engine.crt = Store.get('crt', true);
  layout();
  bindPad();
  drawMenuThumbs();
  refreshMenu();
  $('#menu').hidden = false;
  document.body.classList.add('inmenu');
  document.querySelectorAll('.cart').forEach((c, i) => c.addEventListener('click', () => launch(i)));
  $('#optSound').addEventListener('click', toggleSound);
  $('#optSet').addEventListener('click', () => { Snd.unlock(); openSettings('menu'); });
  $('#optFull').addEventListener('click', toggleFull);
  document.addEventListener('fullscreenchange', () => { refreshMenu(); setTimeout(layout, 60); });
  document.addEventListener('webkitfullscreenchange', () => { refreshMenu(); setTimeout(layout, 60); });
  Input.onKey = (k) => { if (k === 'mute') toggleSound(); if (k === 'crt') toggleCrt(); };
  addEventListener('pointerdown', () => Snd.unlock(), { passive: true });
  addEventListener('resize', layout);
  addEventListener('orientationchange', () => setTimeout(layout, 120));
  if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('#stage'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (mode === 'game' && !overlay) openPause(); Snd.suspend(); }
    else { if (!overlay) Snd.resume(); if (mode === 'game') keepAwake(true); }
  });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  Snd.play(SONGS.menu);
  requestAnimationFrame((t) => { last = t; loop(t); });
}
// botón "atrás" de la app Android: pausa / vuelve / sale desde el menú
window.__androidBack = () => {
  if (overlay === 'settings') { closeSettings(); return 'ok'; }
  if (mode === 'menu') return 'exit';
  if (overlay === 'pause') overlayAct('resume');
  else if (overlay === 'over') overlayAct('menu');
  else openPause();
  return 'ok';
};
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(() => boot());
else boot();
